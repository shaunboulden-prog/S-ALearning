function confetti(){
  const colors=['#FBC02D','#FF9800','#66BB6A','#42A5F5','#FF7043','#4A90E2','#3BA55D'];
  let html='<div class="confetti">';
  for(let i=0;i<44;i++){const size=8+Math.random()*8;html+=`<span style="left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>0.5?'50%':'2px'};animation-delay:${Math.random()*0.3}s;animation-duration:${1.4+Math.random()*1.2}s"></span>`;}
  html+='</div>';
  const fx=document.getElementById('fx');fx.innerHTML=html;
  setTimeout(()=>{fx.innerHTML='';},2000);
}

function startActivity(gradeId,skillId){
  const grade=getGrade(gradeId)||getGrade('K');
  const skill=getSkill(gradeId,skillId)||grade.skills[0];
  AC={grade,skill,phase:0,qInPhase:0,gradedNum:0,status:'answering',typed:'',showHelp:false,feedback:'',lastReward:null,seconds:0,wrongTries:0,done:false,question:null,advanceTimer:null,demo:null};
  enterPhase(0);
}
// The difficulty each phase uses: Practice eases off, Challenge steps up, and
// Your Turn rides the live adaptive level for the skill.
function phaseDifficulty(){
  const base=getDifficulty(AC.skill.id);const id=PHASES[AC.phase].id;
  if(id==='practice')return clamp(base-1,1,3);
  if(id==='challenge')return clamp(base+1,3,5);
  return base;
}
// Move into a phase and set up whatever that phase needs.
function enterPhase(idx){
  if(idx>=PHASES.length)idx=PHASES.length-1;
  AC.phase=idx;AC.qInPhase=0;AC.status='answering';AC.feedback='';AC.typed='';AC.wrongTries=0;
  const p=PHASES[idx];
  if(p.id==='learn'){AC.done=false;prepareDemo();}
  else if(p.id==='minigame'){AC.done=false;mmInit('activity');}
  else if(p.id==='treasure'){
    AC.done=true;sound.win();confetti();
    if(!state.player.completedSkills.includes(AC.skill.id))state.player.completedSkills.push(AC.skill.id);
    checkBadges();
  }
  else{newQuestion();}
}
// A worked example for the Learn screen — generated at the easiest level.
function prepareDemo(){
  const preferred=AC.skill.types&&AC.skill.types.length===1?AC.skill.types[0]:undefined;
  try{AC.demo=generate(AC.skill,1,preferred);}catch(e){AC.demo=null;}
}
function newQuestion(){
  const d=phaseDifficulty();
  const preferred=AC.skill.types&&AC.skill.types.length===1?AC.skill.types[0]:undefined;
  AC.question=generate(AC.skill,d,preferred);
  const pid=PHASES[AC.phase].id;
  AC.qInPhase++;
  if(pid==='practice'||pid==='yourturn'||pid==='challenge')AC.gradedNum++;
  AC.status='answering';AC.typed='';
  AC.showHelp=(pid==='practice')||d<=1; // Practice is guided: helper always visible
  AC.feedback='';AC.wrongTries=0;AC.seconds=0;
  initInteractive(AC.question);
  speak(AC.question.prompt);
}
// Set up per-question interactive state for the hands-on activity types.
function initInteractive(q){
  if(q.type==='build')AC.build={h:0,t:0,o:0};
  else if(q.type==='array')AC.arr={rows:1,cols:1};
  else if(q.type==='money')AC.money={p:0,n:0,d:0,q:0};
  else if(q.type==='clock')AC.clock={h:12,m:0};
  else if(q.type==='order'){let arr=shuffle(q.nums);let g=0;while(arr.join(',')===q.sorted.join(',')&&g++<12)arr=shuffle(q.nums);AC.order=arr;AC.pick=null;}
  else if(q.type==='frame')AC.frame=Array(q.target>10?20:10).fill(false);
  else if(q.type==='coord')AC.coord=null;
  else if(q.type==='vol')AC.vol={l:1,w:1,h:1};
  else if(q.type==='fracbuild')AC.fracbuild=Array(q.denom).fill(false);
}
function startTimer(){
  stopTimer();
  if(!state.settings.timer)return;
  timerHandle=setInterval(()=>{if(AC&&AC.status==='answering'&&!AC.done){AC.seconds++;const el=document.getElementById('timerVal');if(el)el.textContent=AC.seconds;}},1000);
}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}}
function advance(){
  if(!AC)return;
  if(AC.advanceTimer){clearTimeout(AC.advanceTimer);AC.advanceTimer=null;}
  const p=PHASES[AC.phase];
  if(p.q>0&&AC.qInPhase<p.q){newQuestion();}      // more questions this phase
  else{enterPhase(AC.phase+1);}                     // on to the next lesson step
  render();
}
function applyResult(correct){
  if(!AC||AC.status==='correct')return;
  if(correct){
    AC.lastReward=awardCorrect(AC.skill.id,AC.question.difficulty);
    AC.status='correct';AC.feedback=pickOne(PRAISE);speak(AC.feedback);confetti();
    // Auto-advance to the next question after a short celebration.
    if(AC.advanceTimer)clearTimeout(AC.advanceTimer);
    AC.advanceTimer=setTimeout(()=>{AC.advanceTimer=null;if(state.route.name==='activity')advance();},1200);
  }else{
    registerWrong(AC.skill.id);AC.status='wrong';AC.wrongTries++;AC.showHelp=true;AC.feedback=pickOne(ENCOURAGE);speak(AC.feedback);
  }
  render();
}
function submitAnswer(value){ if(!AC||AC.status==='correct')return; applyResult(checkAnswer(AC.question,value)); }
// Grade the hands-on interactive widgets (build / money / clock / order).
function checkInteractive(){
  if(!AC||AC.status==='correct')return;
  const q=AC.question;let ok=false;
  if(q.type==='build')ok=(AC.build.h*100+AC.build.t*10+AC.build.o)===q.target;
  else if(q.type==='array')ok=(AC.arr.rows*AC.arr.cols===q.target&&AC.arr.rows>=2&&AC.arr.cols>=2);
  else if(q.type==='money')ok=(AC.money.q*25+AC.money.d*10+AC.money.n*5+AC.money.p)===q.target;
  else if(q.type==='clock')ok=(AC.clock.h===q.targetH&&AC.clock.m===q.targetM);
  else if(q.type==='order')ok=(AC.order.join(',')===q.sorted.join(','));
  else if(q.type==='frame')ok=(AC.frame.filter(Boolean).length===q.target);
  else if(q.type==='coord')ok=(!!AC.coord&&AC.coord.x===q.x&&AC.coord.y===q.y);
  else if(q.type==='vol')ok=(AC.vol.l*AC.vol.w*AC.vol.h===q.target&&AC.vol.l>=1&&AC.vol.w>=1&&AC.vol.h>=1);
  else if(q.type==='fracbuild')ok=(AC.fracbuild.filter(Boolean).length===q.target);
  applyResult(ok);
}

// ---- vertical "Lesson Steps" rail ----
function railHTML(){
  const steps=PHASES.map((p,i)=>{
    const st=i<AC.phase?'done':(i===AC.phase?'active':'todo');
    const badge=st==='done'?`<span class="rail-check">${ic('check',20)}</span>`:`<span class="rail-num">${i+1}</span>`;
    return `<div class="rail-step rail-step--${st}"><span class="rail-badge">${badge}</span><span class="rail-ic">${ic(p.icon,22)}</span><span class="rail-name">${esc(p.name)}</span></div>`;
  }).join('');
  return `<nav class="act-rail" aria-label="Lesson steps"><h3 class="rail-title">Lesson Steps</h3>${steps}</nav>`;
}

function questionScreen(){
  const {skill,question}=AC;const phase=PHASES[AC.phase];
  const d=question.difficulty;
  const diffLabel=['','Warm-up','Getting going','On track','Challenge','Super Challenge'][d]||'On track';
  let dots='';for(let i=0;i<GRADED_TOTAL;i++)dots+=`<span class="prog-dot ${i<AC.gradedNum-1?'past':i===AC.gradedNum-1?'now':''}"></span>`;
  const ellieMood=AC.status==='correct'?'celebrate':AC.status==='wrong'?'encourage':'think';
  const support=((AC.showHelp||question.difficulty<=1)&&question.support)?`<div class="question-support pulse-in">${manipHTML(question.support)}</div>`:'';
  let answerArea;
  if(question.type==='mc'){
    answerArea=`<div class="answers">${question.choices.map(ch=>{const right=String(ch)===String(question.answer);const reveal=AC.status==='correct'&&right;return `<button class="answer-btn num ${reveal?'answer--right':''}" ${AC.status==='correct'?'disabled':''} data-action="answer" data-choice="${esc(ch)}">${esc(ch)}</button>`;}).join('')}</div>`;
  }else if(question.type==='type'){
    answerArea=`<form class="answer-type" data-action="submit-type"><input id="typeInput" class="answer-input num" inputmode="numeric" value="${esc(AC.typed)}" placeholder="?" ${AC.status==='correct'?'disabled':''} aria-label="Type your answer"/><button type="submit" class="btn btn--blue" ${AC.status==='correct'?'disabled':''}>Check ${ic('check',16,'ic-inline')}</button></form>`;
  }else if(question.type==='build'){answerArea=buildWidget();}
  else if(question.type==='array'){answerArea=arrayWidget();}
  else if(question.type==='money'){answerArea=moneyWidget();}
  else if(question.type==='clock'){answerArea=clockWidget();}
  else if(question.type==='order'){answerArea=orderWidget();}
  else if(question.type==='frame'){answerArea=frameWidget();}
  else if(question.type==='coord'){answerArea=coordWidget();}
  else if(question.type==='vol'){answerArea=volumeWidget();}
  else if(question.type==='fracbuild'){answerArea=fracBuildWidget();}
  else{answerArea='';}
  let feedback='';
  if(AC.status!=='answering'){
    const cls=AC.status==='correct'?'feedback--yes':'feedback--try';
    const reward=AC.status==='correct'&&AC.lastReward?`<span class="feedback-reward"> +${AC.lastReward.coins}${ic('coin',18,'ic-inline')} +${AC.lastReward.stars}${ic('star',18,'ic-inline')}</span>`:'';
    const hint=AC.status==='wrong'?`<div class="feedback-hint">${ic('bulb',18,'ic-inline')} ${esc(question.hint)}${question.type==='type'&&AC.wrongTries>=2?` (The answer is ${esc(question.answer)}.)`:''}</div>`:'';
    feedback=`<div class="feedback ${cls} pulse-in">${esc(AC.feedback)}${reward}${hint}</div>`;
  }
  const nextP=PHASES[AC.phase+1];
  const lastOfPhase=AC.qInPhase>=phase.q;
  let controls='';
  if(AC.status==='answering'&&question.support&&!AC.showHelp)controls+=`<button class="btn btn--ghost" data-action="show-help">${ic('search',18,'ic-inline')} Show me a helper</button>`;
  if(AC.status==='wrong')controls+=`<button class="btn btn--orange" data-action="retry">${ic('retry',18,'ic-inline')} Try Again</button>`;
  if(AC.status==='correct')controls+=`<span class="next-hint">${lastOfPhase?(nextP?`On to ${esc(nextP.name)}… `:'Finishing… '):'Next question… '}${ic('play',15,'ic-inline')}</span>`;
  const timerChip=state.settings.timer?`<span class="chip">${ic('timer',20,'ic-inline')} <span class="num" id="timerVal">${AC.seconds}</span>s</span>`:'';
  const remember=(phase.id==='practice'&&AC.status!=='correct')?`<aside class="remember-note"><h4>Remember!</h4><p>${esc(question.hint)}</p></aside>`:'';
  const streakChip=state.session.streak>=2?`<span class="chip chip--streak">${ic('fire',18,'ic-inline')} ${state.session.streak} in a row!</span>`:'';
  return `<div class="act-card surface question-card ${AC.status==='wrong'?'shake':''}" style="--rc:${AC.grade.colors.primary};--rc2:${AC.grade.colors.secondary}">
    <div class="act-card-top">
      <button class="act-audio" data-action="hear-ellie" aria-label="Hear the question" title="Hear it">${ic('sound',22)}</button>
      <div class="activity-meta"><span class="chip">${ic('slider',18,'ic-inline')} ${diffLabel}</span><span class="chip">TEKS ${skill.teks}</span>${timerChip}${streakChip}</div>
      <div class="act-counter">Question ${AC.gradedNum} of ${GRADED_TOTAL}</div>
    </div>
    <div class="activity-progress">${dots}</div>
    <div class="question-ellie">${buddy(AC.grade.id,ellieMood,110)}</div>
    <p class="question-prompt num">${esc(question.prompt)}</p>
    ${question.emoji?`<div class="question-emoji">${question.emoji}</div>`:''}
    ${support}
    ${answerArea}
    ${feedback}
    <div class="activity-controls">${controls}</div>
    ${remember}
  </div>`;
}
function renderActivity(){
  if(!AC||AC.grade.id!==state.route.params.gradeId||AC.skill.id!==state.route.params.skillId){
    startActivity(state.route.params.gradeId,state.route.params.skillId);
  }
  const {grade}=AC;const phase=PHASES[AC.phase];
  let center;
  if(phase.id==='learn')center=learnScreen();
  else if(phase.id==='minigame')center=miniScreen();
  else if(phase.id==='treasure')center=treasureScreen();
  else center=questionScreen();
  const inner=`<div class="act-shell">${actRibbonHTML(grade)}<div class="act-body">${railHTML()}<main class="act-main">${center}</main></div></div>`;
  return sceneHTML(grade.colors,grade.scene,inner,phase.id==='treasure');
}

function buildWidget(){
  const b=AC.build,cur=b.h*100+b.t*10+b.o,dis=AC.status==='correct'?'disabled':'';
  const col=(place,label,val)=>`<div class="pv-col"><div class="pv-label">${label}</div><button class="pv-btn" data-action="build-add" data-place="${place}" ${dis}>＋</button><div class="pv-count num">${val}</div><button class="pv-btn" data-action="build-sub" data-place="${place}" ${dis}>－</button></div>`;
  return `<div class="build-widget"><div class="build-total">Your number: <span class="num">${fmt(cur)}</span></div><div class="pv-cols">${col('h','Hundreds',b.h)}${col('t','Tens',b.t)}${col('o','Ones',b.o)}</div>${cur>0?manipHTML({kind:'baseTen',n:cur}):''}<button class="btn btn--blue" data-action="check-interactive" ${dis}>Check ${ic('check',16,'ic-inline')}</button></div>`;
}
function arrayWidget(){
  const a=AC.arr,cur=a.rows*a.cols,dis=AC.status==='correct'?'disabled':'';
  const stepper=(dim,label)=>`<div class="pv-col"><div class="pv-label">${label}</div><button class="pv-btn" data-action="array-add" data-dim="${dim}" ${dis}>＋</button><div class="pv-count num">${a[dim]}</div><button class="pv-btn" data-action="array-sub" data-dim="${dim}" ${dis}>－</button></div>`;
  let dots='';for(let i=0;i<a.rows*a.cols;i++)dots+='<span class="array-dot"></span>';
  const grid=`<div class="array" style="grid-template-columns:repeat(${a.cols},1fr)">${dots}</div>`;
  return `<div class="build-widget"><div class="build-total">Your array: <span class="num">${a.rows} × ${a.cols} = ${cur}</span></div><div class="pv-cols">${stepper('rows','Rows')}${stepper('cols','Columns')}</div><div class="manip">${grid}</div><button class="btn btn--blue" data-action="check-interactive" ${dis}>Check ${ic('check',16,'ic-inline')}</button></div>`;

  return `<div class="build-widget"><div class="build-total">You filled: <span class="num">${filled}</span></div><div class="ten-frame-wrap ${AC.frame.length>10?'double':''}">${cells}</div><button class="btn btn--blue" data-action="check-interactive" ${dis?'disabled':''}>Check ${ic('check',16,'ic-inline')}</button></div>`;

// 5th grade: tap the point on a coordinate grid (TEKS 5.8C).
function coordWidget(){
  const q=AC.question,dis=AC.status==='correct',size=10;
  let cells='';
  for(let row=0;row<=size+1;row++){
    for(let col=0;col<=size+1;col++){
      if(row===size+1&&col===0){cells+='<span class="coord-cell"></span>';continue;}
      if(row===size+1){cells+=`<span class="coord-cell coord-label">${col-1}</span>`;continue;}
      if(col===0){cells+=`<span class="coord-cell coord-label">${size-row}</span>`;continue;}
      const x=col-1,y=size-row;
      const isPicked=AC.coord&&AC.coord.x===x&&AC.coord.y===y;
      const isTarget=dis&&q.x===x&&q.y===y;
      const cls=isTarget?'coord-dot--right':(isPicked?'coord-dot--picked':'');
      cells+=`<button class="coord-dot ${cls}" ${dis?'disabled':''} data-action="coord-tap" data-x="${x}" data-y="${y}" aria-label="(${x}, ${y})"></button>`;
    }

/* ---- Pattern Path: find the missing stepping stone ---- */
const PP_TIERS={
  K:{steps:[1,2],start:[1,8],count:5},'1':{steps:[1,2,5],start:[1,15],count:5},
  '2':{steps:[2,5,10],start:[1,40],count:5},'3':{steps:[5,10,25],start:[1,150],count:5},
  '4':{steps:[10,25,50,100],start:[10,400],count:5},'5':{steps:[0.5,0.25,2,3],start:[1,20],count:5},
};
function patternFor(gradeId){
  const cfg=PP_TIERS[gradeId]||PP_TIERS['2'];
  const step=pick(cfg.steps);const start=rnd(cfg.start[0],cfg.start[1]);
  const seq=[];for(let i=0;i<cfg.count;i++)seq.push(+(start+i*step).toFixed(2));
  const blankIdx=rnd(1,cfg.count-2);
  return {seq,step,blankIdx};
}
function ppChoices(seq,blankIdx,step){
  const answer=seq[blankIdx];const set=new Set([answer]);
  for(const d of [step,-step,step*2,-step*2,1,-1]){const c=+(answer+d).toFixed(2);if(c>=0&&!seq.includes(c))set.add(c);if(set.size>=4)break;}
  let pad=1;while(set.size<4){const c=+(answer+pad).toFixed(2);if(!seq.includes(c))set.add(c);pad++;}
  return shuffle([...set]);
}
let PP=null;
function ppNewRound(){const {seq,step,blankIdx}=patternFor(miniGrade);PP.seq=seq;PP.blankIdx=blankIdx;PP.choices=ppChoices(seq,blankIdx,step);PP.status='answering';}
function ppInit(){PP={round:1,rounds:6,score:0,done:false};ppNewRound();}
function ppTap(val){
  if(!PP||PP.status!=='answering')return;
  const correct=+val===PP.seq[PP.blankIdx];

}

/* ---- Sorting Race: tap-to-swap tiles into order, least to greatest ---- */
function srValuesFor(gradeId){
  const make={
    K:()=>Array.from({length:5},()=>rnd(1,20)),'1':()=>Array.from({length:5},()=>rnd(1,120)),
    '2':()=>Array.from({length:5},()=>rnd(1,1200)),'3':()=>Array.from({length:5},()=>rnd(1,100000)),
    '4':()=>Array.from({length:5},()=>rnd(1,1000000)),'5':()=>Array.from({length:5},()=>+(rnd(1,999)/10).toFixed(1)),
  }[gradeId]||(()=>Array.from({length:5},()=>rnd(1,1200)));
  let vals=make();let guard=0;while(new Set(vals).size<vals.length&&guard++<20)vals=make();
  return vals;
}
let SR=null;
function srNewRound(){SR.values=srValuesFor(miniGrade);SR.order=shuffle(SR.values);SR.sorted=[...SR.values].sort((a,b)=>a-b);SR.pick=null;SR.status='answering';}

}

    controls=`<div class="pv-cols">${col('h','Hundreds',TM.build.h)}${col('t','Tens',TM.build.t)}${col('o','Ones',TM.build.o)}</div>`;
  }
  return `<div class="game-panel">
    <p class="game-hint">Round ${TM.round} of ${TM.rounds}</p>
    <p class="game-ask">Make exactly <span class="num" style="color:var(--treasure-orange)">${TM.mode==='money'?TM.target+'¢':fmt(TM.target)}</span></p>
    <div class="build-total">Your total: <span class="num">${TM.mode==='money'?cur+'¢':fmt(cur)}</span></div>
    ${controls}
    ${TM.status==='correct'?`<p class="feedback feedback--yes">Exactly right!</p>`:''}
    <button class="btn btn--ghost game-back" data-action="game-exit">${ic('back',14,'ic-inline')} Back</button>
  </div>`;
}

/* ---- Picture Match: second memory-pairs game, content swaps by grade ---- */
function pmFracBar(n,d){let p='';for(let i=0;i<d;i++)p+=`<span class="pm-frac-part ${i<n?'on':''}"></span>`;return `<span class="pm-fracbar">${p}</span>`;}
const PM_WORDS=['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
function pmUnique(genOne,count,maxTry){const used=new Set();const out=[];let tries=0;while(out.length<count&&tries++<(maxTry||60)){const p=genOne();if(used.has(p.key))continue;used.add(p.key);out.push(p);}return out;}
function pmPairsFor(gradeId){
  if(gradeId==='K'||gradeId==='1'){
    const nums=shuffle(Array.from({length:10},(_,i)=>i+1)).slice(0,4);
    return nums.map(n=>({key:'w'+n,faceA:`<span class="num">${n}</span>`,faceB:`<span class="pm-word">${PM_WORDS[n-1]}</span>`}));
  }
  if(gradeId==='2'){
    return pmUnique(()=>{const t=rnd(1,9)*10,o=rnd(1,9),n=t+o;return {key:'e'+n,faceA:`<span class="num">${n}</span>`,faceB:`<span class="pm-word">${t} + ${o}</span>`};},4);
  }
  if(gradeId==='3'||gradeId==='4'){
    const denoms=[2,3,4,5,6,8];
    return pmUnique(()=>{const d=pick(denoms),n=rnd(1,d-1);return {key:'f'+n+'-'+d,faceA:`<span class="num">${n}/${d}</span>`,faceB:pmFracBar(n,d)};},4);
  }
  return pmUnique(()=>{const n=rnd(1,9);return {key:'d'+n,faceA:`<span class="num">0.${n}</span>`,faceB:`<span class="pm-word">${n}/10</span>`};},4);
}
let PM=null;
function pmInit(){
  const pairs=pmPairsFor(miniGrade);const cards=[];
  pairs.forEach((p,i)=>{cards.push({key:p.key,face:p.faceA,id:i*2});cards.push({key:p.key,face:p.faceB,id:i*2+1});});
  PM={deck:shuffle(cards),flipped:[],matched:[],lock:false};
}
function pmFlip(id){
  if(!PM||PM.lock)return;const card=PM.deck.find(c=>c.id===id);
  if(!card||PM.flipped.includes(id)||PM.matched.includes(card.key))return;
  sound.click();PM.flipped.push(id);
  if(PM.flipped.length===2){
    PM.lock=true;const [a,b]=PM.flipped.map(i=>PM.deck.find(c=>c.id===i));
    if(a.key===b.key){setTimeout(()=>{PM.matched.push(a.key);PM.flipped=[];PM.lock=false;sound.coin();awardMini(4,1);if(PM.matched.length===4){sound.win();confetti();render();}else renderGamePanel();},450);}
    else{setTimeout(()=>{PM.flipped=[];PM.lock=false;renderGamePanel();},800);}
  }
  renderGamePanel();
}
function pmHTML(){
  if(!PM)return '';
  if(PM.matched.length===4)return miniFinishHTML('You matched them all!','Great memory work, Explorer!','pm-again');
  const cards=PM.deck.map(c=>{const show=PM.flipped.includes(c.id)||PM.matched.includes(c.key);return `<button class="mm-card ${show?'flipped':''}" data-action="pm-flip" data-id="${c.id}" aria-label="${show?'card':'Hidden card'}"><span class="mm-face mm-back">${ic('leaf',34)}</span><span class="mm-face mm-front">${c.face}</span></button>`;}).join('');
  return `<div class="mm"><p class="mm-hint">Match each pair!</p><div class="mm-grid">${cards}</div><button class="btn btn--ghost game-back" data-action="game-exit">${ic('back',18,'ic-inline')} Back</button></div>`;
}

/* ---- Mini Games hub: grade picker + dispatch across all 8 games ---- */
let miniGrade='2';
let miniActive=null; // null | one of MINI_GAMES ids
const GAME_HTML={'memory-match':mmHTML,'treasure-tap':ttHTML,'pattern-path':ppHTML,'speedy-sprint':ssHTML,'true-false':tfHTML,'sorting-race':srHTML,'target-match':tmHTML,'picture-match':pmHTML};
const GAME_INIT={'memory-match':()=>mmInit(),'treasure-tap':ttInit,'pattern-path':ppInit,'speedy-sprint':ssInit,'true-false':tfInit,'sorting-race':srInit,'target-match':tmInit,'picture-match':pmInit};
function currentGameHTML(){const fn=GAME_HTML[miniActive];return fn?fn():'';}
function gradeChipsHTML(){
  return `<div class="mg-grade-picker">${GRADES.map(g=>`<button class="mg-grade-chip ${miniGrade===g.id?'active':''}" style="--rc:${g.colors.primary};--rc2:${g.colors.secondary}" data-action="mini-grade" data-id="${g.id}">${ic(g.icon,22)}<span>${g.label}</span></button>`).join('')}</div>`;
}
function renderMiniGames(){
  let body;
  if(miniActive){
    body=`<section class="surface mm-wrap"><div id="gamePanel">${currentGameHTML()}</div></section>`;
  }else{
    const cards=MINI_GAMES.map((g,i)=>`<button class="card mg-card" style="animation-delay:${i*0.07}s" data-action="mini-open" data-id="${g.id}"><span class="mg-icon">${ic(g.icon,54)}</span><span class="mg-name">${g.name}</span><span class="mg-blurb">${g.blurb}</span><span class="mg-play">Play ${ic('play',14,'ic-inline')}</span></button>`).join('');
    body=`<div class="fade-up">${speechHTML("Take a break and play! Mini games make your brain stronger too.",'wave',130)}</div><h1 class="mg-title fade-up">${ic('gamepad',30,'ic-inline')} Jungle Mini Games</h1><p class="mg-grade-label fade-up">Playing at: <strong>${getGrade(miniGrade).label}</strong> level</p>${gradeChipsHTML()}<div class="grid-cards mg-grid">${cards}</div>`;
  }
  const inner=`${hudHTML(true,'home')}<main class="container minigames">${body}</main>`;
  return sceneHTML(GRADES[1].colors,'bamboo',inner);
}

/* ---------------- achievements ---------------- */
function renderAchievements(){
  const p=state.player;const earned=new Set(p.badges);
  const stats=[{icon:'coin',label:'Coins',val:p.coins},{icon:'star',label:'Stars',val:p.stars},{icon:'gem',label:'Adventure Points',val:p.points},{icon:'compass',label:'Explorer Level',val:levelOf()},{icon:'fire',label:'Best Streak',val:p.bestStreak},{icon:'map',label:'Regions Explored',val:p.visitedRegions.length}];
  const statCards=stats.map(s=>`<div class="ach-stat surface"><span class="ach-stat-icon">${ic(s.icon,40)}</span><span class="num ach-stat-val">${s.val}</span><span class="ach-stat-label">${s.label}</span></div>`).join('');
  const badgeCards=BADGES.map(b=>{const got=earned.has(b.id);return `<div class="ach-badge surface ${got?'got':'locked'}"><span class="ach-badge-icon">${got?ic(b.icon,48):ic('lock',48)}</span><span class="ach-badge-name">${b.name}</span><span class="ach-badge-desc">${b.desc}</span>${got?`<span class="ach-badge-earned">Earned! ${ic('check',16,'ic-inline')}</span>`:''}</div>`;}).join('');
  const inner=`${hudHTML(true,'home')}<main class="container achieve">
    <div class="fade-up">${speechHTML("Look at all your treasures! Every badge is a piece of your adventure.",'celebrate',130)}</div>
    <h1 class="ach-title fade-up">${ic('medal',30,'ic-inline')} My Achievements</h1>
    <p class="ach-note">In Version 1 your progress is saved for this visit only — accounts and permanent trophies are coming soon!</p>
    <section class="ach-stats grid-cards">${statCards}</section>
    <h2 class="ach-sub">Badge Collection</h2>
    <section class="ach-badges grid-cards">${badgeCards}</section></main>`;
  return sceneHTML(GRADES[3].colors,'temple',inner);
}

/* ---------------- settings ---------------- */
function toggleRow(key,label,desc,icon){
  return `<div class="set-row"><div class="set-row-text"><span class="set-row-label">${ic(icon,22,'ic-inline')} ${label}</span><span class="set-row-desc">${desc}</span></div>
    <button role="switch" aria-checked="${state.settings[key]}" aria-label="${label}" class="toggle ${state.settings[key]?'on':''}" data-action="toggle" data-key="${key}"><span class="toggle-knob"></span></button></div>`;
}
function renderSettings(){
  const inner=`${hudHTML(true,'home')}<main class="container settings">
    <div class="fade-up">${speechHTML("Make the jungle just right for you! Turn things on or off any time.",'point',120)}</div>
    <h1 class="set-title fade-up">${ic('gear',30,'ic-inline')} Settings</h1>
    <section class="surface set-group"><h2>${ic('sound',24,'ic-inline')} Sound</h2>
      ${toggleRow('music','Music','Gentle jungle adventure music.','music')}
      ${toggleRow('sfx','Sound Effects','Coins, clicks, and celebrations.','sparkle')}
      ${toggleRow('narration','Narration','Off by default. Turn on and Ellie reads aloud in her sweet voice — turn off any time.','speech')}
      <div class="set-row"><div class="set-row-text"><span class="set-row-label">${ic('sound',22,'ic-inline')} Hear Ellie</span><span class="set-row-desc">Tap to listen to a sample of Ellie's voice.</span></div>
      <button class="btn btn--blue" data-action="hear-ellie">${ic('play',16,'ic-inline')} Play sample</button></div>
    </section>
    <section class="surface set-group"><h2>${ic('access',24,'ic-inline')} Accessibility</h2>
      ${toggleRow('highContrast','High Contrast','Stronger colors and outlines.','contrast')}
      ${toggleRow('largeText','Large Text','Make all words bigger.','text')}
      ${toggleRow('reducedMotion','Reduced Motion','Calm the animations.','wind')}
      ${toggleRow('readableFont','Reader Font','Switch to the easy-reading Lexend font.','book')}
      ${toggleRow('timer','Optional Timer','Show a gentle timer — never counts against you.','timer')}
    </section>
    <section class="surface set-group"><h2>${ic('globe',24,'ic-inline')} Language</h2>
      <div class="set-row"><div class="set-row-text"><span class="set-row-label">${ic('speech',22,'ic-inline')} Language</span><span class="set-row-desc">More languages are coming soon!</span></div>
      <select class="set-select" disabled aria-label="Language (coming soon)"><option>English</option></select></div>
    </section>
    <section class="surface set-group"><h2>${ic('map',24,'ic-inline')} Progress</h2>
      <div class="set-row"><div class="set-row-text"><span class="set-row-label">${ic('retry',22,'ic-inline')} Your adventure is saved automatically</span><span class="set-row-desc">Coins, stars, badges, and settings stay right where you left them, even after closing the page.</span></div></div>
      <div class="set-row"><div class="set-row-text"><span class="set-row-label">${ic('lock',22,'ic-inline')} Reset My Progress</span><span class="set-row-desc">Starts a brand new adventure — clears coins, stars, badges, and levels. This can't be undone.</span></div>
      <button class="btn btn--ghost" data-action="reset-progress">${ic('retry',16,'ic-inline')} Reset</button></div>
    </section>
    <p class="set-foot">More options — screen reader tuning, dyslexia font, and SPED accommodations — are on the way.</p></main>`;
  return sceneHTML(GRADES[4].colors,'caves',inner);
}

/* ---------------- about ---------------- */
function renderAbout(){
  const regions=GRADES.map(g=>`<span class="chip">${ic(g.icon,22)} ${g.region} · ${g.label}</span>`).join('');
  const inner=`${hudHTML(true,'home')}<main class="container about">
    <div class="fade-up">${speechHTML("Hi! I'm Ellie. Welcome to MathQuest Jungle — let me tell you about our world!",'wave',150)}</div>
    <section class="surface about-card fade-up">
      <h1>About MathQuest Jungle</h1>
      <p>MathQuest Jungle turns math practice into a living adventure. Kindergarten through 5th grade explorers travel through one magical jungle, unlocking a new region for every grade while mastering the <strong>Texas Essential Knowledge and Skills (TEKS)</strong>.</p>
      <p>Every question adapts to how you're doing — get a few right and the jungle grows more challenging; need a hand and Ellie brings out helpers like ten frames, number lines, and fraction bars. There's no losing here. Every try moves the adventure forward.</p>
      <h2>${ic('palm',24,'ic-inline')} The Six Regions</h2><div class="about-regions">${regions}</div>
      <h2>${ic('heart',24,'ic-inline')} Our Promise</h2><p>No ads. No logins. No shame — only encouragement. Just a cozy jungle where every explorer feels capable, supported, and excited to keep going.</p>
      <p class="about-version">Version 1 · Built for curious young explorers.</p>
      <button class="btn btn--xl btn--gold" data-action="nav" data-name="map">${ic('map',20,'ic-inline')} Start Exploring</button>
    </section></main>`;
  return sceneHTML(GRADES[5].colors,'canopy',inner);
}

/* ---------------- render dispatch ---------------- */
function render(){
  stopTimer();
  applySettings();
  const map={home:renderHome,map:renderMap,region:renderRegion,activity:renderActivity,minigames:renderMiniGames,achievements:renderAchievements,settings:renderSettings,about:renderAbout};
  const fn=map[state.route.name]||renderHome;
  document.getElementById('app').innerHTML=fn();
  if(state.route.name==='activity'&&AC&&!AC.done){
    startTimer();
    if(AC.question&&AC.question.type==='type'&&AC.status!=='correct'){const inp=document.getElementById('typeInput');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
  }
  saveState();
}

/* ---------------- events ---------------- */
document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const a=t.dataset.action;
  if(a==='nav'){sound.click();const params=t.dataset.params?JSON.parse(t.dataset.params):{};navigate(t.dataset.name,params);return;}
  if(a==='answer'){submitAnswer(t.dataset.choice);return;}
  if(a==='show-help'){sound.click();AC.showHelp=true;render();return;}
  if(a==='retry'){AC.status='answering';AC.typed='';render();return;}
  if(a==='next'){sound.click();advance();return;}
  if(a==='play-again'){sound.click();startActivity(AC.grade.id,AC.skill.id);render();return;}
  if(a==='learn-start'){sound.click();enterPhase(1);render();return;}
  if(a==='mini-continue'||a==='mini-skip'){sound.click();enterPhase(5);render();return;}
  if(a==='toggle'){sound.click();const k=t.dataset.key;state.settings[k]=!state.settings[k];if(k==='narration'&&!state.settings.narration&&'speechSynthesis'in window)window.speechSynthesis.cancel();render();return;}
  if(a==='mini-open'){sound.click();const id=t.dataset.id;miniActive=id;(GAME_INIT[id]||(()=>{}))();if(!state.player.playedGames.includes(id))state.player.playedGames.push(id);checkBadges();render();return;}
  if(a==='mini-grade'){sound.click();miniGrade=t.dataset.id;if(miniActive)(GAME_INIT[miniActive]||(()=>{}))();render();return;}
  if(a==='mm-flip'){mmFlip(Number(t.dataset.id));return;}
  if(a==='mm-exit'){sound.click();miniActive=null;MM=null;render();return;}
  if(a==='game-exit'){sound.click();clearMiniTimer();miniActive=null;TT=PP=SS=TF=SR=TM=PM=null;render();return;}
  if(a==='tt-tap'){ttTap(t.dataset.choice);return;}
  if(a==='tt-again'){sound.click();ttInit();render();return;}
  if(a==='pp-tap'){ppTap(t.dataset.val);return;}
  if(a==='pp-again'){sound.click();ppInit();render();return;}
  if(a==='ss-tap'){ssTap(t.dataset.choice);return;}
  if(a==='ss-again'){sound.click();ssInit();render();return;}
  if(a==='tf-tap'){tfTap(t.dataset.val==='true');return;}
  if(a==='tf-again'){sound.click();tfInit();render();return;}
  if(a==='sr-tap'){srTap(Number(t.dataset.idx));return;}
  if(a==='sr-check'){srCheck();return;}
  if(a==='sr-again'){sound.click();srInit();render();return;}
  if(a==='tm-add'){tmAdjust(t.dataset.key,1);return;}
  if(a==='tm-sub'){tmAdjust(t.dataset.key,-1);return;}
  if(a==='tm-again'){sound.click();tmInit();render();return;}
  if(a==='pm-flip'){pmFlip(Number(t.dataset.id));return;}
  if(a==='pm-again'){sound.click();pmInit();render();return;}
  if(a==='hear-ellie'){sound.click();previewVoice();return;}
  if(a==='reset-progress'){sound.click();if(confirm("Reset all progress? Coins, stars, badges, and levels will go back to zero. This can't be undone.")){resetProgress();navigate('home');}return;}
  // ---- interactive activity controls (guard against edits after solved) ----
  if(a==='build-add'){if(AC.status==='correct')return;AC.build[t.dataset.place]=Math.min(20,AC.build[t.dataset.place]+1);sound.click();render();return;}
  if(a==='build-sub'){if(AC.status==='correct')return;AC.build[t.dataset.place]=Math.max(0,AC.build[t.dataset.place]-1);sound.click();render();return;}
  if(a==='array-add'){if(AC.status==='correct')return;AC.arr[t.dataset.dim]=Math.min(12,AC.arr[t.dataset.dim]+1);sound.click();render();return;}
  if(a==='array-sub'){if(AC.status==='correct')return;AC.arr[t.dataset.dim]=Math.max(1,AC.arr[t.dataset.dim]-1);sound.click();render();return;}
  if(a==='money-add'){if(AC.status==='correct')return;AC.money[t.dataset.coin]=Math.min(50,AC.money[t.dataset.coin]+1);sound.click();render();return;}
  if(a==='money-sub'){if(AC.status==='correct')return;AC.money[t.dataset.coin]=Math.max(0,AC.money[t.dataset.coin]-1);sound.click();render();return;}
  if(a==='clock-hour'){if(AC.status==='correct')return;const dir=Number(t.dataset.dir);AC.clock.h=((AC.clock.h-1+dir+12)%12)+1;sound.click();render();return;}
  if(a==='clock-min'){if(AC.status==='correct')return;const dir=Number(t.dataset.dir);AC.clock.m=(AC.clock.m+dir*5+60)%60;sound.click();render();return;}
  if(a==='order-tap'){if(AC.status==='correct')return;const idx=Number(t.dataset.idx);if(AC.pick==null){AC.pick=idx;}else if(AC.pick===idx){AC.pick=null;}else{const tmp=AC.order[AC.pick];AC.order[AC.pick]=AC.order[idx];AC.order[idx]=tmp;AC.pick=null;}sound.click();render();return;}
  if(a==='frame-toggle'){if(AC.status==='correct')return;const idx=Number(t.dataset.idx);AC.frame[idx]=!AC.frame[idx];sound.click();render();return;}
  if(a==='coord-tap'){if(AC.status==='correct')return;AC.coord={x:Number(t.dataset.x),y:Number(t.dataset.y)};sound.click();render();return;}
  if(a==='vol-add'){if(AC.status==='correct')return;AC.vol[t.dataset.dim]=Math.min(12,AC.vol[t.dataset.dim]+1);sound.click();render();return;}
  if(a==='vol-sub'){if(AC.status==='correct')return;AC.vol[t.dataset.dim]=Math.max(1,AC.vol[t.dataset.dim]-1);sound.click();render();return;}
  if(a==='frac-toggle'){if(AC.status==='correct')return;const idx=Number(t.dataset.idx);AC.fracbuild[idx]=!AC.fracbuild[idx];sound.click();render();return;}
  if(a==='check-interactive'){checkInteractive();return;}
});
// Drag-and-drop for the ordering activity (desktop); tap-to-swap covers touch.
let DRAG_IDX=null;
document.addEventListener('dragstart',(e)=>{const t=e.target.closest('.order-tile');if(t){DRAG_IDX=Number(t.dataset.idx);}});
document.addEventListener('dragover',(e)=>{if(e.target.closest('.order-tile'))e.preventDefault();});
document.addEventListener('drop',(e)=>{const t=e.target.closest('.order-tile');if(t&&DRAG_IDX!=null&&AC&&AC.order&&AC.status!=='correct'){const to=Number(t.dataset.idx);const item=AC.order.splice(DRAG_IDX,1)[0];AC.order.splice(to,0,item);DRAG_IDX=null;AC.pick=null;render();}});
document.addEventListener('submit',(e)=>{
  const f=e.target.closest('[data-action="submit-type"]');if(!f)return;
  e.preventDefault();const inp=document.getElementById('typeInput');if(inp&&inp.value!==''){AC.typed=inp.value;submitAnswer(inp.value);}
});
document.addEventListener('input',(e)=>{if(e.target.id==='typeInput'&&AC)AC.typed=e.target.value;});
// Shrink the top bar as the page scrolls down (capture phase catches the
// inner .scene-content scroll, which doesn't bubble).
document.addEventListener('scroll',(e)=>{const t=e.target;if(t&&t.classList&&t.classList.contains('scene-content')){t.classList.toggle('scrolled',t.scrollTop>16);}},true);

/* ---------------- boot ---------------- */
loadState(); // restore coins/stars/badges/settings from last visit, if any
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)state.settings.reducedMotion=true;
pickVoice(); // warm up voice selection (also re-runs on voiceschanged)
render();
// Belt-and-suspenders: catch the moments a render()-triggered save might miss
// (e.g. closing the tab mid-timer, or a tablet backgrounding the app).
window.addEventListener('beforeunload',saveState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveState();});
</script>
</body>
