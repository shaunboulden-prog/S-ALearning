<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#1B5E20" />
<title>MathQuest Jungle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============ palette / fonts / a11y ============ */
:root{
  --jungle-green:#3BA55D; --deep-forest:#1B5E20; --sky-blue:#42A5F5; --elephant-blue:#4A90E2;
  --golden-yellow:#FBC02D; --treasure-orange:#FF9800; --success-green:#66BB6A; --alert-coral:#FF7043;
  --bg-cream:#FFFDF6; --soft-white:#FAFAFA;
  --ink:#22331f; --ink-soft:#4a5a45; --card:#fff;
  --shadow-soft:0 10px 30px rgba(27,94,32,.18); --shadow-lift:0 18px 44px rgba(27,94,32,.26);
  --radius-lg:28px; --radius-md:20px;
  --font-primary:'Fredoka',system-ui,sans-serif; --font-secondary:'Nunito',system-ui,sans-serif;
  --font-number:'Baloo 2','Fredoka',system-ui,sans-serif;
  --motion-scale:1; --text-scale:1; --anim-fast:200ms; --anim-med:350ms; --anim-slow:500ms;
  --wood-1:#6d4726; --wood-2:#4e3218; --wood-3:#8a5f36; --wood-edge:#3a2411; --wood-gold:#f3c34d;
}
.opt-large-text{--text-scale:1.18;}
.opt-high-contrast{--ink:#06120a;--ink-soft:#12241a;--bg-cream:#fff;--card:#fff;--jungle-green:#1c7a3a;--elephant-blue:#1b63c9;--shadow-soft:0 0 0 3px #06120a;--shadow-lift:0 0 0 4px #06120a;}
.opt-high-contrast .surface,.opt-high-contrast .card{border:3px solid #06120a!important;}
.opt-reduced-motion *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}}
.opt-readable-font{--font-primary:'Lexend',sans-serif;--font-secondary:'Lexend',sans-serif;--font-number:'Lexend',sans-serif;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--font-secondary);font-size:calc(18px*var(--text-scale));color:var(--ink);background:var(--bg-cream);-webkit-font-smoothing:antialiased;overflow:hidden;}
h1,h2,h3{font-family:var(--font-primary);font-weight:600;line-height:1.05;margin:0 0 .4em;}
.num{font-family:var(--font-number);font-weight:700;}
button{font-family:var(--font-primary);}
:focus-visible{outline:4px solid var(--golden-yellow);outline-offset:3px;border-radius:8px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.surface{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);}
.container{width:min(1180px,92vw);margin:0 auto;}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);color:var(--deep-forest);border-radius:999px;padding:6px 14px;font-weight:700;font-family:var(--font-number);box-shadow:var(--shadow-soft);}
/* buttons */
.btn{--btn-bg:var(--jungle-green);--btn-ink:#fff;appearance:none;border:none;cursor:pointer;color:var(--btn-ink);background:var(--btn-bg);font-size:calc(1.05rem*var(--text-scale));font-weight:600;padding:.85em 1.5em;border-radius:999px;box-shadow:0 8px 0 rgba(0,0,0,.14),var(--shadow-soft);transition:transform var(--anim-fast) cubic-bezier(.34,1.56,.64,1),filter var(--anim-fast) ease;display:inline-flex;align-items:center;gap:.5em;min-height:56px;}
.btn:hover{filter:brightness(1.05);transform:translateY(calc(-2px*var(--motion-scale)));}
.btn:active{transform:translateY(calc(3px*var(--motion-scale)));box-shadow:0 3px 0 rgba(0,0,0,.14);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn--xl{font-size:calc(1.45rem*var(--text-scale));padding:1em 2em;min-height:72px;}
.btn--gold{--btn-bg:var(--golden-yellow);--btn-ink:#5a3d00;}
.btn--orange{--btn-bg:var(--treasure-orange);}
.btn--blue{--btn-bg:var(--elephant-blue);}
.btn--ghost{--btn-bg:rgba(255,255,255,.9);--btn-ink:var(--deep-forest);box-shadow:0 6px 0 rgba(27,94,32,.18);}
.grid-cards{display:grid;gap:clamp(14px,2.4vw,24px);}
.card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);padding:22px;transition:transform var(--anim-med) cubic-bezier(.34,1.56,.64,1),box-shadow var(--anim-med) ease;cursor:pointer;text-align:left;border:none;width:100%;position:relative;overflow:hidden;}
.card:hover{transform:translateY(calc(-6px*var(--motion-scale)));box-shadow:var(--shadow-lift);}
.fade-up{animation:fadeUp var(--anim-slow) ease both;}
/* keyframes */
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
@keyframes swayX{0%,100%{transform:translateX(-6px) rotate(-1deg);}50%{transform:translateX(6px) rotate(1deg);}}
@keyframes drift{from{transform:translateX(-8vw);}to{transform:translateX(110vw);}}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(-24px) rotate(8deg);}}
@keyframes pop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
@keyframes sparkle{0%,100%{opacity:.2;transform:scale(.7);}50%{opacity:1;transform:scale(1.2);}}
@keyframes shakeX{0%,100%{transform:translateX(0);}20%{transform:translateX(-10px);}40%{transform:translateX(10px);}60%{transform:translateX(-7px);}80%{transform:translateX(7px);}}
@keyframes confettiFall{to{transform:translateY(105vh) rotate(720deg);opacity:.9;}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(251,192,45,.4));}50%{filter:drop-shadow(0 0 16px rgba(251,192,45,.9));}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-8px) rotate(2deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes leafFall{0%{transform:translateY(-10vh) rotate(0);opacity:0;}10%{opacity:1;}100%{transform:translateY(112vh) translateX(40px) rotate(360deg);opacity:.8;}}
@keyframes fall{from{top:-40%;}to{top:120%;}}
/* ============ scene ============ */
#app{position:relative;height:100%;}
.scene{position:fixed;inset:0;overflow:hidden;z-index:0;}
.scene-content{position:relative;z-index:5;height:100vh;overflow-y:auto;}
.scene-sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--c-sky) 0%,#FFFDF6 62%,var(--c-sky) 130%);}
.scene-sun{position:absolute;top:-80px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(251,192,45,.55),rgba(251,192,45,0) 70%);animation:glow 6s ease-in-out infinite;}
.scene-hills{position:absolute;left:0;width:100%;bottom:0;}
.scene-cloud{position:absolute;left:-12%;font-size:3rem;opacity:.85;animation:drift linear infinite;}
.scene-bird{position:absolute;left:-8%;font-size:1.6rem;animation:drift linear infinite;}
.scene-butterfly{position:absolute;font-size:1.8rem;animation:flutter ease-in-out infinite;}
.scene-firefly{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#FFF59D,#FBC02D);box-shadow:0 0 8px 2px rgba(251,192,45,.8);animation:sparkle ease-in-out infinite;}
.scene-leaf{position:absolute;top:-6%;font-size:1.5rem;animation:leafFall linear infinite;}
.scene-vine{position:absolute;top:-14px;transform-origin:top center;opacity:.85;animation:swayX 6s ease-in-out infinite;z-index:2;}
.scene-vine .vine-inner{display:block;transform-origin:top center;}
.scene-vine--l{left:3%;}
.scene-vine--r{right:3%;}
.scene-waterfall{position:absolute;bottom:22vh;left:12%;width:70px;height:26vh;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(120,200,255,.35));overflow:hidden;opacity:.7;}
.scene-waterfall span{position:absolute;top:0;width:6px;height:40%;background:rgba(255,255,255,.85);border-radius:6px;animation:fall 1.1s linear infinite;}
.scene-fog{position:absolute;bottom:0;left:0;width:100%;height:30vh;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.35));pointer-events:none;}
.scene-dim{position:absolute;inset:0;background:rgba(20,40,25,.28);z-index:4;}
.scene-ambient{position:absolute;inset:0;z-index:3;pointer-events:none;}
.scene-ambient--dusk{background:linear-gradient(180deg,rgba(255,152,0,.18) 0%,rgba(255,112,67,.06) 42%,rgba(94,53,177,.16) 100%);}
.scene-ambient--dark{background:radial-gradient(ellipse 90% 60% at 50% 20%,rgba(120,90,200,.14),rgba(8,10,28,.6) 78%);}
.scene-ambient--sky{background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 55%);}
.scene-stalactite{position:absolute;top:-4px;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:solid rgba(126,87,194,.4);z-index:3;filter:drop-shadow(0 5px 5px rgba(8,10,28,.35));}
.scene-crystal-glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(179,157,219,.9),rgba(126,87,194,0) 70%);animation:sparkle ease-in-out infinite;z-index:3;pointer-events:none;}
.scene-lily{position:absolute;bottom:15vh;z-index:2;animation:bob 4.2s ease-in-out infinite;pointer-events:none;}
.scene-lily--2{bottom:12vh;animation-duration:5s;}
@media (max-width:760px){.scene-lily{display:none;}}
/* ============ elephant ============ */
.ellie{display:inline-block;}
.ellie svg{overflow:visible;}
.ellie--idle,.ellie--think,.ellie--point,.ellie--wave{animation:bob 3.6s ease-in-out infinite;}
.ellie--wave .ellie-arm{transform-origin:176px 120px;animation:ellieWave .7s ease-in-out infinite;}
.ellie--celebrate{animation:ellieJump .6s ease-in-out infinite;}
.ellie--celebrate .ellie-arm{transform-origin:176px 120px;animation:ellieWave .4s ease-in-out infinite;}
.ellie--encourage{animation:ellieLean 2s ease-in-out infinite;}
@keyframes ellieWave{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(28deg);}}
@keyframes ellieJump{0%,100%{transform:translateY(0);}40%{transform:translateY(-16px);}}
@keyframes ellieLean{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}
/* ============ grade guide buddies (butterfly / bird / tiger / panther / snake) ============ */
.buddy{display:inline-block;}
.buddy svg{overflow:visible;}
.buddy--idle,.buddy--think,.buddy--point{animation:floatY 5s ease-in-out infinite;}
.buddy--wave{animation:bob 1.1s ease-in-out infinite;}
.buddy--celebrate{animation:ellieJump .6s ease-in-out infinite;}
.buddy--encourage{animation:ellieLean 2s ease-in-out infinite;}
.buddy-wing{transform-box:fill-box;transform-origin:center;animation:wingBeat 1.1s ease-in-out infinite;}
.buddy--butterfly .buddy-wing--l{transform-origin:right center;}
.buddy--butterfly .buddy-wing--r{transform-origin:left center;}
.buddy-paw{transform-box:fill-box;transform-origin:center;animation:pawWave .6s ease-in-out infinite;}
.buddy-tongue{transform-box:fill-box;transform-origin:top center;animation:tongueFlick 2.2s ease-in-out infinite;}
@keyframes wingBeat{0%,100%{transform:scaleX(1);}50%{transform:scaleX(.62);}}
@keyframes pawWave{0%,100%{transform:rotate(-10deg);}50%{transform:rotate(22deg);}}
@keyframes tongueFlick{0%,86%,100%{transform:scaleY(.55);}92%{transform:scaleY(1);}}
/* ============ hud / speech / confetti ============ */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(12px,3vw,28px);background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.72));backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(27,94,32,.12);flex-wrap:wrap;}
.hud-left,.hud-right{display:flex;gap:8px;}
.hud-icon-btn{border:none;cursor:pointer;background:#fff;width:48px;height:48px;border-radius:16px;font-size:1.4rem;box-shadow:var(--shadow-soft);transition:transform var(--anim-fast) ease;}
.hud-icon-btn:hover{transform:translateY(calc(-2px*var(--motion-scale))) scale(1.05);}
.hud-stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.hud-level{position:relative;flex-direction:column;align-items:flex-start;gap:2px;}
.hud-xp{display:block;width:70px;height:6px;border-radius:4px;background:#e6efe8;overflow:hidden;}
.hud-xp-fill{display:block;height:100%;background:linear-gradient(90deg,var(--golden-yellow),var(--treasure-orange));transition:width var(--anim-slow) ease;}
/* compact-on-scroll header */
.hud{transition:padding .25s ease,box-shadow .25s ease;}
.hud-icon-btn{transition:width .25s ease,height .25s ease,border-radius .25s ease;}
.hud .chip{transition:padding .25s ease,font-size .25s ease;}
.hud .ic{transition:width .25s ease,height .25s ease;}
.scene-content.scrolled .hud{padding-top:4px;padding-bottom:4px;box-shadow:0 3px 12px rgba(27,94,32,.18);}
.scene-content.scrolled .hud-icon-btn{width:38px;height:38px;border-radius:12px;}
.scene-content.scrolled .hud .ic{width:20px!important;height:20px!important;}
.scene-content.scrolled .hud .chip{padding:3px 10px;font-size:.85rem;}
.scene-content.scrolled .hud-xp{height:4px;width:50px;}
.next-hint{font-family:var(--font-primary);font-weight:600;font-size:1.1rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;opacity:.9;animation:pop var(--anim-med) ease both;}
.speech{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
.speech-bubble{position:relative;background:#fff;border-radius:22px;padding:16px 22px;max-width:460px;font-family:var(--font-primary);font-size:calc(1.15rem*var(--text-scale));color:var(--ink);box-shadow:var(--shadow-soft);animation:pop var(--anim-med) ease both;}
.speech-bubble::before{content:'';position:absolute;left:-14px;top:40%;border:10px solid transparent;border-right-color:#fff;}
.speech-cc{position:absolute;top:-12px;right:12px;background:var(--deep-forest);color:#fff;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:1px;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.confetti span{position:absolute;top:-20px;animation:confettiFall linear forwards;}
/* ============ manipulatives ============ */
.manip{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px auto;}
.manip-cap{font-size:.85rem;color:var(--ink-soft);margin:0;}
.manip-objects{flex-direction:row;flex-wrap:wrap;gap:8px;max-width:360px;}
.manip-obj{font-size:2.1rem;animation:pop var(--anim-med) ease both;}
.tenframe-group{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.tenframe{display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:repeat(2,44px);gap:4px;background:var(--deep-forest);padding:4px;border-radius:10px;}
.tenframe-cell{background:#fff;border-radius:8px;display:flex;}
.tenframe-cell.filled::after{content:'';margin:auto;width:26px;height:26px;border-radius:50%;}
.tenframe-cell.a::after{background:var(--elephant-blue);}
.tenframe-cell.b::after{background:var(--golden-yellow);}
.baseten{flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:6px;max-width:380px;}
.baseten .manip-cap{flex-basis:100%;}
.bt-hundred{width:50px;height:50px;background:var(--elephant-blue);border-radius:4px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 1px,transparent 1px 10px),repeating-linear-gradient(0deg,rgba(255,255,255,.4) 0 1px,transparent 1px 10px);}
.bt-ten{width:10px;height:50px;background:var(--jungle-green);border-radius:3px;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px,transparent 1px 5px);}
.bt-one{width:10px;height:10px;background:var(--treasure-orange);border-radius:2px;}
.numline{display:flex;align-items:flex-start;border-top:4px solid var(--deep-forest);padding-top:4px;}
.numline-tick{display:flex;flex-direction:column;align-items:center;width:42px;}
.numline-dot{width:12px;height:12px;border-radius:50%;background:var(--jungle-green);margin-top:-12px;}
.numline-dot.here{background:var(--treasure-orange);transform:scale(1.5);box-shadow:0 0 0 4px rgba(255,152,0,.3);}
.numline-dot.there{background:var(--elephant-blue);transform:scale(1.5);box-shadow:0 0 0 4px rgba(74,144,226,.3);}
.numline-num{margin-top:4px;font-size:.95rem;}
.array{display:grid;gap:6px;}
.array-dot{width:22px;height:22px;border-radius:50%;background:var(--elephant-blue);}
.array-sq{width:24px;height:24px;border-radius:4px;background:var(--jungle-green);border:1px solid #fff;}
.rectbox{position:relative;background:rgba(74,144,226,.25);border:3px dashed var(--elephant-blue);border-radius:8px;min-width:60px;min-height:40px;}
.rect-w{position:absolute;top:-24px;left:50%;transform:translateX(-50%);}
.rect-h{position:absolute;left:-22px;top:50%;transform:translateY(-50%);}
.fracbar{display:flex;border:3px solid var(--deep-forest);border-radius:8px;overflow:hidden;width:min(320px,80vw);height:42px;}
.fracbar-part{flex:1;border-right:2px solid var(--deep-forest);}
.fracbar-part:last-child{border-right:none;}
.fracbar-part.on{background:var(--treasure-orange);}
.fracbar--build{margin:10px auto;}
.fracbar-part-btn{flex:1;border:none;border-right:2px solid var(--deep-forest);background:#fff;cursor:pointer;padding:0;height:100%;transition:background var(--anim-fast) ease;}
.fracbar-part-btn:last-child{border-right:none;}
.fracbar-part-btn.on{background:var(--treasure-orange);animation:pop var(--anim-med) ease;}
.fracbar-part-btn:hover:not(:disabled){background:var(--bg-cream);}
.fracbar-part-btn.on:hover:not(:disabled){background:var(--treasure-orange);}
.fraccmp-row{display:flex;align-items:center;gap:10px;margin:4px 0;}
.fraccmp-label{min-width:48px;}
.len-object{height:20px;background:linear-gradient(180deg,var(--jungle-green),var(--deep-forest));border-radius:12px;box-shadow:inset 0 2px 3px rgba(255,255,255,.35);}
.len-object--sm{height:14px;}
.len-units{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
.len-unit{line-height:0;}
.lencmp{align-items:stretch;}
.lencmp-row{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:6px 0;}
.lencmp-label{font-weight:700;color:var(--deep-forest);}
.bargraph{display:flex;align-items:flex-end;gap:16px;height:160px;padding:8px 12px;background:rgba(255,255,255,.6);border-radius:12px;}
.bargraph-col{display:flex;flex-direction:column;align-items:center;gap:4px;}
.bargraph-bar{width:34px;background:linear-gradient(180deg,var(--jungle-green),var(--deep-forest));border-radius:8px 8px 0 0;display:flex;justify-content:center;align-items:flex-start;padding-top:2px;transition:height var(--anim-slow) ease;}
.bargraph-val{color:#fff;font-size:.8rem;}
.bargraph-label{font-size:1.4rem;}
.prism{position:relative;width:120px;height:100px;margin:18px;}
.prism-front{position:absolute;bottom:0;left:0;width:90px;height:70px;background:var(--elephant-blue);border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;}
.prism-top{position:absolute;top:0;left:20px;width:90px;height:24px;background:#6AA9EE;transform:skewX(-45deg);border:2px solid #fff;}
.prism-side{position:absolute;bottom:0;right:0;width:24px;height:70px;background:#3E7FCC;transform:skewY(-45deg);border:2px solid #fff;}
.prism-l{position:absolute;top:-6px;right:-10px;}
.shake{animation:shakeX var(--anim-med) ease;}
.pulse-in{animation:pop var(--anim-med) ease both;}
/* ============ pages ============ */
main.container{padding:clamp(16px,3vw,34px) 0 80px;}
.topnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px auto 0;}
.topnav-link{border:none;cursor:pointer;background:rgba(255,255,255,.82);color:var(--deep-forest);font-weight:700;font-family:var(--font-primary);padding:8px 16px;border-radius:999px;font-size:.98rem;box-shadow:var(--shadow-soft);transition:transform var(--anim-fast) ease;}
.topnav-link:hover{transform:translateY(calc(-2px*var(--motion-scale)));background:#fff;}
.home-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:24px 0 10px;}
.home-hero-text{flex:1 1 320px;}
.home-title{font-size:clamp(2.6rem,7vw,5rem);color:var(--deep-forest);text-shadow:0 3px 0 rgba(255,255,255,.6);}
.home-title-accent{color:var(--treasure-orange);}
.home-sub{font-size:calc(1.2rem*var(--text-scale));color:var(--ink-soft);max-width:34ch;}
.home-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;}
.home-hero-ellie{position:relative;flex:0 0 auto;text-align:center;}
.home-ellie-say{display:inline-block;margin-top:-6px;background:#fff;padding:8px 18px;border-radius:999px;font-family:var(--font-primary);font-weight:600;box-shadow:var(--shadow-soft);}
.home-map{padding:22px;margin-top:18px;position:relative;overflow:hidden;}
.home-regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:20px;position:relative;align-items:start;}
.home-regions::before{content:'';position:absolute;left:2%;right:2%;top:50%;height:4px;background:repeating-linear-gradient(90deg,var(--wood-3) 0 10px,transparent 10px 20px);opacity:.35;z-index:0;border-radius:4px;}
.home-region{border:none;cursor:pointer;background:#fff;border-radius:var(--radius-md);padding:18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow-soft);border-bottom:6px solid var(--rc);transition:transform var(--anim-med) cubic-bezier(.34,1.56,.64,1),box-shadow var(--anim-med) ease;animation:fadeUp var(--anim-slow) ease both;position:relative;z-index:1;}
.home-region:nth-child(odd){margin-top:-10px;}
.home-region:nth-child(even){margin-top:10px;}
.home-region:hover{transform:translateY(calc(-6px*var(--motion-scale))) scale(1.03);box-shadow:var(--shadow-lift);}
.home-region-medal{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--rc),var(--rc2,var(--rc)));box-shadow:0 6px 14px rgba(0,0,0,.2),inset 0 2px 4px rgba(255,255,255,.45);margin-bottom:2px;}
.home-region-medal .ic{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.home-region-icon{font-size:2.4rem;}
.home-region-name{font-family:var(--font-primary);font-weight:600;color:var(--deep-forest);}
.home-region-grade{font-size:.85rem;color:var(--ink-soft);}
.home-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
.home-panel{padding:22px;}
.home-featured{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.home-feat{display:flex;align-items:center;gap:12px;border:none;cursor:pointer;background:var(--bg-cream);border-radius:16px;padding:12px 16px;font-family:var(--font-primary);font-weight:600;color:var(--deep-forest);box-shadow:var(--shadow-soft);transition:transform var(--anim-fast) ease;}
.home-feat:hover{transform:translateX(4px);}
.home-feat-icon{font-size:1.8rem;}
.home-feat-go{margin-left:auto;color:var(--treasure-orange);}
.home-daily{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:8px;}
.home-daily-badge{font-size:3rem;animation:floatY 3s ease-in-out infinite;}
.home-empty{color:var(--ink-soft);}
.home-discoveries{display:flex;gap:8px;flex-wrap:wrap;}
.home-foot{text-align:center;color:var(--ink-soft);margin-top:26px;font-size:.95rem;}
.map-page{text-align:center;}
.map-intro{display:flex;justify-content:center;margin-bottom:6px;}
.map-title{color:var(--deep-forest);font-size:clamp(2rem,5vw,3.2rem);text-shadow:0 2px 0 rgba(255,255,255,.6);}
.map-trail{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:stretch;margin-top:18px;position:relative;}
.map-trail::before{content:'';position:absolute;left:0;right:0;top:50%;height:5px;background:repeating-linear-gradient(90deg,var(--wood-3) 0 12px,transparent 12px 24px);opacity:.4;z-index:0;border-radius:4px;}
.map-node{position:relative;width:210px;cursor:pointer;border:none;background:#fff;background:linear-gradient(165deg,#fff 55%,color-mix(in srgb,var(--rc) 12%,#fff) 100%);border-radius:24px;padding:22px 16px 18px;box-shadow:var(--shadow-soft);border-bottom:8px solid var(--rc);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform var(--anim-med) cubic-bezier(.34,1.56,.64,1);animation:fadeUp var(--anim-slow) ease both;z-index:1;}
.map-node--up{transform:translateY(-8px);}
.map-node:hover{transform:translateY(calc(-8px*var(--motion-scale))) scale(1.04);box-shadow:var(--shadow-lift);}
.map-node-badge{position:absolute;top:-16px;left:-10px;width:42px;height:42px;border-radius:50%;background:var(--rc);color:#fff;display:grid;place-items:center;font-size:1.2rem;box-shadow:var(--shadow-soft);}
.map-node-medal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--rc),var(--rc2,var(--rc)));box-shadow:0 6px 14px rgba(0,0,0,.2),inset 0 2px 4px rgba(255,255,255,.45);margin-bottom:2px;}
.map-node-medal .ic{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.map-node-icon{font-size:3rem;}
.map-node-region{font-family:var(--font-primary);font-weight:700;font-size:1.25rem;color:var(--deep-forest);}
.map-node-grade{color:var(--rc);font-weight:700;}
.map-node-tag{font-size:.82rem;color:var(--ink-soft);}
.region-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:10px 0 4px;}
.region-title{font-size:clamp(2rem,5vw,3.4rem);color:var(--deep-forest);}
.region-tag{color:var(--ink-soft);font-size:1.1rem;margin:0;}
.region-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:26px;position:relative;align-items:start;}
.region-grid::before{content:'';position:absolute;left:1%;right:1%;top:54px;height:4px;background:repeating-linear-gradient(90deg,var(--rc) 0 10px,transparent 10px 20px);opacity:.28;z-index:0;border-radius:4px;}
.skill-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border-bottom:8px solid var(--rc);position:relative;z-index:1;}
.skill-card:nth-child(odd){margin-top:-8px;}
.skill-card:nth-child(even){margin-top:10px;}
.skill-card-medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--rc),var(--rc2,var(--rc)));box-shadow:0 5px 12px rgba(0,0,0,.18),inset 0 2px 4px rgba(255,255,255,.4);margin-bottom:2px;}
.skill-card-medal .ic{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.skill-card-icon{font-size:2.6rem;}
.skill-card-name{font-family:var(--font-primary);font-weight:700;font-size:1.3rem;color:var(--deep-forest);}
.skill-card-teks{font-size:.85rem;color:var(--ink-soft);background:var(--bg-cream);padding:2px 10px;border-radius:999px;}
.skill-card-play{margin-top:6px;color:var(--treasure-orange);font-weight:700;font-family:var(--font-primary);}
.activity{max-width:780px;}
.activity-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.activity-meta{display:flex;gap:8px;flex-wrap:wrap;}
.activity-progress{display:flex;gap:8px;}
.prog-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 2px rgba(27,94,32,.25);}
.prog-dot.past{background:var(--success-green);box-shadow:none;}
.prog-dot.now{background:var(--golden-yellow);box-shadow:0 0 0 4px rgba(251,192,45,.35);}
.question-card{padding:clamp(20px,4vw,40px);text-align:center;position:relative;}
.question-ellie{position:absolute;top:-34px;left:50%;transform:translateX(-50%);}
.question-prompt{font-size:clamp(1.8rem,5vw,3rem);color:var(--deep-forest);margin:46px 0 10px;}
.question-emoji{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.5;letter-spacing:4px;margin-bottom:8px;word-break:break-word;}
.question-support{margin:10px auto 4px;}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:18px 0;}
.answer-btn{border:none;border-bottom:5px solid var(--rc,var(--jungle-green));cursor:pointer;background:#fff;color:var(--deep-forest);font-size:clamp(1.4rem,4vw,2rem);padding:18px 12px;border-radius:20px;box-shadow:0 6px 0 rgba(27,94,32,.18),var(--shadow-soft);transition:transform var(--anim-fast) cubic-bezier(.34,1.56,.64,1),background var(--anim-fast) ease;}
.answer-btn:hover:not(:disabled){transform:translateY(calc(-3px*var(--motion-scale)));background:var(--bg-cream);}
.answer-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(27,94,32,.18);}
.answer--right{background:var(--success-green);color:#fff;box-shadow:0 6px 0 rgba(27,94,32,.3);animation:pop var(--anim-med) ease;}
.answer-type{display:flex;gap:12px;justify-content:center;align-items:center;margin:20px 0;flex-wrap:wrap;}
.answer-input{width:min(240px,70vw);font-size:clamp(1.8rem,6vw,2.6rem);text-align:center;padding:12px 16px;border:4px solid var(--rc,var(--elephant-blue));border-radius:18px;color:var(--deep-forest);background:#fff;outline-offset:4px;}
.chip--streak{background:linear-gradient(180deg,#fff3e0,#ffe0b2);color:#c65500;animation:streakPulse 1.2s ease-in-out infinite;}
@keyframes streakPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.feedback{margin:8px auto 4px;font-family:var(--font-primary);font-weight:700;font-size:1.35rem;}
.feedback--yes{color:var(--success-green);}
.feedback--try{color:var(--treasure-orange);}
.feedback-reward{color:var(--golden-yellow);margin-left:6px;}
.feedback-hint{font-size:1rem;color:var(--ink-soft);font-weight:600;margin-top:8px;}
.activity-controls{margin-top:14px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.quest-done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:30px;border-top:8px solid var(--rc,var(--golden-yellow));}
.quest-chest{font-size:5rem;animation:floatY 2.4s ease-in-out infinite;}
.quest-done h1{font-size:clamp(2.2rem,6vw,3.4rem);color:var(--treasure-orange);}
.quest-done-sub{color:var(--ink-soft);font-size:1.2rem;max-width:40ch;}
.quest-rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
.quest-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
/* ============ activity: carved-wood ribbon + lesson-steps rail ============ */
.act-shell{width:min(1180px,94vw);margin:0 auto;padding:clamp(10px,2.4vw,22px) 0 80px;}
/* shared header uses the same wood ribbon, centered like a page container */
.hud-ribbon{width:min(1180px,92vw);margin:10px auto 16px;}
.act-ribbon{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;
  margin:0 0 16px;padding:9px 14px;border-radius:22px;
  background:linear-gradient(180deg,var(--wood-3),var(--wood-1) 46%,var(--wood-2));
  border:3px solid var(--wood-edge);border-bottom:5px solid var(--rc,var(--wood-edge));
  background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.14)),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 26px);
  box-shadow:0 8px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.16),inset 0 -8px 16px rgba(0,0,0,.34);}
.wood-btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:2px solid var(--wood-edge);
  background:linear-gradient(180deg,var(--wood-3),var(--wood-2));color:#ffe9c6;font-family:var(--font-primary);font-weight:700;
  font-size:.88rem;line-height:1.05;padding:7px 12px;border-radius:14px;text-align:left;
  box-shadow:0 4px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.18);transition:transform var(--anim-fast) ease;}
.wood-btn:hover{transform:translateY(calc(-2px*var(--motion-scale)));}
.wood-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.32);}
.wood-btn .ic{filter:drop-shadow(0 1px 0 rgba(0,0,0,.35));}
.act-avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;overflow:hidden;
  background:linear-gradient(145deg,var(--rc,#c07f4f),var(--rc2,#6d4726));border:3px solid var(--wood-gold);box-shadow:0 3px 0 rgba(0,0,0,.3);}
.act-id{display:flex;flex-direction:column;line-height:1.12;color:#ffe9c6;margin-right:auto;}
.act-id-name{font-family:var(--font-primary);font-weight:800;font-size:1rem;}
.act-id-region{font-size:.8rem;opacity:.85;}
.act-stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.wood-stat{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border:2px solid var(--wood-edge);border-radius:999px;padding:4px 10px;color:#fff;font-family:var(--font-number);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
.wood-stat .num{color:#fff;}
.wood-stat--lv{background:linear-gradient(180deg,#3f7fce,#255fa8);border-color:#183f73;}
.wood-xp{position:relative;width:118px;height:20px;border-radius:999px;background:rgba(0,0,0,.42);border:2px solid var(--wood-edge);overflow:hidden;display:inline-flex;align-items:center;}
.wood-xp-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7ed957,#39a55d);}
.wood-xp-txt{position:relative;width:100%;text-align:center;font-size:.7rem;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6);}
.act-ribbon-right{display:flex;gap:8px;flex-wrap:wrap;}
.act-ribbon-right .wood-btn span{display:none;}
@media(min-width:960px){.act-ribbon-right .wood-btn span{display:inline;}}
.act-body{display:flex;gap:16px;align-items:flex-start;}
.act-rail{flex:0 0 188px;display:flex;flex-direction:column;gap:8px;padding:14px 12px;border-radius:20px;position:sticky;top:84px;
  background:linear-gradient(180deg,var(--wood-1),var(--wood-2));border:3px solid var(--wood-edge);
  box-shadow:0 8px 0 rgba(0,0,0,.26),inset 0 2px 0 rgba(255,255,255,.14);}
.rail-title{color:var(--wood-gold);font-family:var(--font-primary);font-weight:800;font-size:1.05rem;text-align:center;margin:0 0 4px;letter-spacing:.5px;}
.rail-step{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:14px;color:#f4e3c8;font-family:var(--font-primary);font-weight:700;border:2px solid transparent;}
.rail-badge{flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.32);border:2px solid var(--wood-edge);font-family:var(--font-number);font-weight:800;font-size:.9rem;}
.rail-check{display:inline-flex;}.rail-check .ic{width:20px;height:20px;}
.rail-ic{display:inline-flex;}
.rail-name{font-size:.98rem;}
.rail-step--todo{opacity:.55;}
.rail-step--active{background:linear-gradient(180deg,#f3c34d,#e0a52e);color:#4a2f10;border-color:#8a5a12;box-shadow:0 4px 0 rgba(0,0,0,.28);}
.rail-step--active .rail-badge{background:#fff;color:#4a2f10;}
.rail-step--done .rail-badge{background:var(--success-green);border-color:#1b5e20;color:#fff;}
.act-main{flex:1 1 auto;min-width:0;}
.act-card{padding:clamp(18px,3.2vw,36px);position:relative;text-align:center;}
.act-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.act-counter{font-family:var(--font-number);font-weight:800;color:var(--deep-forest);background:var(--bg-cream);padding:4px 12px;border-radius:999px;box-shadow:var(--shadow-soft);}
.act-card .activity-progress{justify-content:center;margin:12px 0 0;}
.act-audio{width:44px;height:44px;border-radius:14px;border:2px solid var(--wood-edge);cursor:pointer;flex:0 0 auto;
  background:linear-gradient(180deg,#f7edd6,#e9d7ac);box-shadow:0 4px 0 rgba(27,94,32,.18);display:grid;place-items:center;}
.act-audio:active{transform:translateY(2px);}
.act-card-head h1{color:var(--deep-forest);font-size:clamp(1.5rem,4vw,2.2rem);}
.act-sub{color:var(--ink-soft);font-weight:600;}
.act-card .question-ellie{position:static;transform:none;margin:2px auto -8px;display:flex;justify-content:center;}
.act-card .question-prompt{margin:10px 0 10px;}
/* learn screen */
.learn-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;}
.learn-head-txt h1{color:var(--treasure-orange);font-size:clamp(1.4rem,4vw,2rem);margin:0;}
.learn-head-txt h2{color:var(--deep-forest);font-size:clamp(1.3rem,3.4vw,1.8rem);margin:2px 0 6px;}
.learn-tip{font-size:1.14rem;color:var(--deep-forest);max-width:60ch;margin:14px auto;line-height:1.5;}
.learn-video-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;margin:6px auto 12px;max-width:560px;}
.learn-video-hint{font-weight:700;color:var(--deep-forest);}
.learn-video{text-decoration:none;}
.learn-example{background:var(--bg-cream);border:3px dashed var(--rc,var(--golden-yellow));border-radius:18px;padding:16px;margin:8px auto;max-width:560px;}
.learn-ex-label{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--treasure-orange);font-family:var(--font-primary);}
.learn-demo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px;}
.learn-demo-q{font-size:clamp(1.2rem,3vw,1.7rem);color:var(--deep-forest);}
.learn-demo-a{font-size:1.2rem;color:var(--success-green);font-weight:800;}
.learn-demo-hint{color:var(--ink-soft);font-weight:600;}
.learn-card>.btn{display:flex;margin:18px auto 0;}
/* remember note (practice) */
.remember-note{background:#fff7d6;border:2px solid var(--golden-yellow);border-radius:14px;padding:10px 14px;margin:16px auto 0;max-width:340px;box-shadow:0 4px 0 rgba(231,163,0,.25);transform:rotate(-1.1deg);}
.remember-note h4{margin:0 0 4px;color:var(--success-green);font-family:var(--font-primary);font-weight:800;}
.remember-note p{margin:0;color:var(--deep-forest);font-weight:600;font-size:.98rem;}
@media(max-width:820px){
  .act-body{flex-direction:column;}
  .act-rail{flex:1 1 auto;width:100%;flex-direction:row;overflow-x:auto;position:static;top:auto;gap:6px;padding:10px;}
  .act-rail .rail-title{display:none;}
  .rail-step{flex:0 0 auto;flex-direction:column;gap:3px;padding:8px;min-width:76px;text-align:center;}
  .rail-name{font-size:.78rem;}
}
.mg-title{text-align:center;color:var(--deep-forest);font-size:clamp(2rem,5vw,3rem);}
.mg-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.mg-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.mg-icon{font-size:3rem;}
.mg-name{font-family:var(--font-primary);font-weight:700;font-size:1.3rem;color:var(--deep-forest);}
.mg-blurb{color:var(--ink-soft);font-size:.95rem;}
.mg-play{margin-top:4px;color:var(--treasure-orange);font-weight:700;}
.mg-soon{text-align:center;color:var(--ink-soft);margin-top:16px;}
.mm-wrap{padding:26px;}
.mm{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
.mm-hint{font-family:var(--font-primary);font-weight:700;font-size:1.3rem;color:var(--deep-forest);}
.mm-grid{display:grid;grid-template-columns:repeat(4,minmax(60px,90px));gap:12px;}
.mm-card{position:relative;aspect-ratio:3/4;border:none;cursor:pointer;background:transparent;perspective:600px;}
.mm-face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;font-size:1.5rem;box-shadow:var(--shadow-soft);transition:transform var(--anim-med) ease;}
.mm-back{background:linear-gradient(160deg,var(--jungle-green),var(--deep-forest));color:#fff;font-size:2rem;}
.mm-front{background:#fff;color:var(--deep-forest);transform:rotateY(180deg);padding:4px;word-break:break-word;}
.mm-card.flipped .mm-back{transform:rotateY(180deg);}
.mm-card.flipped .mm-front{transform:rotateY(0);}
.mm-win{display:flex;flex-direction:column;align-items:center;gap:10px;}
/* ---- mini games: shared ---- */
.mg-grade-picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px;}
.mg-grade-chip{border:none;cursor:pointer;background:#fff;border-radius:999px;padding:8px 16px;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-primary);font-weight:700;color:var(--deep-forest);box-shadow:var(--shadow-soft);border-bottom:4px solid var(--rc);transition:transform var(--anim-fast) ease;}
.mg-grade-chip:hover{transform:translateY(-2px);}
.mg-grade-chip.active{background:linear-gradient(145deg,var(--rc),var(--rc2));color:#fff;}
.mg-grade-label{text-align:center;color:var(--ink-soft);font-weight:700;margin:0;}
.game-panel{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.game-hint{font-family:var(--font-primary);font-weight:700;font-size:1.15rem;color:var(--deep-forest);}
.game-prompt{font-size:clamp(1.6rem,4.5vw,2.6rem);color:var(--deep-forest);margin:4px 0;}
.game-ask{font-weight:700;color:var(--deep-forest);margin:2px 0;}
.game-back{margin-top:6px;}
/* Treasure Tap */
.tt-timer{width:min(420px,90%);height:14px;border-radius:8px;background:rgba(0,0,0,.12);overflow:hidden;}
.tt-timer-fill{height:100%;background:linear-gradient(90deg,#66BB6A,#FBC02D,#FF7043);transition:width .2s linear;}
.tt-chests{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:6px 0;}
.tt-chest{border:none;cursor:pointer;background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(27,94,32,.18),var(--shadow-soft);transition:transform var(--anim-fast) ease;}
.tt-chest:hover:not(:disabled){transform:translateY(-3px);}
.tt-chest:disabled{opacity:.75;}
.tt-chest--right{background:var(--success-green);color:#fff;animation:pop var(--anim-med) ease;}
.tt-chest--wrong{opacity:.35;}
/* Pattern Path */
.pp-path{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
.pp-stone{background:#fff;border-radius:14px;padding:12px 18px;font-family:var(--font-number);font-weight:800;font-size:1.25rem;color:var(--deep-forest);box-shadow:var(--shadow-soft);border-bottom:5px solid var(--success-green);}
.pp-stone--blank{background:var(--golden-yellow);color:#5a3d00;animation:streakPulse 1.4s ease-in-out infinite;}
.pp-choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:2px 0;}
.pp-choice{border:none;cursor:pointer;background:#fff;border-radius:16px;padding:14px 22px;font-family:var(--font-number);font-weight:800;font-size:1.25rem;color:var(--deep-forest);box-shadow:0 6px 0 rgba(27,94,32,.18),var(--shadow-soft);transition:transform var(--anim-fast) ease;}
.pp-choice:hover:not(:disabled){transform:translateY(-3px);}
.pp-choice:disabled{opacity:.75;}
/* True or False Swamp */
.tf-statement{font-size:clamp(1.5rem,4.2vw,2.3rem);color:var(--deep-forest);font-weight:800;margin:6px 0;}
.tf-pads{display:flex;gap:26px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
.tf-pad{border:none;cursor:pointer;background:linear-gradient(160deg,#81C784,#4CAF50);color:#fff;border-radius:50%;width:112px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-primary);font-weight:800;font-size:1.05rem;box-shadow:0 6px 0 rgba(27,94,32,.3),var(--shadow-soft);transition:transform var(--anim-fast) ease;}
.tf-pad:hover:not(:disabled){transform:translateY(-4px) scale(1.03);}
.tf-pad:disabled{opacity:.75;}
.tf-pad--right{background:linear-gradient(160deg,#FBC02D,#F9A825);animation:pop var(--anim-med) ease;}
.tf-pad--wrong{opacity:.35;}
/* Picture Match */
.pm-word{font-size:.82rem;font-weight:800;text-align:center;line-height:1.15;}
.pm-fracbar{display:flex;width:58px;height:22px;border:2px solid var(--deep-forest);border-radius:6px;overflow:hidden;}
.pm-frac-part{flex:1;border-right:1px solid var(--deep-forest);}
.pm-frac-part:last-child{border-right:none;}
.pm-frac-part.on{background:var(--treasure-orange);}
.ach-title{text-align:center;color:var(--deep-forest);font-size:clamp(2rem,5vw,3rem);}
.ach-note{text-align:center;color:var(--ink-soft);margin-top:-6px;}
.ach-stats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:16px 0 24px;}
.ach-stat{padding:18px;text-align:center;display:flex;flex-direction:column;gap:4px;}
.ach-stat-icon{font-size:2.2rem;}
.ach-stat-val{font-size:2rem;color:var(--deep-forest);}
.ach-stat-label{color:var(--ink-soft);font-size:.9rem;}
.ach-sub{text-align:center;color:var(--deep-forest);}
.ach-badges{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
.ach-badge{padding:18px;text-align:center;display:flex;flex-direction:column;gap:4px;transition:transform var(--anim-med) ease;}
.ach-badge.got{border-bottom:6px solid var(--golden-yellow);}
.ach-badge.locked{opacity:.6;filter:grayscale(.4);}
.ach-badge-icon{font-size:2.6rem;}
.ach-badge-name{font-family:var(--font-primary);font-weight:700;color:var(--deep-forest);}
.ach-badge-desc{font-size:.85rem;color:var(--ink-soft);}
.ach-badge-earned{color:var(--success-green);font-weight:700;}
.settings{max-width:720px;}
.set-title{text-align:center;color:var(--deep-forest);font-size:clamp(2rem,5vw,3rem);}
.set-group{padding:22px;margin-bottom:18px;}
.set-group h2{color:var(--deep-forest);}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:2px dashed rgba(27,94,32,.12);}
.set-row:last-child{border-bottom:none;}
.set-row-text{display:flex;flex-direction:column;}
.set-row-label{font-family:var(--font-primary);font-weight:600;font-size:1.1rem;color:var(--deep-forest);}
.set-row-desc{color:var(--ink-soft);font-size:.9rem;}
.toggle{position:relative;width:66px;height:36px;border-radius:999px;border:none;cursor:pointer;background:#cfd8cf;transition:background var(--anim-med) ease;flex:0 0 auto;}
.toggle.on{background:var(--success-green);}
.toggle-knob{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:var(--shadow-soft);transition:transform var(--anim-med) cubic-bezier(.34,1.56,.64,1);}
.toggle.on .toggle-knob{transform:translateX(30px);}
.set-select{font-family:var(--font-primary);font-size:1rem;padding:8px 12px;border-radius:12px;border:2px solid var(--elephant-blue);}
.set-foot{text-align:center;color:var(--ink-soft);}
.about{max-width:760px;}
.about-card{padding:30px;}
.about-card h1{color:var(--deep-forest);font-size:clamp(1.8rem,5vw,2.6rem);}
.about-card h2{color:var(--treasure-orange);margin-top:20px;}
.about-card p{color:var(--ink-soft);font-size:1.08rem;line-height:1.6;}
.about-regions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.about-version{font-style:italic;color:var(--ink-soft);}
/* ---- SVG icon system ---- */
.ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:0;flex:0 0 auto;}
.ic svg{width:100%;height:100%;display:block;overflow:visible;}
.ic-inline{vertical-align:-0.18em;margin-right:.12em;}
.count-sprite{margin:3px;animation:pop var(--anim-med) ease both;}
.mm-group{display:inline-flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;max-width:74px;}
/* keep decorative scenery non-interactive */
.scene .ic{pointer-events:none;}
.scene-cloud,.scene-bird,.scene-butterfly,.scene-leaf,.scene-vine,.scene-critter,.scene-palm{pointer-events:none;}
/* wing flapping */
.scene-bird .wing,.scene-butterfly .wing-l,.scene-butterfly .wing-r{transform-box:fill-box;transform-origin:center;}
.scene-bird .wing{animation:wingFlap .42s ease-in-out infinite;}
.scene-butterfly .wing-l{animation:wingFlap .28s ease-in-out infinite;}
.scene-butterfly .wing-r{animation:wingFlap .28s ease-in-out infinite reverse;}
@keyframes wingFlap{0%,100%{transform:scaleX(1);}50%{transform:scaleX(.5);}}
/* decorative characters + foliage */
.scene-critter{position:absolute;z-index:3;}
.scene-monkey{left:2%;bottom:24vh;animation:swayX 4.5s ease-in-out infinite;}
.scene-toucan{right:3%;top:15%;animation:bob 3.6s ease-in-out infinite;}
.scene-toucan .ic{transform:scaleX(-1);}
.scene-palm{position:absolute;bottom:0;z-index:2;opacity:.94;filter:drop-shadow(0 6px 10px rgba(27,94,32,.22));}
.scene-palm--l{left:-38px;}
.scene-palm--r{right:-46px;}
.scene-palm--l2{left:7%;bottom:-6px;z-index:1;opacity:.72;}
.scene-palm--r2{right:8%;bottom:-6px;z-index:1;opacity:.72;}
@media (max-width:760px){.scene-monkey,.scene-toucan,.scene-palm{display:none;}}

.build-widget,.money-widget,.clock-widget,.order-widget{display:flex;flex-direction:column;align-items:center;gap:16px;margin:16px 0;}
.build-total,.money-total{font-family:var(--font-primary);font-weight:700;font-size:1.4rem;color:var(--deep-forest);}
.pv-cols,.money-cols{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.pv-col,.coin-col{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg-cream);padding:14px 12px;border-radius:18px;box-shadow:var(--shadow-soft);min-width:104px;}
.pv-label,.coin-label{font-family:var(--font-primary);font-weight:700;color:var(--deep-forest);font-size:.95rem;}
.pv-btn{width:54px;height:54px;border:none;border-radius:14px;background:var(--elephant-blue);color:#fff;font-size:1.5rem;font-family:var(--font-primary);font-weight:700;cursor:pointer;box-shadow:0 5px 0 rgba(27,94,32,.22);transition:transform var(--anim-fast) ease;white-space:nowrap;}
.pv-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(27,94,32,.22);}
.pv-btn:disabled{opacity:.5;cursor:default;}
.pv-count,.coin-count{font-size:1.9rem;color:var(--deep-forest);}
.coin-pm{display:flex;gap:6px;}
.coin-pm .pv-btn{width:42px;height:42px;font-size:1.2rem;}
.coin-face{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--font-number);border:3px solid rgba(0,0,0,.18);color:#3a2c00;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);}
.coin-penny{background:radial-gradient(circle at 35% 30%,#e8b483,#c97f43);}
.coin-nickel{background:radial-gradient(circle at 35% 30%,#dfe2e6,#a9adb4);}
.coin-dime{background:radial-gradient(circle at 35% 30%,#eef0f3,#b6bac0);font-size:.85rem;}
.coin-quarter{background:radial-gradient(circle at 35% 30%,#e3e6ea,#aeb2b8);}
.coins-visual{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:380px;}
.coin-dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;font-family:var(--font-number);border:2px solid rgba(0,0,0,.18);color:#3a2c00;}
.clock-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.clock-face{filter:drop-shadow(0 8px 16px rgba(27,94,32,.2));}
.order-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.order-tile{min-width:76px;padding:16px 20px;border:none;border-radius:16px;background:#fff;color:var(--deep-forest);font-family:var(--font-number);font-weight:800;font-size:1.7rem;cursor:grab;box-shadow:0 6px 0 rgba(27,94,32,.18),var(--shadow-soft);transition:transform var(--anim-fast) ease,background var(--anim-fast) ease;user-select:none;}
.order-tile:active{cursor:grabbing;}
.order-tile.picked{background:var(--golden-yellow);color:#5a3d00;transform:translateY(-6px) scale(1.06);}
.order-hint{font-size:.92rem;color:var(--ink-soft);margin:0;}

.ten-frame-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:280px;margin:10px auto;}
.ten-frame-wrap.double{grid-template-columns:repeat(5,1fr);}
.frame-cell{width:44px;height:44px;border-radius:9px;border:3px solid var(--deep-forest);background:#fff;cursor:pointer;padding:0;transition:transform var(--anim-fast) ease,background var(--anim-fast) ease;}
.frame-cell:hover:not(:disabled){transform:scale(1.06);}
.frame-cell.on{background:var(--treasure-orange);border-color:var(--treasure-orange);animation:pop var(--anim-med) ease;}
/* Coordinate Plane widget (5th grade) */
.coord-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:2px;margin:12px auto;width:min(380px,88vw);aspect-ratio:1;}
.coord-cell{display:flex;align-items:center;justify-content:center;font-family:var(--font-number);font-weight:700;font-size:clamp(.55rem,2.2vw,.75rem);color:var(--ink-soft);}
.coord-dot{border:2px solid var(--deep-forest);border-radius:50%;background:#fff;cursor:pointer;padding:0;min-width:0;min-height:0;transition:transform var(--anim-fast) ease,background var(--anim-fast) ease;}
.coord-dot:hover:not(:disabled){transform:scale(1.15);}
.coord-dot--picked{background:var(--elephant-blue);border-color:var(--elephant-blue);}
.coord-dot--right{background:var(--success-green);border-color:var(--success-green);animation:pop var(--anim-med) ease;}
/* Volume Builder widget (5th grade) */
.vol-layers{display:flex;flex-direction:column-reverse;gap:6px;align-items:center;margin:8px 0;}
@media (max-width:760px){
  .home-two{grid-template-columns:1fr;}
  .home-hero{justify-content:center;text-align:center;}
  .home-hero-text{text-align:center;}
  .home-sub{margin-left:auto;margin-right:auto;}
  .region-head{justify-content:center;text-align:center;}
  .mm-grid{grid-template-columns:repeat(4,minmax(56px,74px));}
}

function numChoices(answer,spread=5){
  const set=new Set([answer]);let guard=0;
  while(set.size<4&&guard++<40){const delta=rnd(-spread,spread)||1;const cand=answer+delta;if(cand>=0)set.add(cand);}
  while(set.size<4)set.add(answer+set.size);
  return shuffle([...set].map(String));
}
function uniqueChoices(answer,distractors=[]){
  const seen=new Set([String(answer)]);const out=[String(answer)];
  for(const d of distractors){const s=String(d);if(!seen.has(s)){seen.add(s);out.push(s);}if(out.length>=4)break;}

  return shuffle(out);
}

function generate(skill,difficulty=3,preferredType){
  const gen=G[skill.gen]||G.countObjects;
  const q=gen(skill.cfg||{},clamp(difficulty,1,5),preferredType);
  q.skillName=skill.name;q.teks=skill.teks;q.difficulty=difficulty;return q;
}
function checkAnswer(question,given){
  if(given==null)return false;
  const norm=(s)=>String(s).trim().replace(/\s+/g,'').toLowerCase();
  return norm(given)===norm(question.answer);
}

const LEVEL_STEP=120;
const state={
  route:{name:'home',params:{}},
  player:{coins:0,stars:0,points:0,xp:0,badges:[],visitedRegions:[],bestStreak:0,completedSkills:[],playedGames:[]},

/* ---------------- save / load (progress survives closing the page) ---------------- */
const SAVE_KEY='mathquest-jungle-save-v1';
function saveState(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({player:state.player,settings:state.settings}));}
  catch(e){/* storage unavailable (private browsing, quota, etc.) — nothing else to do */}
}
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;
    const saved=JSON.parse(raw);
    if(saved.player)Object.assign(state.player,saved.player);
    if(saved.settings)Object.assign(state.settings,saved.settings);
  }catch(e){/* corrupted save — ignore and start fresh */}
}
function resetProgress(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  state.player={coins:0,stars:0,points:0,xp:0,badges:[],visitedRegions:[],bestStreak:0,completedSkills:[],playedGames:[]};
  state.session={streak:0,difficulty:{},answered:0,correct:0};

let audioCtx=null;
function beep(freqs,dur=0.12,kind='sine'){
  if(!state.settings.sfx)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    let t=audioCtx.currentTime;
    freqs.forEach(f=>{const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=kind;osc.frequency.value=f;gain.gain.setValueAtTime(0.0001,t);gain.gain.exponentialRampToValueAtTime(0.18,t+0.02);gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+dur);t+=dur*0.85;});
  }catch(e){}
}

// Ellie's voice: pick the warmest, friendliest available voice ("Ms. Honeycutt"
// energy) instead of the harsh system default. Voices load asynchronously, so we
// choose once they're ready and re-pick if the OS swaps them in later.
let ELLIE_VOICE=null;
const SWEET_VOICES=[ // ordered preference across Mac / Windows / Chrome / mobile
  'Samantha','Ava','Allison','Susan','Karen','Victoria','Moira','Tessa','Fiona','Serena',
  'Google US English','Google UK English Female','Microsoft Aria','Microsoft Jenny','Microsoft Michelle',
  'Microsoft Zira','Nicky','Vicki','Catherine'
];
function pickVoice(){
  if(!('speechSynthesis'in window))return;
  const voices=window.speechSynthesis.getVoices();
  if(!voices||!voices.length)return;
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const pool=en.length?en:voices;
  for(const name of SWEET_VOICES){
    const v=pool.find(v=>v.name.toLowerCase().includes(name.toLowerCase()));
    if(v){ELLIE_VOICE=v;return;}
  }
  // fallback: any voice that reads as female/warm, else first English voice
  ELLIE_VOICE=pool.find(v=>/female|woman|girl|samantha|zira|aria|jenny|eva|ava|nova/i.test(v.name))||pool[0];
}
function speak(text){
  if(!state.settings.narration||!('speechSynthesis'in window))return;
  try{
    window.speechSynthesis.cancel();
    if(!ELLIE_VOICE)pickVoice();
    const u=new SpeechSynthesisUtterance(text);
    if(ELLIE_VOICE)u.voice=ELLIE_VOICE;
    u.rate=0.9;   // a gentle, unhurried teacher pace
    u.pitch=1.15; // soft and sweet, not squeaky
    u.volume=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis'in window){window.speechSynthesis.onvoiceschanged=pickVoice;}
// Sample Ellie's voice on demand — plays even when narration is toggled off,
// because the user explicitly asked to hear it.
function previewVoice(){
  if(!('speechSynthesis'in window)){return;}
  try{
    window.speechSynthesis.cancel();
    if(!ELLIE_VOICE)pickVoice();
    const u=new SpeechSynthesisUtterance("Hi there, explorer! I'm Ellie. Let's have fun with math today!");
    if(ELLIE_VOICE)u.voice=ELLIE_VOICE;
    u.rate=0.9;u.pitch=1.15;window.speechSynthesis.speak(u);
  }catch(e){}
}

  const mx=cx+Math.cos(rad(minAng))*72, my=cy+Math.sin(rad(minAng))*72;
  let ticks='';for(let i=0;i<12;i++){const a=i*30-90;const big=i%3===0;const x1=cx+Math.cos(rad(a))*82,y1=cy+Math.sin(rad(a))*82,x2=cx+Math.cos(rad(a))*(big?68:76),y2=cy+Math.sin(rad(a))*(big?68:76);ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1B5E20" stroke-width="${big?4:2}"/>`;}
  let nums='';for(let i=1;i<=12;i++){const a=i*30-90;const x=cx+Math.cos(rad(a))*56,y=cy+Math.sin(rad(a))*56;nums+=`<text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="14" fill="#1B5E20">${i}</text>`;}
  return `<svg class="clock-face" viewBox="0 0 200 200" width="${size}" height="${size}"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#1B5E20" stroke-width="5"/>${ticks}${nums}<line x1="100" y1="100" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#4A90E2" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="100" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#FF7043" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#1B5E20"/></svg>`;

function coinDot(k){const map={p:['coin-penny','1¢'],n:['coin-nickel','5¢'],d:['coin-dime','10¢'],q:['coin-quarter','25¢']};const pair=map[k]||map.p;return `<span class="coin-dot ${pair[0]}">${pair[1]}</span>`;}

/* ---------------- adaptive difficulty + rewards ---------------- */
const getDifficulty=(sid)=>state.session.difficulty[sid]!=null?state.session.difficulty[sid]:2;
function nudgeDifficulty(sid,correct,streak){
  const cur=getDifficulty(sid);let next=cur;
  if(correct&&streak>0&&streak%2===0)next=Math.min(5,cur+1);
  if(!correct)next=Math.max(1,cur-1);
  state.session.difficulty[sid]=next;
}
function checkBadges(){
  const p=state.player;const b=new Set(p.badges);
  if(p.coins>=50)b.add('coin-50');
  if(p.coins>=200)b.add('coin-200');
  if(p.stars>=15)b.add('star-master');
  if(p.xp>=LEVEL_STEP*2)b.add('level-3');
  if(p.xp>=LEVEL_STEP*5)b.add('level-5');
  if(p.visitedRegions.length>=3)b.add('explorer');
  if(p.visitedRegions.length>=6)b.add('all-regions');
  if(p.completedSkills.length>=10)b.add('skills-10');
  if(p.completedSkills.length>=25)b.add('skills-25');
  if(p.playedGames.length>=MINI_GAMES.length)b.add('games-all');
  GRADES.forEach(g=>{if(g.skills.every(s=>p.completedSkills.includes(s.id)))b.add('champion-'+g.id);});
  p.badges=[...b];
}
function awardCorrect(sid,difficulty){
  const coins=5+difficulty*2,stars=difficulty>=4?2:1,xp=10+difficulty*4;
  const p=state.player;p.coins+=coins;p.stars+=stars;p.xp+=xp;p.points+=15+difficulty*3;
  state.session.streak+=1;state.session.answered+=1;state.session.correct+=1;
  p.bestStreak=Math.max(p.bestStreak,state.session.streak);
  const b=new Set(p.badges);b.add('first-steps');
  if(state.session.streak>=5)b.add('streak-5');
  p.badges=[...b];
  checkBadges();
  nudgeDifficulty(sid,true,state.session.streak);
  sound.coin();
  return {coins,stars};
}
function registerWrong(sid){
  state.session.streak=0;state.session.answered+=1;
  nudgeDifficulty(sid,false,0);sound.encourage();
}
function visitRegion(gid){if(!state.player.visitedRegions.includes(gid))state.player.visitedRegions.push(gid);}
// ---- mini-game helpers: separate from the lesson's adaptive-difficulty engine ----
const MINI_DIFF={K:1,'1':2,'2':2,'3':3,'4':3,'5':4};
function miniDifficulty(gradeId){return MINI_DIFF[gradeId]||2;}
// These generators only *sometimes* (or never) return a `choices` array even
// though 'mc' is listed in their skill's types (they're built for their own
// hands-on widget, not a plain multiple-choice arcade round) — never pick them
// when a game needs guaranteed multiple-choice content.
const MC_UNSAFE_GENS=new Set(['buildNumber','orderNumbers','money','clock','arrayBuild','buildTenFrame','coordinatePoint','volumeBuild','buildFraction']);
function pickSkillFor(gradeId,neededType){
  const g=getGrade(gradeId);
  const safe=(s)=>neededType!=='mc'||!MC_UNSAFE_GENS.has(s.gen);
  const pool=g.skills.filter(s=>s.types.includes(neededType)&&safe(s));
  const fallback=g.skills.filter(safe);
  return pick(pool.length?pool:(fallback.length?fallback:g.skills));
}
// Defensive: guarantees a usable `choices` array even if a future skill config
// picks a generator that doesn't always produce one (belt-and-suspenders on
// top of the MC_UNSAFE_GENS filter in pickSkillFor).
function mcQuestion(gradeId){
  const q=generate(pickSkillFor(gradeId,'mc'),miniDifficulty(gradeId),'mc');
  if(!q.choices||!q.choices.length){const n=Number(q.answer);q.choices=Number.isFinite(n)?numChoices(n,5):shuffle([q.answer,'A','B','C']);}
  return q;
}
function awardMini(coins,stars=0){
  const p=state.player;p.coins+=coins;p.stars+=stars;p.xp+=coins*2;p.points+=coins;
  const b=new Set(p.badges);b.add('first-steps');p.badges=[...b];
  checkBadges();sound.coin();
}

   Every visual asset is referenced by a name through ic(name). To swap in
   painterly raster art later, just add an entry to ART: e.g.
       ART.coin = './art/coin.png';
   ...and that asset becomes an <img> with zero other code changes. Drop a

  const svg = ICONS[name];
  if (!svg) return '';
  return `<span class="ic ${cls}" style="width:${size}px;height:${size}px" aria-hidden="true">${svg}</span>`;
}

const VINE_SVG=`<svg viewBox="0 0 60 200" width="52" height="180"><path d="M30 0C10 40 50 70 30 110s-10 70 4 90" fill="none" stroke="#2E7D32" stroke-width="5"/><g fill="#66BB6A" stroke="#1B5E20" stroke-width="2"><ellipse cx="14" cy="48" rx="12" ry="7" transform="rotate(-30 14 48)"/><ellipse cx="46" cy="86" rx="12" ry="7" transform="rotate(30 46 86)"/><ellipse cx="16" cy="128" rx="12" ry="7" transform="rotate(-30 16 128)"/></g></svg>`;
// Each region is a distinct habitat, not just a re-tinted copy of the same jungle:

const SCENE_THEMES={
  entrance:{sky:true,leaves:true,butterflies:true,fireflies:10,critterL:'monkey',critterR:'bird',fg:'palm',ambient:'none'},
  bamboo:{sky:true,leaves:true,butterflies:true,fireflies:10,critterL:'monkey',critterR:'bird',fg:'bamboo',ambient:'none'},
  river:{sky:true,leaves:false,butterflies:true,fireflies:8,critterL:'turtle',critterR:'frog',fg:'palm',ambient:'none',lily:true},

  caves:{sky:false,leaves:false,butterflies:false,fireflies:20,critterL:'',critterR:'',fg:'gem',ambient:'dark',stalactites:true,fireflyColor:'#B39DDB'},

function sceneHTML(colors,scene,inner,dim){
  const c=colors||{primary:'#3BA55D',secondary:'#1B5E20',accent:'#FBC02D',sky:'#CDEFD3'};
  const t=SCENE_THEMES[scene]||SCENE_THEMES.entrance;
  const cloudCount=t.extraClouds?5:3;
  const clouds=t.sky?Array.from({length:cloudCount},(_,i)=>`<div class="scene-cloud" style="top:${4+i*8}%;animation-duration:${40+i*15}s;animation-delay:${i*8}s">${ic('cloud',70+i*20)}</div>`).join(''):'';
  const birdCount=t.extraClouds?4:3;
  const birds=t.sky?Array.from({length:birdCount},(_,i)=>`<div class="scene-bird" style="top:${8+i*7}%;animation-duration:${16+i*4}s;animation-delay:${i*5}s">${ic('bird',40+i*6)}</div>`).join(''):'';
  const butterflies=t.butterflies?[0,1,2,3,4].map(i=>`<div class="scene-butterfly" style="left:${8+i*20}%;top:${18+(i%3)*16}%;animation-duration:${7+i}s">${ic(i%3===2?'bee':'butterfly',36)}</div>`).join(''):'';
  const fireflyN=t.fireflies!=null?t.fireflies:14;
  let ff='';for(let i=0;i<fireflyN;i++)ff+=`<span class="scene-firefly" style="left:${(i*37)%100}%;top:${(i*53)%90}%;animation-duration:${3+(i%4)}s;animation-delay:${i*0.3}s${t.fireflyColor?`;background:radial-gradient(circle,#fff,${t.fireflyColor});box-shadow:0 0 8px 2px ${t.fireflyColor}cc`:''}"></span>`;
  let leaves='';if(t.leaves)for(let i=0;i<7;i++)leaves+=`<div class="scene-leaf" style="left:${(i*14)%100}%;animation-duration:${9+(i%5)*2}s;animation-delay:${i*1.4}s">${ic('leaf',26)}</div>`;
  const water=(scene==='river'||scene==='temple'||scene==='canopy')?`<div class="scene-waterfall"><span></span><span></span><span></span><span></span><span></span></div>`:'';
  const lily=t.lily?[14,68].map((L,i)=>`<div class="scene-lily ${i?'scene-lily--2':''}" style="left:${L}%;animation-delay:${i*0.6}s">${ic('leaf',i?54:40)}</div>`).join(''):'';
  const stalactites=t.stalactites?[4,16,30,46,60,74,88].map((L,i)=>`<div class="scene-stalactite" style="left:${L}%;border-top-width:${26+(i%3)*14}px"></div>`).join(''):'';
  const crystalGlow=t.stalactites?[[18,'20%'],[72,'14%'],[42,'40%']].map(([L,top])=>`<div class="scene-crystal-glow" style="left:${L}%;top:${top};width:${60+((L*7)%40)}px;height:${60+((L*7)%40)}px;animation-duration:${4+(L%3)}s"></div>`).join(''):'';
  const fgIcon=t.fg;
  const fg2Size=fgIcon==='bamboo'?130:fgIcon==='gem'?110:fgIcon==='cloud'?150:fgIcon==='temple'?150:170;
  const fgSize=fgIcon==='bamboo'?190:fgIcon==='gem'?150:fgIcon==='cloud'?210:fgIcon==='temple'?220:250;
  const fg=`<div class="scene-palm scene-palm--l2">${ic(fgIcon,fg2Size)}</div><div class="scene-palm scene-palm--r2">${ic(fgIcon,fg2Size+15)}</div>
    <div class="scene-palm scene-palm--l">${ic(fgIcon,fgSize)}</div><div class="scene-palm scene-palm--r">${ic(fgIcon,fgSize+30)}</div>`;
  const critterL=t.critterL?`<div class="scene-critter scene-monkey">${ic(t.critterL,80)}</div>`:'';
  const critterR=t.critterR?`<div class="scene-critter scene-toucan">${ic(t.critterR,92)}</div>`:'';
  const ambient=t.ambient!=='none'?`<div class="scene-ambient scene-ambient--${t.ambient}"></div>`:'';
  return `<div class="scene" style="--c-primary:${c.primary};--c-secondary:${c.secondary};--c-accent:${c.accent};--c-sky:${c.sky}">
    <div class="scene-sky"></div><div class="scene-sun"></div>

    <svg class="scene-hills" style="height:46vh" viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="${c.secondary}" fill-opacity="0.55" d="M0,192 C240,120 480,240 720,200 C960,160 1200,240 1440,180 L1440,320 L0,320 Z"/></svg>
    <svg class="scene-hills" style="height:34vh" viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="${c.primary}" d="M0,256 C240,200 360,300 640,268 C900,236 1100,300 1440,248 L1440,320 L0,320 Z"/></svg>
    ${water}${lily}
    ${scene==='caves'?'':[6,17,29,41,53,65,77,90].map((L,i)=>`<div class="scene-vine" style="left:${L}%;animation-duration:${5+(i%4)}s;animation-delay:${(i*0.45).toFixed(2)}s"><div class="vine-inner" style="transform:scale(${(0.7+((i*29)%60)/100).toFixed(2)})">${VINE_SVG}</div></div>`).join('')}
    ${fg}
    ${critterL}${critterR}
    ${butterflies}${ff}${leaves}
    ${stalactites}${crystalGlow}
    <div class="scene-fog"></div>${ambient}${dim?'<div class="scene-dim"></div>':''}
    <div class="scene-content">${inner}</div>
  </div>`;
}
function elephant(mood='idle',size=200){

// ---- Per-grade guide "buddies" -------------------------------------------
// Ellie the elephant is the overall mascot, but each grade region has its own
// animal friend who takes the lead as the on-screen guide (2nd grade is Ellie's
// home, so Ellie herself guides there). Names are placeholders — easy to rename.
const BUDDIES={
  'K':{kind:'butterfly',name:'Bella'},
  '1':{kind:'bird',name:'Pip'},
  '2':{kind:'elephant',name:'Ellie'},
  '3':{kind:'tiger',name:'Rajah'},
  '4':{kind:'panther',name:'Shadow'},
  '5':{kind:'snake',name:'Sunny'},
};
const getBuddy=(gid)=>BUDDIES[gid]||BUDDIES['K'];
function buddyIntro(g){
  const b=getBuddy(g.id);
  const lines={
    butterfly:`Hi there! I'm ${b.name} the butterfly. Welcome to ${g.region} — let's flutter into some math!`,
    bird:`Tweet tweet! I'm ${b.name} the bird. Welcome to ${g.region} — ready to fly through some math?`,
    elephant:`Welcome to my home, ${g.region}! I'm ${b.name}. Let's make a splash with math!`,
    tiger:`Roar! I'm ${b.name} the tiger. Welcome to ${g.region} — let's prowl for treasure!`,
    panther:`Hello, explorer. I'm ${b.name} the panther. Welcome to ${g.region} — let's track down some math!`,
    snake:`Ssso good to sssee you! I'm ${b.name} the snake. Welcome to ${g.region} — let's slither to the top!`,
  };
  return lines[b.kind]||`Welcome to ${g.region}!`;
}
// buddy(gradeId) returns the right guide figure for that grade, at the given mood.
function buddy(gradeId,mood='idle',size=160){
  const b=getBuddy(gradeId);
  return b.kind==='elephant'?elephant(mood,size):critter(b.kind,mood,size);
}
// Hand-built cute SVG animal guides, drawn in Ellie's rounded, big-eyed style so
// the whole cast reads as one world. Moods drive expression, like elephant().
function critter(kind,mood='idle',size=180){
  const happy=mood==='celebrate'||mood==='wave';
  const worried=mood==='encourage';
  const look=mood==='point'?6:mood==='think'?-5:0; // pupil shift
  const eyes=(lx,rx,ey,r=13)=>`<circle cx="${lx}" cy="${ey}" r="${r}" fill="#fff"/><circle cx="${rx}" cy="${ey}" r="${r}" fill="#fff"/>`+
    `<circle cx="${lx+look}" cy="${ey+(worried?2:0)}" r="${(r*0.5).toFixed(1)}" fill="#20304d"/><circle cx="${rx+look}" cy="${ey+(worried?2:0)}" r="${(r*0.5).toFixed(1)}" fill="#20304d"/>`+
    `<circle cx="${lx+look+2}" cy="${ey-3}" r="2.2" fill="#fff"/><circle cx="${rx+look+2}" cy="${ey-3}" r="2.2" fill="#fff"/>`;
  const smile=(cx,cy,w)=>happy?`<path d="M${cx-w} ${cy} q${w} ${(w*0.8).toFixed(1)} ${w*2} 0" stroke="#20304d" stroke-width="3.5" fill="#fff" stroke-linecap="round"/>`
    :worried?`<path d="M${cx-w*0.5} ${cy+3} q${(w*0.5).toFixed(1)} -${(w*0.4).toFixed(1)} ${w} 0" stroke="#20304d" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
    :`<path d="M${cx-w*0.5} ${cy} q${(w*0.5).toFixed(1)} ${(w*0.4).toFixed(1)} ${w} 0" stroke="#20304d" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  let art='';
  if(kind==='tiger'){
    // Seated tiger: striped body, curling tail, front paws, big striped head.

function manipHTML(s){
  if(!s)return '';
  const k=s.kind;
  if(k==='objects'){let o='';for(let i=0;i<s.count;i++)o+=`<span class="manip-obj" style="animation-delay:${i*0.05}s">${ic(s.name,42)}</span>`;return `<div class="manip manip-objects">${o}</div>`;}
  if(k==='tenFrame'){const total=s.op==='-'?s.a:s.a+s.b;const cellCount=total>10?20:10;const cellAt=(i)=>{const c=i<s.a?'a':(s.op!=='-'&&i<s.a+s.b)?'b':'';return `<div class="tenframe-cell ${c?'filled '+c:''}"></div>`;};let frames='';for(let f=0;f<cellCount/10;f++){let cells='';for(let i=0;i<10;i++)cells+=cellAt(f*10+i);frames+=`<div class="tenframe">${cells}</div>`;}return `<div class="manip"><div class="tenframe-group">${frames}</div><p class="manip-cap">Ten frame — count the filled circles.</p></div>`;}
  if(k==='baseTen'){const n=s.n,h=Math.floor(n/100),t=Math.floor((n%100)/10),o=n%10;let out='';for(let i=0;i<Math.min(h,9);i++)out+='<div class="bt-hundred"></div>';for(let i=0;i<t;i++)out+='<div class="bt-ten"></div>';for(let i=0;i<o;i++)out+='<div class="bt-one"></div>';return `<div class="manip baseten">${out}<p class="manip-cap">Base-ten blocks: hundreds, tens, and ones.</p></div>`;}
  if(k==='numberLine'){
    let center=s.center,hopFrom=null,hopTo=null;
    if(center==null&&s.a!=null){hopFrom=s.a;hopTo=s.op==='+'?s.a+s.b:s.a-s.b;center=Math.abs(hopTo-hopFrom)<=8?Math.round((hopFrom+hopTo)/2):hopTo;}
    const start=Math.max(0,center-4);let t='';
    for(let i=0;i<9;i++){const x=start+i;const cls=hopFrom!=null?(x===hopFrom?'here':x===hopTo?'there':''):(x===center?'here':'');t+=`<div class="numline-tick"><span class="numline-dot ${cls}"></span><span class="numline-num num">${x}</span></div>`;}
    const cap=hopFrom!=null?`Number line — hop from ${hopFrom} to ${hopTo}.`:'Number line — hop one step to move.';
    return `<div class="manip"><div class="numline">${t}</div><p class="manip-cap">${cap}</p></div>`;
  }
  if(k==='array'||k==='grid'){let d='';for(let i=0;i<s.rows*s.cols;i++)d+=`<span class="${k==='grid'?'array-sq':'array-dot'}"></span>`;return `<div class="manip"><div class="array" style="grid-template-columns:repeat(${s.cols},1fr)">${d}</div><p class="manip-cap">${s.rows} rows × ${s.cols} = count them all.</p></div>`;}
  if(k==='rect'){return `<div class="manip"><div class="rectbox" style="width:${s.w*26}px;height:${s.h*26}px"><span class="rect-w num">${s.w}</span><span class="rect-h num">${s.h}</span></div><p class="manip-cap">Add up the side lengths.</p></div>`;}
  if(k==='fractionBar'){let p='';for(let i=0;i<s.parts;i++)p+=`<div class="fracbar-part ${i<s.shaded?'on':''}"></div>`;return `<div class="manip"><div class="fracbar">${p}</div><p class="manip-cap">Colored parts out of total parts.</p></div>`;}
  if(k==='fractionBarCompare'){const bar=(num,den)=>{let p='';for(let i=0;i<den;i++)p+=`<div class="fracbar-part ${i<num?'on':''}"></div>`;return `<div class="fraccmp-row"><div class="fracbar">${p}</div><span class="num fraccmp-label">${num}/${den}</span></div>`;};return `<div class="manip">${bar(s.a[0],s.a[1])}${bar(s.b[0],s.b[1])}<p class="manip-cap">Longer colored bar = greater fraction.</p></div>`;}
  if(k==='fractionNumberLine'){const W=300,L=20,R=280,y=42;const step=(R-L)/s.den;let ticks='';for(let i=0;i<=s.den;i++){const x=L+step*i;const big=i===0||i===s.den;ticks+=`<line x1="${x.toFixed(1)}" y1="${big?26:32}" x2="${x.toFixed(1)}" y2="${big?58:52}" stroke="var(--deep-forest)" stroke-width="${big?3:2}"/>`;if(big)ticks+=`<text x="${x.toFixed(1)}" y="76" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="15" fill="var(--deep-forest)">${i===0?'0':'1'}</text>`;}const px=L+step*s.k;const dot=`<circle cx="${px.toFixed(1)}" cy="${y}" r="8" fill="var(--treasure-orange)" stroke="var(--deep-forest)" stroke-width="2.5"/>`;return `<div class="manip"><svg viewBox="0 0 ${W} 90" width="min(320px,86vw)" height="90"><line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="var(--deep-forest)" stroke-width="3"/>${ticks}${dot}</svg><p class="manip-cap">Count the equal jumps from 0 to the point.</p></div>`;}
  if(k==='angle'){const deg=s.deg,V=[110,150],len=104,r=30;const rad=deg*Math.PI/180;
    const p2=[V[0]+len*Math.cos(rad),V[1]-len*Math.sin(rad)];
    const a1=[V[0]+r,V[1]],a2=[V[0]+r*Math.cos(rad),V[1]-r*Math.sin(rad)];
    const arc=`<path d="M${a1[0]} ${a1[1]} A${r} ${r} 0 0 0 ${a2[0].toFixed(1)} ${a2[1].toFixed(1)}" fill="none" stroke="var(--treasure-orange)" stroke-width="3"/>`;
    const sq=deg===90?`<path d="M${V[0]+18} ${V[1]} L${V[0]+18} ${V[1]-18} L${V[0]} ${V[1]-18}" fill="none" stroke="var(--treasure-orange)" stroke-width="2.5"/>`:'';
    return `<div class="manip"><svg viewBox="0 0 220 180" width="230" height="150"><line x1="${V[0]}" y1="${V[1]}" x2="${V[0]+len}" y2="${V[1]}" stroke="var(--elephant-blue)" stroke-width="5" stroke-linecap="round"/><line x1="${V[0]}" y1="${V[1]}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="var(--elephant-blue)" stroke-width="5" stroke-linecap="round"/>${arc}${sq}<circle cx="${V[0]}" cy="${V[1]}" r="5" fill="var(--deep-forest)"/></svg><p class="manip-cap">Compare the opening to a square corner (90°).</p></div>`;}
  if(k==='bars'){const maxV=Math.max(...s.data.map(d=>d.val));let cols='';s.data.forEach(d=>{cols+=`<div class="bargraph-col"><div class="bargraph-bar" style="height:${(d.val/maxV)*120+10}px"><span class="num bargraph-val">${d.val}</span></div><span class="bargraph-label">${d.icon?ic(d.icon,30):esc(d.label)}</span></div>`;});return `<div class="manip"><div class="bargraph">${cols}</div></div>`;}
  if(k==='prism'){return `<div class="manip"><div class="prism"><div class="prism-top"></div><div class="prism-front"><span class="num">${s.w}×${s.h}</span></div><div class="prism-side"></div><span class="prism-l num">${s.l}</span></div><p class="manip-cap">Length × width × height.</p></div>`;}
  if(k==='clock'){return `<div class="manip">${clockSVG(s.h,s.m,170)}</div>`;}
  if(k==='coins'){return `<div class="manip"><div class="coins-visual">${s.coins.map(coinDot).join('')}</div><p class="manip-cap">Count the coins.</p></div>`;}
  if(k==='shape'){const sh=s.shape;const co='fill="var(--elephant-blue)" stroke="var(--deep-forest)" stroke-width="4"';let svg='';
    if(sh==='circle')svg=`<circle cx="60" cy="60" r="46" ${co}/>`;
    else if(sh==='square')svg=`<rect x="16" y="16" width="88" height="88" rx="6" ${co}/>`;
    else if(sh==='rectangle')svg=`<rect x="10" y="34" width="100" height="52" rx="6" ${co}/>`;
    else if(sh==='triangle')svg=`<polygon points="60,14 108,104 12,104" ${co}/>`;
    else if(sh==='rhombus')svg=`<polygon points="60,14 106,60 60,106 14,60" ${co}/>`;
    else if(sh==='pentagon')svg=`<polygon points="60,12 106,46 88,102 32,102 14,46" ${co}/>`;
    else if(sh==='hexagon')svg=`<polygon points="36,16 84,16 108,60 84,104 36,104 12,60" ${co}/>`;
    return `<div class="manip"><svg viewBox="0 0 120 120" width="130" height="130">${svg}</svg></div>`;}
  if(k==='solid'){return `<div class="manip"><svg viewBox="0 0 140 140" width="140" height="140">${solidSVG(s.solid)}</svg><p class="manip-cap">A 3D solid — look at its faces and edges.</p></div>`;}
  if(k==='lengthUnits'){let u='';for(let i=0;i<s.n;i++)u+=`<span class="len-unit">${ic(s.unit,30)}</span>`;return `<div class="manip"><div class="len-object" style="width:${s.n*38}px"></div><div class="len-units">${u}</div><p class="manip-cap">Measure with ${s.unit}s, laid end to end.</p></div>`;}
  if(k==='lengthCompare'){const row=(o)=>{let u='';for(let i=0;i<o.n;i++)u+=`<span class="len-unit">${ic(o.unit,24)}</span>`;return `<div class="lencmp-row"><span class="lencmp-label">${esc(o.label)}</span><div class="len-object len-object--sm" style="width:${o.n*30}px"></div><div class="len-units">${u}</div></div>`;};return `<div class="manip lencmp">${s.items.map(row).join('')}<p class="manip-cap">Count the units under each one.</p></div>`;}
  return '';
}
// Simple hand-built SVG solids for the 3D-geometry activity (NO emoji / raster).
function solidSVG(name){
  const f='fill="var(--elephant-blue)"',fd='fill="#2f7fc4"',fl='fill="#6bb0ef"',st='stroke="var(--deep-forest)" stroke-width="3" stroke-linejoin="round"';

  if(name==='cone')return `<g ${st}><path d="M70,24 L106,104 A40 12 0 0 1 34,104 Z" ${f}/><path d="M34,104 A40 12 0 0 0 106,104" fill="none" ${st}/><ellipse cx="70" cy="104" rx="36" ry="10" ${fd} opacity="0.55"/></g>`;
  if(name==='cylinder')return `<g ${st}><rect x="30" y="36" width="80" height="68" ${f}/><ellipse cx="70" cy="104" rx="40" ry="12" ${fd}/><ellipse cx="70" cy="36" rx="40" ry="12" ${fl}/></g>`;
  return '';
}
