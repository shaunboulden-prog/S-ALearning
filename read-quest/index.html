<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReadQuest — Interactive Reading Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   ReadQuest — Design tokens
   ============================================================ */
:root{
  --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#DBEAFE;
  --teal:#14B8A6; --teal-l:#CCFBF1;
  --gold:#F59E0B; --gold-l:#FEF3C7;
  --green:#22C55E; --green-l:#DCFCE7;
  --red:#EF4444; --red-l:#FEE2E2;
  --bg:#F8FAFC; --text:#1F2937; --muted:#64748B;
  --card:#FFFFFF; --line:#E2E8F0;
  --shadow:0 10px 30px rgba(15,23,42,.08),0 2px 8px rgba(15,23,42,.05);
  --shadow-lg:0 24px 60px rgba(15,23,42,.16);
  --radius:22px; --radius-sm:14px;
  --font-title:'Poppins',system-ui,sans-serif;
  --font-head:'Nunito',system-ui,sans-serif;
  --font-body:'Open Sans',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --readscale:1;
}
/* High-contrast mode */
body.hc{
  --bg:#000; --text:#fff; --muted:#e2e2e2; --card:#0b0b0b; --line:#666;
  --blue:#4d9bff; --blue-l:#10233f; --teal:#2ee6cf; --gold:#ffce4d;
  --green-l:#0f2e1a; --green:#5cf27a; --red-l:#3a1414; --red:#ff6b6b;
  --shadow:0 0 0 2px #fff inset; --shadow-lg:0 0 0 3px #fff inset;
}
/* Colorblind-safe: rely on icons + patterns already; this shifts hues */
body.cb{
  --green:#0072B2; --green-l:#cfe6f5; --red:#D55E00; --red-l:#fbe0d0;
  --gold:#E69F00; --teal:#009E73; --blue:#0072B2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body); color:var(--text);
  background:
    radial-gradient(900px 500px at 8% -8%, #E0ECFF 0%, transparent 55%),
    radial-gradient(800px 460px at 100% 2%, #DcFcF4 0%, transparent 52%),
    radial-gradient(760px 520px at 50% 108%, #FFE9F3 0%, transparent 55%),
    radial-gradient(680px 420px at 92% 88%, #FFF3D6 0%, transparent 55%),
    var(--bg);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
/* playful floating background blobs */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(8px);opacity:.5;pointer-events:none}
body::before{width:150px;height:150px;left:-40px;top:120px;background:radial-gradient(circle at 30% 30%,#93C5FD,#60A5FA);animation:float1 9s ease-in-out infinite}
body::after{width:120px;height:120px;right:-30px;top:320px;background:radial-gradient(circle at 30% 30%,#5EEAD4,#2DD4BF);animation:float2 11s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(26px) rotate(12deg)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
body.hc::before,body.hc::after{display:none}
button{font-family:var(--font-title);cursor:pointer;border:none}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{
  outline:4px solid var(--gold); outline-offset:3px; border-radius:12px;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.iconbtn .ic,.nav-btn .ic,.chip .ic,.shop-tab .ic,.teacher-corner-btn .ic{width:1.15em;height:1.15em}
.btn-primary .ic,.btn-ghost .ic{width:1.1em;height:1.1em;vertical-align:-.14em}
.hud .stat .ic{width:1.25em;height:1.25em}
.bloom-badge .ic{width:1.15em;height:1.15em;vertical-align:-.22em}
.grade-btn .emoji .ic{width:34px;height:34px}
.toast .em .ic{width:26px;height:26px;vertical-align:-.35em}
.trophy .ic{width:70px;height:70px}
.cert .seal .ic,.cert .badgez .ic{width:44px;height:44px}
.result-hero .trophy .ic{width:70px;height:70px}
#topprogress-runner .ic{width:17px;height:17px;vertical-align:middle}
.lvlname .ic,.lb-emoji .ic,.home-level .ic{width:1.2em;height:1.2em;vertical-align:-.24em}
.lb-emoji .ic{width:40px;height:40px}
.room-coins .ic,.coinpill .ic{width:1.2em;height:1.2em;vertical-align:-.24em}
.sticker .del .ic{width:13px;height:13px;color:#fff}
.feedback .ic{width:1.3em;height:1.3em;vertical-align:-.28em}
.hintbox .ic{width:1.15em;height:1.15em;vertical-align:-.2em}

/* ============================================================
   App shell
   ============================================================ */
#app{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
.topbar{
  display:flex;align-items:center;gap:14px;justify-content:space-between;
  padding:6px 4px 16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--blue),var(--teal));
  display:grid;place-items:center;box-shadow:var(--shadow);
}
.brand h1{font-family:var(--font-title);font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
.brand .tag{font-family:var(--font-head);color:var(--muted);font-size:12.5px;font-weight:700;margin-top:-2px}
.toolbtns{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{
  background:var(--card);color:var(--text);border:1.5px solid var(--line);
  border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow);
  transition:transform .15s var(--ease),background .15s;
}
.iconbtn:hover{transform:translateY(-2px)}
.iconbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.coinpill{display:inline-flex;align-items:center;gap:5px;background:var(--gold-l);border:1.5px solid var(--gold);color:#92600a;border-radius:12px;padding:9px 13px;font-family:var(--font-title);font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.coinpill b{font-size:15px}
.iconbtn.room-btn{background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;border-color:transparent}
.teacher-corner-btn{
  position:fixed;top:12px;right:14px;z-index:130;
  width:32px;height:32px;border-radius:50%;padding:0;
  background:var(--card);border:1.5px solid var(--line);color:var(--text);
  display:grid;place-items:center;box-shadow:var(--shadow);
  opacity:.32;transition:opacity .15s var(--ease),transform .15s var(--ease);
}
.teacher-corner-btn:hover,.teacher-corner-btn:focus-visible{opacity:1;transform:scale(1.08)}
@media(max-width:620px){.teacher-corner-btn{width:28px;height:28px;top:8px;right:8px}}
body.hc .coinpill{background:#1a1405;color:var(--gold)}

/* ===== My Room stage (illustrated room shell + draggable items) ===== */
.stage{position:relative;width:100%;aspect-ratio:1000/650;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);border:3px solid #fff;touch-action:none;user-select:none;background:#dff0f7}
.stage .room-shell-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sticker{position:absolute;transform:translate(-50%,-100%);cursor:grab;background:none;border:none;padding:0;touch-action:none;line-height:0;filter:drop-shadow(0 8px 8px rgba(20,15,10,.28));transition:filter .15s}
.sticker svg{width:100%;height:auto;display:block;overflow:visible}
.sticker:active{cursor:grabbing}
.sticker.on-surface{filter:drop-shadow(0 4px 4px rgba(20,15,10,.3))}
.sticker.selected{filter:drop-shadow(0 0 0 4px rgba(37,99,235,.35)) drop-shadow(0 10px 10px rgba(20,15,10,.3))}
.sticker.selected::after{content:"";position:absolute;inset:-10%;border:3px solid var(--blue);border-radius:14px;box-shadow:0 0 18px rgba(37,99,235,.55);pointer-events:none}
.sticker.invalid{animation:stickerShake .35s}
@keyframes stickerShake{0%,100%{transform:translate(-50%,-100%)}20%{transform:translate(-56%,-100%)}40%{transform:translate(-44%,-100%)}60%{transform:translate(-54%,-100%)}80%{transform:translate(-46%,-100%)}}
.room-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-head);font-weight:700;color:rgba(255,255,255,.9);padding:20px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.35)}

/* Edit panel (appears when a placed item is selected) */
.mlr-editpanel{position:relative;margin-top:14px;background:var(--card);border:1.5px solid var(--blue);border-radius:18px;box-shadow:var(--shadow-lg);padding:16px 18px;animation:fadeIn .2s var(--ease)}
.mlr-ep-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mlr-ep-title{display:flex;align-items:center;gap:10px}
.mlr-ep-art{width:44px;height:44px;border-radius:10px;background:linear-gradient(#eef4ff,#e5eefb);display:grid;place-items:center;padding:4px}
.mlr-ep-art svg{max-width:100%;max-height:100%}
.mlr-ep-name{font-family:var(--font-title);font-weight:800;font-size:16px}
.mlr-ep-status{font-family:var(--font-head);font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:8px;display:inline-block;margin-top:2px}
.mlr-ep-status.equipped{background:var(--green-l,#d1fae5);color:#166534}
.mlr-ep-status.owned{background:var(--blue-l);color:var(--blue-d)}
.mlr-ep-close{font-size:22px;line-height:1;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;width:30px;height:30px;color:var(--text);cursor:pointer}
.mlr-ep-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mlr-ep-btn{font-family:var(--font-title);font-weight:700;font-size:13px;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:9px 14px;color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:transform .13s var(--ease),border-color .13s}
.mlr-ep-btn:hover{transform:translateY(-2px);border-color:var(--blue)}
.mlr-ep-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mlr-ep-btn.danger{color:#b91c1c}
.mlr-ep-btn.danger:hover{border-color:#b91c1c}
.mlr-ep-hint{font-family:var(--font-body);font-size:12px;color:var(--muted);margin-top:8px}
.mlr-ep-styles{margin-top:14px}
.mlr-ep-styles h4{font-family:var(--font-head);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--blue);margin:0 0 8px}
.mlr-ep-style-row{display:flex;gap:8px;flex-wrap:wrap}
.mlr-ep-style{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:linear-gradient(#eef4ff,#e5eefb);display:grid;place-items:center;padding:5px;cursor:pointer;transition:transform .13s var(--ease),border-color .13s}
.mlr-ep-style:hover{transform:translateY(-2px)}
.mlr-ep-style.current{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.25)}
.mlr-ep-style svg{max-width:100%;max-height:100%}

/* Room toolbar extras */
.mlr-roomtools{display:flex;gap:8px;flex-wrap:wrap}
.ghost-btn.warn{color:#b91c1c}
.ghost-btn.warn:hover{border-color:#b91c1c}
.ghost-btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

.screen{animation:fadeIn .5s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ============================================================
   Home / grade select
   ============================================================ */
.hero{
  text-align:center;padding:40px 24px 8px;
}
.hero h2{font-family:var(--font-title);font-weight:800;font-size:clamp(28px,5vw,46px);margin:0 0 10px;letter-spacing:-.03em}
.hero h2 .grad{background:linear-gradient(90deg,var(--blue),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-family:var(--font-head);font-weight:700;color:var(--muted);font-size:clamp(15px,2.4vw,19px);max-width:640px;margin:0 auto 6px}
.hero .sub{font-family:var(--font-body);font-weight:400;font-size:14.5px;color:var(--muted)}
.home-level{display:inline-block;margin-top:14px;background:var(--gold-l);border:1.5px solid var(--gold);color:#92600a;font-family:var(--font-head);font-weight:800;font-size:14px;padding:9px 18px;border-radius:999px;box-shadow:var(--shadow)}
body.hc .home-level{background:#1a1405;color:var(--gold)}

.section-title{font-family:var(--font-head);font-weight:800;font-size:18px;text-align:center;margin:26px 0 4px}
.section-title small{display:block;font-weight:700;color:var(--muted);font-size:13px;font-family:var(--font-body)}

.grade-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;margin:18px 0 6px;
}
.grade-btn{
  position:relative;background:var(--card);border:2.5px solid var(--line);
  border-radius:var(--radius-sm);padding:20px 12px 16px;text-align:center;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .18s var(--ease),border-color .18s,box-shadow .18s;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);
}
.grade-btn::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:var(--gc,var(--blue))}
.grade-btn .emoji{font-size:30px;line-height:1;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:var(--gcl,#EFF6FF);margin-top:2px}
.grade-btn:hover{transform:translateY(-5px) scale(1.03);border-color:var(--gc,var(--blue));box-shadow:0 16px 30px rgba(15,23,42,.14)}
.grade-btn .g-label{font-family:var(--font-title);font-weight:700;font-size:16px}
.grade-btn .g-lex{font-family:var(--font-body);font-weight:600;font-size:11.5px;color:var(--muted)}
.grade-btn.selected{background:var(--gc,var(--blue));border-color:var(--gc,var(--blue));color:#fff;box-shadow:0 14px 28px rgba(37,99,235,.3)}
.grade-btn.selected .g-lex{color:rgba(255,255,255,.85)}
.grade-btn.selected .emoji{background:rgba(255,255,255,.25)}
/* rainbow cycle for grade buttons */
.grade-btn:nth-child(7n+1){--gc:#2563EB;--gcl:#DBEAFE}
.grade-btn:nth-child(7n+2){--gc:#14B8A6;--gcl:#CCFBF1}
.grade-btn:nth-child(7n+3){--gc:#F59E0B;--gcl:#FEF3C7}
.grade-btn:nth-child(7n+4){--gc:#EF4444;--gcl:#FEE2E2}
.grade-btn:nth-child(7n+5){--gc:#8B5CF6;--gcl:#EDE9FE}
.grade-btn:nth-child(7n+6){--gc:#EC4899;--gcl:#FCE7F3}
.grade-btn:nth-child(7n+7){--gc:#0EA5E9;--gcl:#E0F2FE}

.genre-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px auto;max-width:820px}
.chip{
  font-family:var(--font-head);font-weight:700;font-size:12.5px;
  background:var(--teal-l);color:#0f766e;border-radius:999px;padding:7px 13px;
  border:1.5px solid transparent;transition:transform .15s var(--ease);
}
.chip[data-active="1"]{background:var(--teal);color:#fff}
.chip:hover{transform:translateY(-2px)}

.cta-wrap{text-align:center;margin:26px 0 6px}
.btn-primary{
  font-family:var(--font-title);font-weight:700;font-size:19px;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue-d));
  border-radius:16px;padding:16px 42px;box-shadow:0 12px 26px rgba(37,99,235,.35);
  transition:transform .16s var(--ease),box-shadow .16s;
}
.btn-primary:hover{transform:translateY(-3px)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{
  font-family:var(--font-title);font-weight:600;font-size:15px;color:var(--blue);
  background:var(--blue-l);border-radius:14px;padding:12px 22px;transition:transform .15s var(--ease);
}
.btn-ghost:hover{transform:translateY(-2px)}

.save-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:30px 0 6px}
.save-btn{font-family:var(--font-title);font-weight:600;font-size:14px;color:var(--blue);background:var(--card);border:1.6px solid var(--line);border-radius:13px;padding:11px 20px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);transition:transform .15s var(--ease),border-color .15s}
.save-btn:hover{transform:translateY(-2px);border-color:var(--blue)}
.save-note{text-align:center;font-family:var(--font-body);font-size:12.5px;color:var(--muted);max-width:520px;margin:8px auto 0}

.soon-card{max-width:560px;margin:40px auto;padding:44px 34px;text-align:center}
.soon-card .soon-icon{width:84px;height:84px;margin:0 auto 6px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#EDE9FE,#FCE7F3)}
.soon-card .soon-icon .ic{width:46px;height:46px}
.soon-card h2{font-family:var(--font-title);font-weight:800;font-size:28px;margin:10px 0 8px}
.soon-card p{font-family:var(--font-body);font-size:15px;color:var(--muted);max-width:440px;margin:0 auto;line-height:1.65}
.soon-card .soon-badge{display:inline-flex;align-items:center;gap:7px;margin-top:18px;font-family:var(--font-head);font-weight:800;font-size:13px;color:#7c3aed;background:#EDE9FE;border:1.5px solid #c4b5fd;border-radius:999px;padding:8px 16px}
body.hc .soon-card .soon-icon,body.hc .soon-card .soon-badge{background:#1a1030}

/* ============================================================
   My Learning Room (bedroom: Room / Store / Earn Points)
   ============================================================ */
.mlr{animation:fadeIn .4s var(--ease)}
.mlr-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.mlr-brand{display:flex;align-items:center;gap:9px;font-family:var(--font-title);font-weight:800;font-size:17px}
.mlr-brand svg{flex:0 0 auto}
.mlr-points{display:inline-flex;align-items:center;gap:7px;background:var(--gold-l);border:1.5px solid var(--gold);color:#92600a;border-radius:14px;padding:8px 15px;font-family:var(--font-title);font-weight:800}
.mlr-points b{font-size:18px}
.mlr-points .point-label{font-family:var(--font-head);font-weight:700;font-size:12px}
body.hc .mlr-points{background:#1a1405;color:var(--gold)}
.mlr-tabs{display:flex;gap:7px;flex-wrap:wrap}
.mlr-tab{font-family:var(--font-head);font-weight:800;font-size:13.5px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 15px;color:var(--text);transition:transform .14s var(--ease),background .14s}
.mlr-tab:hover{transform:translateY(-2px)}
.mlr-tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mlr-tab.mlr-exit{background:transparent;color:var(--muted)}

/* Room tab */
.mlr-roombar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mlr-streak{display:inline-flex;align-items:center;gap:7px;background:#fff2e6;border:1.5px solid #ffb27a;color:#c1550f;border-radius:999px;padding:8px 15px;font-family:var(--font-head);font-weight:800;font-size:13.5px}
body.hc .mlr-streak{background:#2a1408;color:#ff8a4c}
.ghost-btn{font-family:var(--font-title);font-weight:700;font-size:14px;background:var(--card);color:var(--blue);border:1.6px solid var(--line);border-radius:12px;padding:9px 18px;box-shadow:var(--shadow);transition:transform .14s var(--ease),border-color .14s}
.ghost-btn:hover{transform:translateY(-2px);border-color:var(--blue)}
.mlr-stage-wrap{position:relative;display:grid;grid-template-columns:1fr;gap:16px;overflow:hidden;border-radius:18px}
.mlr-stage-wrap .stage{max-width:720px;margin:0 auto;width:100%}
.mlr-closet{position:absolute;top:0;right:0;height:100%;width:min(340px,86%);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:18px;box-shadow:var(--shadow-lg);padding:16px;overflow:auto;transform:translateX(115%);transition:transform .32s var(--ease);z-index:5}
.mlr-closet.open{transform:translateX(0)}
.mlr-closet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mlr-closet-head h2{font-family:var(--font-title);font-weight:800;font-size:20px;margin:0}
.icon-close{font-size:24px;line-height:1;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;width:34px;height:34px;color:var(--text);cursor:pointer}
.mlr-closet-hint{font-family:var(--font-body);font-size:12.5px;color:var(--muted);margin:0 0 12px}
.mlr-cg{font-family:var(--font-head);font-weight:800;font-size:13px;color:var(--blue);margin:12px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.mlr-cg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mlr-citem{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .13s var(--ease),border-color .13s}
.mlr-citem:hover{transform:translateY(-2px);border-color:var(--blue)}
.mlr-citem.placed{border-color:var(--green);background:var(--green-l)}
.mlr-citem-art{width:100%;height:52px;display:grid;place-items:center}
.mlr-citem-art svg{max-height:100%;max-width:100%;width:auto}
.mlr-citem-nm{font-family:var(--font-head);font-weight:700;font-size:11.5px;text-align:center;line-height:1.15}
.mlr-citem-tag{font-family:var(--font-title);font-weight:700;font-size:10.5px;color:var(--muted)}
.mlr-citem.placed .mlr-citem-tag{color:#166534}
.mlr-empty-inv{font-family:var(--font-body);font-size:13.5px;color:var(--muted);text-align:center;padding:20px 6px}
.mlr-tip{font-family:var(--font-body);font-size:13px;color:var(--muted);margin:12px 2px 0;text-align:center}

/* Store tab */
.mlr-store-head{text-align:center;margin-bottom:14px}
.mlr-store-head h1{font-family:var(--font-title);font-weight:800;font-size:26px;margin:0 0 4px}
.mlr-store-head p{font-family:var(--font-body);font-size:14px;color:var(--muted);margin:0}
.mlr-store-cats{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.mlr-scat{font-family:var(--font-head);font-weight:700;font-size:13px;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:8px 14px;color:var(--text)}
.mlr-scat.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mlr-store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mlr-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center;box-shadow:var(--shadow)}
.mlr-prevwrap{width:100%;height:78px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(#eef4ff,#e5eefb)}
.mlr-prev{width:100%;height:100%;border-radius:12px}
.mlr-prev.art{display:grid;place-items:center;padding:6px;background:transparent}
.mlr-prev.art svg{max-height:100%;max-width:100%;width:auto}
.mlr-nm{font-family:var(--font-head);font-weight:800;font-size:13.5px}
.mlr-sub{font-family:var(--font-body);font-size:12px;color:var(--muted);min-height:16px}
.mlr-buy{font-family:var(--font-title);font-weight:700;font-size:13px;border-radius:11px;padding:9px 10px;width:100%;background:var(--blue);color:#fff;border:none;cursor:pointer;transition:transform .13s var(--ease)}
.mlr-buy:hover:not(:disabled){transform:translateY(-2px)}
.mlr-buy.owned{background:var(--teal)}
.mlr-buy.equipped{background:var(--green)}
.mlr-buy.locked{background:var(--line);color:var(--muted);cursor:not-allowed}
.mlr-buy.cant{background:#fca5a5;color:#7f1d1d;cursor:not-allowed}

/* Earn tab */
.mlr-earn-head{text-align:center;margin-bottom:16px}
.mlr-earn-head h1{font-family:var(--font-title);font-weight:800;font-size:26px;margin:0 0 4px}
.mlr-earn-head p{font-family:var(--font-body);font-size:14px;color:var(--muted);margin:0 auto;max-width:560px}
.mlr-earn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mlr-ecard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.mlr-ecard.wide{grid-column:1/-1}
.mlr-ecard h3{font-family:var(--font-title);font-weight:800;font-size:17px;margin:0}
.mlr-ecard p{font-family:var(--font-body);font-size:13.5px;color:var(--muted);margin:0;flex:1}
.mlr-reward{font-family:var(--font-head);font-weight:800;font-size:13px;color:#92600a;background:var(--gold-l);border:1.5px solid var(--gold);border-radius:10px;padding:6px 12px;align-self:flex-start}
body.hc .mlr-reward{background:#1a1405;color:var(--gold)}
.primary-btn{font-family:var(--font-title);font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));border:none;border-radius:13px;padding:12px 20px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.28);transition:transform .14s var(--ease)}
.primary-btn:hover:not(:disabled){transform:translateY(-2px)}
.primary-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.mlr-quiz{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
.mlr-combo{display:flex;gap:9px;justify-content:center;margin-bottom:12px}
.mlr-dot{width:16px;height:16px;border-radius:50%;background:var(--line);border:2px solid var(--line);transition:background .2s,transform .2s}
.mlr-dot.on{background:var(--gold);border-color:var(--gold);transform:scale(1.12)}
.mlr-q{font-family:var(--font-head);font-weight:800;font-size:17px;text-align:center;margin:0 0 14px}
.mlr-qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.mlr-qopts{grid-template-columns:1fr}}
.mlr-qopt{font-family:var(--font-head);font-weight:600;font-size:14.5px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;color:var(--text);cursor:pointer;transition:transform .12s var(--ease),border-color .12s}
.mlr-qopt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}
.mlr-qopt:disabled{cursor:default}
.mlr-qopt.right{background:var(--green-l);border-color:var(--green);color:#166534}
.mlr-qopt.wrong{background:var(--red-l);border-color:var(--red);animation:shake .45s}
.mlr-qfb{font-family:var(--font-head);font-weight:800;font-size:14.5px;text-align:center;min-height:22px;margin:14px 0 0}
.mlr-qfb.good{color:var(--green)}.mlr-qfb.bad{color:var(--red)}

/* ============================================================
   Reader
   ============================================================ */
.hud{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 16px;box-shadow:var(--shadow);margin-bottom:16px;
}
.hud .stat{display:flex;align-items:center;gap:7px;font-family:var(--font-head);font-weight:800;font-size:14px}
.hud .stat .lbl{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.progress{flex:1 1 220px;min-width:180px}
.progress .track{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.progress .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--blue));width:0;transition:width .5s var(--ease)}
.lvlbox{flex:1 1 220px;min-width:190px;background:var(--gold-l);border:1.5px solid var(--gold);border-radius:13px;padding:8px 12px}
.lvltop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.lvlname{font-family:var(--font-head);font-weight:800;font-size:13px;color:#92600a}
.lvlxp{font-family:var(--font-body);font-weight:700;font-size:11.5px;color:#a16207}
.track.sm{height:9px;border-radius:999px;background:#fde9b8;overflow:hidden}
.fill.gold{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#fbbf24);transition:width .5s var(--ease)}
body.hc .lvlbox{background:#1a1405}body.hc .lvlname,body.hc .lvlxp{color:var(--gold)}
.progress .meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-top:5px;font-family:var(--font-body)}

.page-card{padding:0;overflow:hidden}
.scene{width:100%;display:block;background:#eef4ff;border-bottom:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto}
.page-body{padding:26px 30px 20px}
.page-eyebrow{font-family:var(--font-head);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.page-title{font-family:var(--font-title);font-weight:800;font-size:clamp(22px,3.4vw,30px);margin:4px 0 14px;letter-spacing:-.02em}
.prose p{
  font-family:var(--font-body);font-size:calc(18px*var(--readscale));line-height:1.75;
  margin:0 0 15px;color:var(--text);max-width:64ch;
}
.page-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 30px 24px}
.pagenum{font-family:var(--font-head);font-weight:800;color:var(--muted);font-size:14px}
.navbtns{display:flex;gap:10px;flex-wrap:wrap}
.nav-btn{
  font-family:var(--font-title);font-weight:600;font-size:15px;
  border-radius:13px;padding:11px 20px;display:inline-flex;align-items:center;gap:8px;
  background:var(--card);color:var(--text);border:1.6px solid var(--line);box-shadow:var(--shadow);
  transition:transform .15s var(--ease);
}
.nav-btn:hover{transform:translateY(-2px)}
.nav-btn.next{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;border-color:transparent}
.nav-btn.gold{background:var(--gold);color:#3b2a05;border-color:transparent}
.nav-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ============================================================
   Checkpoint / quiz
   ============================================================ */
.quiz-card{padding:28px 30px 30px;animation:pop .4s var(--ease);position:relative;overflow:hidden}
.quiz-card::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#2563EB,#14B8A6,#F59E0B,#EF4444,#8B5CF6,#EC4899)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.bloom-badge{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:800;
  font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:#fff;
  padding:7px 14px;border-radius:999px;background:var(--blue);
}
.bloom-Remember{background:#2563EB}.bloom-Understand{background:#14B8A6}
.bloom-Apply{background:#F59E0B;color:#3b2a05}.bloom-Analyze{background:#8B5CF6}
.bloom-Evaluate{background:#EC4899}.bloom-Create{background:#0EA5E9}
.gram-badge{background:#0D9488}
.wordline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0 6px;font-family:var(--font-head);font-size:calc(22px*var(--readscale))}
.wordchip{font-family:var(--font-head);font-weight:700;font-size:calc(20px*var(--readscale));background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 16px;color:var(--text);box-shadow:var(--shadow);transition:transform .13s var(--ease),border-color .13s,background .13s}
.wordchip:hover:not(:disabled){transform:translateY(-2px);border-color:var(--teal)}
.wordchip.chip-correct{background:var(--green-l);border-color:var(--green);color:#166534;animation:goodpulse .5s var(--ease)}
.wordchip.chip-wrong{background:var(--red-l);border-color:var(--red);animation:shake .45s}
.wordchip:disabled{cursor:default}
.wc-period{font-family:var(--font-head);font-weight:700;font-size:calc(22px*var(--readscale));margin-left:-4px}
.type-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:16px 0 6px}
.type-input{
  font-family:var(--font-head);font-weight:700;font-size:calc(19px*var(--readscale));
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;
  color:var(--text);box-shadow:var(--shadow);min-width:220px;flex:1 1 220px;transition:border-color .13s;
}
.type-input:focus{outline:none;border-color:var(--blue)}
.type-input.wrong{border-color:var(--red);animation:shake .45s}
.type-input.correct{border-color:var(--green);background:var(--green-l)}
.type-input:disabled{cursor:default}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:16px 0 6px}
@media(max-width:620px){.match-wrap{grid-template-columns:1fr}}
.match-col{display:flex;flex-direction:column;gap:10px}
.match-item{
  text-align:left;font-family:var(--font-head);font-weight:600;font-size:calc(15.5px*var(--readscale));
  background:var(--card);border:2px solid var(--line);border-radius:13px;padding:12px 14px;
  color:var(--text);box-shadow:var(--shadow);transition:transform .13s var(--ease),border-color .13s,background .13s;
}
.match-item:hover:not(:disabled){transform:translateY(-2px);border-color:var(--teal)}
.match-item.selected{border-color:var(--blue);background:var(--blue-l)}
.match-item.matched{background:var(--green-l);border-color:var(--green);color:#166534}
.match-item.wrong{background:var(--red-l);border-color:var(--red);animation:shake .45s}
.match-item:disabled{cursor:default}
.checkpoint-label{font-family:var(--font-head);font-weight:800;color:var(--muted);font-size:12.5px;margin-left:10px}
.q-text{font-family:var(--font-head);font-weight:700;font-size:calc(23px*var(--readscale));line-height:1.4;margin:16px 0 20px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.options{grid-template-columns:1fr}.page-body{padding:22px 20px}.page-foot{padding:6px 20px 22px}}
.opt{
  text-align:left;font-family:var(--font-head);font-weight:600;font-size:calc(16.5px*var(--readscale));
  background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;
  color:var(--text);box-shadow:var(--shadow);transition:transform .14s var(--ease),border-color .14s,background .14s;
  display:flex;align-items:center;gap:12px;min-height:60px;
}
.opt .key{
  flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--blue-l);color:var(--blue);
  font-family:var(--font-title);font-weight:700;display:grid;place-items:center;font-size:15px;
}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}
.opt.correct{background:var(--green-l);border-color:var(--green);animation:goodpulse .5s var(--ease)}
.opt.correct .key{background:var(--green);color:#fff}
.opt.wrong{background:var(--red-l);border-color:var(--red);animation:shake .45s}
.opt.wrong .key{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes goodpulse{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.feedback{margin-top:18px;min-height:26px;font-family:var(--font-head);font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
.hintbox{margin-top:12px;background:var(--gold-l);border:1.5px solid var(--gold);border-radius:14px;padding:12px 16px;font-family:var(--font-body);font-size:14.5px;color:#7a5300;display:none}
.hintbox.show{display:block;animation:pop .3s var(--ease)}
.hintbox b{font-family:var(--font-head)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:12px}

/* ============================================================
   Toast / celebration
   ============================================================ */
.toast{
  position:fixed;left:50%;top:26px;transform:translateX(-50%) translateY(-140%);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);
  border-radius:16px;padding:14px 22px;font-family:var(--font-title);font-weight:700;
  font-size:17px;z-index:120;display:flex;align-items:center;gap:12px;transition:transform .5s var(--ease);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .em{font-size:24px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:110}
#topprogress{position:fixed;top:0;left:0;right:0;height:8px;background:rgba(148,163,184,.25);z-index:130}
#topprogress-fill{height:100%;width:0;background:linear-gradient(90deg,#2563EB,#14B8A6,#F59E0B,#EC4899);transition:width .5s var(--ease);box-shadow:0 0 10px rgba(37,99,235,.5)}
#topprogress-runner{position:absolute;top:-7px;left:0;transform:translateX(-50%);font-size:16px;transition:left .5s var(--ease);filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}

/* ============================================================
   End screen
   ============================================================ */
.result-hero{text-align:center;padding:34px 24px 8px}
.result-hero .trophy{font-size:66px;animation:bounce 1.4s var(--ease) infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.result-hero h2{font-family:var(--font-title);font-weight:800;font-size:34px;margin:8px 0 4px}
.level-banner{display:flex;align-items:center;gap:16px;background:var(--gold-l);border:1.5px solid var(--gold);border-radius:18px;padding:16px 20px;margin:20px 0 6px;box-shadow:var(--shadow)}
.level-banner .lb-emoji{font-size:40px;line-height:1}
.level-banner .lb-mid{flex:1;min-width:0}
.level-banner .lb-title{font-family:var(--font-title);font-weight:800;font-size:18px;color:#92600a;margin-bottom:7px}
.level-banner .lb-sub{font-family:var(--font-body);font-weight:600;font-size:12.5px;color:#a16207;margin-top:6px}
.level-banner .track.sm{background:#fde9b8}
.level-banner .lb-total{text-align:center;flex:0 0 auto}
.level-banner .lb-total .big{font-family:var(--font-title);font-weight:800;font-size:26px;color:var(--gold)}
.level-banner .lb-total .lbl{font-family:var(--font-head);font-weight:700;color:#a16207;font-size:11px;text-transform:uppercase}
body.hc .level-banner{background:#1a1405}body.hc .level-banner .lb-title,body.hc .level-banner .lb-sub,body.hc .level-banner .lb-total .lbl{color:var(--gold)}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0 22px}
.result-tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.result-tile::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--tc,var(--blue))}
.result-tile:nth-child(6n+1){--tc:#2563EB}.result-tile:nth-child(6n+2){--tc:#14B8A6}.result-tile:nth-child(6n+3){--tc:#F59E0B}
.result-tile:nth-child(6n+4){--tc:#8B5CF6}.result-tile:nth-child(6n+5){--tc:#EC4899}.result-tile:nth-child(6n+6){--tc:#22C55E}
.result-tile .big{font-family:var(--font-title);font-weight:800;font-size:30px;color:var(--tc,var(--blue))}
.result-tile .lbl{font-family:var(--font-head);font-weight:700;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.bloom-report{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin:6px 0 18px}
.bloom-report h3{font-family:var(--font-head);font-weight:800;margin:0 0 14px;font-size:16px}
.bloom-bar{display:flex;align-items:center;gap:12px;margin:9px 0}
.bloom-bar .name{width:110px;font-family:var(--font-head);font-weight:700;font-size:13.5px}
.bloom-bar .bt{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.bloom-bar .bf{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.bloom-bar .pct{width:52px;text-align:right;font-family:var(--font-head);font-weight:800;font-size:13px;color:var(--muted)}

/* Certificate */
.cert{
  background:linear-gradient(135deg,#fff, #f4f9ff);border:3px double var(--gold);
  border-radius:22px;padding:30px;text-align:center;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.cert::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--gold-l);border-radius:16px;pointer-events:none}
.cert .seal{font-size:44px}
.cert h3{font-family:var(--font-title);font-weight:800;font-size:26px;margin:6px 0 2px;color:var(--blue)}
.cert .who{font-family:var(--font-head);font-weight:800;font-size:22px;border-bottom:2px dashed var(--line);display:inline-block;padding:6px 30px;margin:10px 0}
.cert .line{font-family:var(--font-body);color:var(--muted);font-size:14px;margin:6px 0}
.cert .badgez{font-size:40px;margin:6px}

/* ============================================================
   Teacher mode
   ============================================================ */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal-back.show{display:flex;animation:fadeIn .3s var(--ease)}
.modal{background:var(--card);border-radius:22px;max-width:900px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:22px 22px 0 0;z-index:2}
.modal-head h3{font-family:var(--font-title);font-weight:800;margin:0;font-size:20px}
.modal-body{padding:22px 24px 30px}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{font-family:var(--font-head);font-weight:700;font-size:13.5px;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:9px 14px;color:var(--text)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tpanel{display:none}.tpanel.on{display:block;animation:fadeIn .3s var(--ease)}
.tpanel h4{font-family:var(--font-head);font-weight:800;font-size:15px;margin:18px 0 8px;color:var(--blue)}
.tpanel p,.tpanel li{font-family:var(--font-body);font-size:14.5px;line-height:1.6}
.tpanel ul,.tpanel ol{margin:6px 0 6px 4px;padding-left:20px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:14px;margin:8px 0}
.kv .k{font-family:var(--font-head);font-weight:700;color:var(--muted)}
.akey{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:var(--bg)}
.akey .qh{font-family:var(--font-head);font-weight:800;font-size:14px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.akey .opt-line{font-family:var(--font-body);font-size:13.5px;padding:3px 0}
.akey .opt-line.ans{color:var(--green);font-weight:700}
.vocab-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.vocab-list .v{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.vocab-list .v b{font-family:var(--font-head)}
.printbtn{font-family:var(--font-title);font-weight:700;background:var(--teal);color:#fff;border-radius:12px;padding:11px 18px;font-size:14px}

/* Print worksheet */
@media print{
  body{background:#fff}
  #app,.topbar,.hud,.toolbtns,.modal-head,.tabbar,.no-print{display:none !important}
  #print-area{display:block !important}
}
#print-area{display:none}

footer.credit{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;font-family:var(--font-body)}
</style>

// choose companion pronoun-aware name fill
function fillCompanion(c, protagName){
  if(c.n) return c.t + " " + rand(NAMES.filter(n=>n!==protagName));
  return c.t;
}

/* Build story facts */
function buildFacts(grade){
  const genre = rand(GENRES);
  const gd = GENRE_DATA[genre];
  const protagonist = rand(NAMES);
  const she = Math.random()<.5 ? {s:"she",o:"her",p:"her"} : {s:"he",o:"him",p:"his"};
  const companion = fillCompanion(rand(COMPANIONS)(she), protagonist);
  const setting = rand(gd.settings);
  const objName = rand(OBJECTS);
  const objColor = rand(COLORS);
  const goal = rand(GOALS)(she);
  const obstacle = rand(OBSTACLES);
  const helper = rand(HELPERS)(she);
  const resolution = rand(RESOLUTIONS);
  const theme = rand(THEMES);
  const scenes = gd.scenes;
  return {genre,gd,protagonist,pn:she,companion,setting,objName,objColor,goal,obstacle,helper,resolution,theme,scenes,id:uid()};
}

/* Prose generation, scaled by band (0 simple → 4 sophisticated) */
function sentence(band, variants){
  // variants indexed by band tier; pick exact, else nearest lower, else nearest higher
  for(let b=band;b>=0;b--){ if(variants[b]) return rand(variants[b]); }
  for(let b=band+1;b<=4;b++){ if(variants[b]) return rand(variants[b]); }
  const any=Object.values(variants)[0]; return rand(any);
}

function generateStory(grade){

  const paras = []; // {text, beat}
  const push = (beat,text)=>paras.push({beat,text});

  push("setup", sentence(b,{
    0:[`${P} lived near ${f.setting}. ${cap(pn.s)} loved to explore. Every day was a new day.`],

    4:[`${P} had spent ${pn.p} whole life near ${f.setting}, a place the townspeople hurried past without a second glance. To ${pn.o}, though, it had always hummed with the promise of something unfinished — as if the world there were holding its breath, waiting for the right person to pay attention. On the morning this story begins, ${pn.s} finally did.`]

  }));

  // ---- CONFLICT ----
  push("conflict", sentence(b,{
    0:[`One day, ${P} found ${objArt} ${obj}! But there was a problem. ${cap(pn.s)} had to ${f.goal.short}.`],

    3:[`Then everything changed. Tucked away where no one else had thought to look, ${P} discovered ${objArt} ${obj}. It should have been a happy find, but it carried a weight ${pn.s} had not expected: ${pn.s} would have to ${f.goal.short}, because ${f.goal.why}, and ${pn.s} would have to do it soon.`],
    4:[`Then, on a morning that had promised nothing unusual, everything changed. ${P} discovered ${objArt} ${obj}, tucked into a place no one else had thought to look. What might have been a simple stroke of luck instead settled onto ${pn.p} shoulders like a challenge, for ${pn.s} understood at once that ${pn.s} would have to ${f.goal.short} — ${f.goal.why} — and that the window to do so was already closing.`]
  }));

  // ---- RISING ACTION (scaled precisely to each grade's word target) ----
  const JOURNEY = [
    {0:[`First they had to get past ${f.obstacle}.`],1:[`Their first challenge was ${f.obstacle}, which stood right in their way.`],2:[`Their first real test was ${f.obstacle}, which blocked the only path forward and refused to be ignored.`],3:[`The first test came quickly, in the shape of ${f.obstacle}. It stood squarely across the only path forward, and there was no going around it.`],4:[`The first true test arrived without warning, in the form of ${f.obstacle}. It lay squarely across the only route forward, indifferent to how badly they needed to pass, and it would not be reasoned with.`]},
    {0:[`${P} was scared. But ${pn.s} did not give up.`],1:[`${P} felt afraid, but ${pn.s} took a deep breath and kept going anyway.`],2:[`Fear tugged at ${P}, sharp and sudden, but ${pn.s} steadied ${pn.p} breathing and pressed on rather than turn back.`],3:[`Fear rose in ${P} — real and sudden — but ${pn.s} had learned that fear was not the same as failure. ${cap(pn.s)} steadied ${pn.p} breathing, counted to three, and pressed on.`],4:[`Fear rose in ${P}, real and cold, the kind that whispers that turning back would be the sensible thing. But ${pn.s} had learned, somewhere along the way, that fear and failure are not the same creature. ${cap(pn.s)} steadied ${pn.p} breathing, fixed ${pn.p} eyes on what mattered, and moved forward.`]},
    {0:[`${cap(f.companion)} had a good idea. They tried it together.`],1:[`Then ${f.companion} had an idea. Working together, they tried it out, step by careful step.`],2:[`It was ${f.companion} who spotted the solution first, and side by side they put the idea to work, each covering the other's blind spot.`],3:[`It was ${f.companion} who spotted a solution first — a small thing, easy to miss — and side by side they put the idea to work, each one covering what the other could not see.`],4:[`It was ${f.companion} who noticed the solution first, a detail so small that anyone in a hurry would have missed it. Side by side, they set the idea in motion, each of them instinctively covering what the other could not see, until what had looked impossible began, slowly, to give way.`]},
    {0:[`They kept going. The ${f.objName} showed the way.`],1:[`They did not stop. Somehow the ${f.objName} seemed to point the way whenever they were unsure.`],2:[`They pushed on through the difficulty, and more than once the ${f.objName} seemed to steady them, as if it knew the way better than they did.`],3:[`They pushed deeper into the difficulty, and more than once the ${f.objName} seemed to steady them at exactly the right moment, as though it understood the route far better than they did.`],4:[`They pressed deeper into the trouble, and more than once the ${f.objName} seemed to steady them at precisely the moment they needed it most — as though the small object understood the route, and their fear, better than they did themselves.`]},
    {0:[`Then they met ${f.helper.t}.`],1:[`Just when things looked hardest, they met ${f.helper.t}, ${f.helper.how}.`],2:[`At the point where hope thinned, help arrived in an unexpected form: ${f.helper.t}, ${f.helper.how}.`],3:[`At the very point where hope began to thin, help arrived in an unexpected form — ${f.helper.t}, ${f.helper.how}, and suddenly the impossible looked merely difficult.`],4:[`At the precise moment hope began to thin, help arrived in a shape neither of them had expected: ${f.helper.t}, ${f.helper.how}. It changed nothing about the danger and everything about their chances, and for the first time the impossible began to look merely difficult.`]},

    {0:[`But ${P} remembered why ${pn.s} came. ${cap(pn.s)} kept going.`],1:[`But ${P} remembered why ${pn.s} had started, and that was enough to keep moving.`],2:[`But ${P} remembered why ${pn.s} had started — ${f.goal.why} — and kept moving all the same.`],3:[`But ${P} remembered why ${pn.s} had begun — ${f.goal.why} — and that memory was enough to keep ${pn.p} feet moving.`],4:[`But ${P} kept returning, in ${pn.p} mind, to the reason ${pn.s} had begun at all — ${f.goal.why} — and that single, stubborn memory proved to be enough to keep one foot moving in front of the other.`]},

    {0:[`${cap(pn.s)} took a deep breath. ${cap(pn.s)} was ready.`],1:[`${P} took a deep breath and felt braver than before.`],2:[`${P} drew a slow breath and found, to ${pn.p} surprise, that ${pn.s} felt braver than before.`],3:[`${P} drew one slow, deliberate breath, and found — to ${pn.p} own quiet surprise — that ${pn.s} felt braver than ${pn.s} had at the start.`],4:[`${P} drew one slow, deliberate breath, the kind that steadies more than the lungs, and found — to ${pn.p} own quiet surprise — that ${pn.s} felt braver now, near the end, than ${pn.s} ever had at the easy, hopeful beginning.`]}
  ];
  const target = Math.round((grade.wmin+grade.wmax)/2);
  const wc = ()=>paras.reduce((n,p)=>n+p.text.trim().split(/\s+/).length,0);
  const reserve = [35,65,115,150,210][b]; // approx words for climax + resolution
  const floor = grade.wmin;
  let order = shuffle(JOURNEY.map((_,i)=>i));
  let oi=0, guardR=0;
  const journeyBeatName = idx => idx===0 ? "obstacle" : idx===4 ? "helper" : "rising";
  while(guardR<80){
    guardR++;
    const now = wc();
    // stop once adding another beat would push us past the target (leaving room for reserve)
    if(now >= target - reserve && now >= floor - reserve) break;
    if(oi>=order.length){ order = shuffle(order); oi=0; }
    const jidx = order[oi];
    push(journeyBeatName(jidx), sentence(b, JOURNEY[jidx])); oi++;

  });
  const climaxKey = `The moment ${f.protagonist} finally faced ${f.obstacle}`;
  push("climax", climaxText);

  // ---- RESOLUTION ----
  push("resolution", sentence(b,{
    0:[`It worked! ${P} did it. Everyone was so happy.`],

    0:[`After that, ${P} ${f.resolution}. And ${pn.s} learned that ${f.theme}.`],

    "Mythology":`${P} and the ${cap(f.objColor)} ${cap(f.objName)} of the Gods`,
    "Nature":`The ${cap(f.objColor)} ${cap(f.objName)} at Dawn`,

  // paginate into reading pages (2-4 paras each), matching grade.pages
  const pages = paginate(paras, grade.pages, f);
  f.climaxKey = climaxKey;
  f.title = title;
  return {facts:f, title, pages, wordCount:wc()};
}

function paginate(paras, targetPages, f){
  const n = paras.length;
  const per = Math.max(2, Math.ceil(n/targetPages));
  const pages=[];
  const eyebrows=["The Beginning","A Discovery","The Journey","Into Trouble","The Challenge","The Turning Point","The Big Moment","The Resolution","At Last"];
  for(let i=0,pi=0;i<n;i+=per,pi++){
    const chunk = paras.slice(i,i+per);
    const beats = chunk.map(c=>c.beat);
    let scene;
    if(beats.includes("climax")) scene=f.scenes[2];
    else if(beats.includes("resolution")) scene=f.scenes[0];
    else if(beats.includes("conflict")) scene=f.scenes[1];
    else scene=f.scenes[pi%f.scenes.length];
    pages.push({eyebrow:eyebrows[Math.min(pi,eyebrows.length-1)], paragraphs:chunk.map(c=>c.text), scene, beats});
  }
  return pages;
}

      {level:"Evaluate", q:"At the moment she left the tower, was Elena's decision a responsible one? Which answer BEST evaluates her choice using the story so far?", options:["Yes — she used a trick her father had shown her to keep the light running before she took any real risk for the boat","No — she should have stayed in the tower no matter what happened to the boat","No — leaving a lighthouse unattended is always reckless, no matter the reason","Yes — but only because rowing out into the storm required no real risk"], correct:0, hint:"Notice what Elena did to the light's mechanism with the iron bar BEFORE she ever left the tower."},
      {level:"Evaluate", q:"Which statement BEST assesses how the author builds tension during the rescue (pages 5–6)?", options:["By slowing the action into small, desperate steps, the author makes the outcome feel uncertain and hard-won","By telling the reader at once that everyone survives, the author keeps it relaxing","By focusing on unrelated background details, the author distracts from the danger","By removing all obstacles, the author makes the rescue feel effortless"], correct:0, hint:"Consider how phrases like \"a boat-length at a time\" and \"inch by inch\" shape the reader's experience."},
      {level:"Create", q:"If you were to write the next chapter, which continuation would BEST extend the story's central theme?", options:["Elena faces another dangerous night alone and must again answer, while frightened, what responsibility requires of her","Elena abandons the lighthouse forever and moves far away","Elena becomes famous and never thinks about the light again","The lighthouse is torn down and quickly forgotten by everyone"], correct:0, hint:"Choose the continuation that carries forward the father's idea that responsibility is a question answered again and again."}
    ]
  }
};

// Shape a curated entry into the same object the flow expects from generateStory().
function prepareCurated(grade){
  const cur = CURATED[grade.id];
  if(!cur) return null;
  const f = buildFacts(grade); // start from a complete facts skeleton (pronouns, gd, etc.)
  f.genre = cur.genre; f.gd = GENRE_DATA[cur.genre] || f.gd;
  f.protagonist = cur.protagonist; f.companion = cur.companion;
  f.objName = cur.objName; f.objColor = cur.objColor; f.setting = cur.setting;
  f.obstacle = cur.obstacle; f.theme = cur.theme; f.resolution = cur.resolution;
  if(cur.goal) f.goal = cur.goal;
  if(cur.helper) f.helper = cur.helper;
  if(cur.pn) f.pn = cur.pn;
  if(cur.scenes) f.scenes = cur.scenes;
  f.title = cur.title; f.curated = true;
  f.climaxKey = cur.climaxKey || `The moment ${cur.protagonist} faced ${cur.obstacle}`;
  const pages = cur.pages.map(p=>({eyebrow:p.eyebrow, paragraphs:p.paragraphs.slice(), scene:p.scene}));
  const wordCount = pages.reduce((n,p)=>n + p.paragraphs.join(" ").trim().split(/\s+/).length, 0);
  return { facts:f, title:cur.title, pages, wordCount, curatedQuestions:cur.questions.slice() };
}

/* ================================================================
   Question generator — Bloom's Taxonomy, adaptive
   ================================================================ */
function buildOptions(correct, pool){
  const distract = shuffle(pool.filter(x=>x!==correct)).slice(0,3);
  const opts = shuffle([correct,...distract]);
  return {options:opts, correct:opts.indexOf(correct)};
}
function craft(list){ // list of {t,correct?}
  const s = shuffle(list);
  return {options:s.map(o=>o.t), correct:s.findIndex(o=>o.correct)};
}
// Re-shuffles a fixed (e.g. hand-curated) question's options without mutating the source object.
function shuffleQuestionOptions(q){
  const correctText = q.options[q.correct];
  const options = shuffle(q.options);
  return {...q, options, correct:options.indexOf(correctText)};
}

const need = (fn, ...deps) => { fn.needs = deps; return fn; };

function questionForLevel(level, f, revealed){
  const P=f.protagonist, obj=f.objName, who=f.companion;
  const gens = {
    Remember:[
      ()=>{const b=buildOptions(f.objColor, COLORS);
            return {q:`What color was the ${obj} that ${P} found?`, ...b, hint:`Look back at the moment ${P} first discovered it.`};},
      ()=>{const b=buildOptions(f.objName, OBJECTS);
            return {q:`What special object did ${P} find?`, ...b, hint:`It was ${f.objColor}, and it seemed to help along the way.`};},
      ()=>{const settings = Object.values(GENRE_DATA).flatMap(g=>g.settings);
            const b=buildOptions(f.setting, settings);
            return {q:`Where does most of this story take place?`, ...b, hint:`Reread the very first page.`};},
      ()=>{const b=buildOptions(P, NAMES);
            return {q:`Who is the main character of the story?`, ...b, hint:`This person appears on every page.`};}
    ],
    Understand:[
      ()=>{const b=craft([
              {t:`Because ${f.goal.why}.`, correct:true},
              {t:`Because ${P} wanted to take a nap.`},
              {t:`Because everyone told ${P} to stop trying.`},
              {t:`Because the ${obj} was too heavy to carry.`}
            ]);
            return {q:`Why did ${P} decide to ${f.goal.short}?`, ...b, hint:`Think about what mattered most to ${P}.`};},
      need(()=>{const b=craft([
              {t:`${cap(f.obstacle)} stood in the way.`, correct:true},
              {t:`${P} had forgotten what the goal was.`},
              {t:`The ${obj} disappeared at the start.`},
              {t:`Nobody wanted to help at all.`}
            ]);
            return {q:`What was the main problem ${P} had to get past?`, ...b, hint:`It blocked the only path forward.`};}, 'obstacle'),
      ()=>{const b=craft([
              {t:`${cap(f.companion)} — they worked as a team.`, correct:true},
              {t:`A crowd of strangers ${P} never met.`},
              {t:`No one; ${P} refused all help.`},
              {t:`A group that tried to stop ${P}.`}
            ]);
            return {q:`Who helped ${P} the most on the journey?`, ...b, hint:`They were with ${P} from the beginning.`};}
    ],
    Apply:[
      need(()=>{const b=craft([
              {t:`Stay calm, look carefully, and make a step-by-step plan like ${P} did.`, correct:true},
              {t:`Panic and give up right away.`},
              {t:`Ignore the problem and hope it disappears.`},
              {t:`Blame someone else and walk home.`}
            ]);
            return {q:`If YOU faced a problem like ${f.obstacle}, what would be the smartest first step?`, ...b, hint:`Think about what actually worked in the story.`};}, 'obstacle'),
      ()=>{const b=craft([
              {t:`Ask a partner to help and combine your ideas.`, correct:true},
              {t:`Keep it a secret and struggle alone.`},
              {t:`Do the opposite of everything you know.`},
              {t:`Wait until the very last second to start.`}
            ]);
            return {q:`How could you use ${P}'s teamwork idea in your own life?`, ...b, hint:`The story shows two heads were better than one.`};},
      ()=>{const b=craft([
              {t:`Remember your reason for starting, the way ${P} did, to stay motivated.`, correct:true},
              {t:`Forget why you began so it feels easier.`},
              {t:`Only try things that are already easy.`},
              {t:`Quit as soon as you feel nervous.`}
            ]);
            return {q:`What lesson from ${P} could help you finish something hard?`, ...b, hint:`${P} kept going by remembering the "why."`};}
    ],
    Analyze:[
      need(()=>{const b=craft([
              {t:f.climaxKey+".", correct:true},
              {t:`The moment ${P} first woke up that morning.`},
              {t:`The moment the story's title appeared.`},
              {t:`The moment the ${obj} was put away for good.`}
            ]);
            return {q:`Which event changed the story the MOST?`, ...b, hint:`Find the turning point where everything was decided.`};}, 'climax'),
      ()=>{const b=craft([
              {t:`It kept ${P} moving forward when things got hard.`, correct:true},
              {t:`It had no effect on the story at all.`},
              {t:`It made ${P} decide to give up.`},
              {t:`It only appeared on the last page.`}
            ]);
            return {q:`How did the ${obj} affect ${P}'s journey?`, ...b, hint:`Notice when it "steadied" ${P} in the rising action.`};},
      ()=>{const b=craft([
              {t:`Determined and brave, even while feeling afraid.`, correct:true},
              {t:`Bored and uninterested the whole time.`},
              {t:`Cruel and unkind to everyone around.`},
              {t:`Lazy and unwilling to try anything.`}
            ]);
            return {q:`Which words BEST describe ${P}, based on ${P}'s actions?`, ...b, hint:`Judge by what ${P} did, not just felt.`};}
    ],
    Evaluate:[
      need(()=>{const b=craft([
              {t:`Yes — the choice fit the story's lesson that ${f.theme}.`, correct:true},
              {t:`No — ${P} should have quit at the first problem.`},
              {t:`No — helping others is never worth the effort.`},
              {t:`Yes — but only because it required no courage.`}
            ]);
            return {q:`Was ${P}'s final decision a GOOD one? Pick the best-supported answer.`, ...b, hint:`A strong answer connects to the story's message.`};}, 'resolution'),
      ()=>{const b=craft([
              {t:`It was worth it, because the outcome helped others too.`, correct:true},
              {t:`It was a waste, because nothing changed.`},
              {t:`It was selfish, because ${P} kept everything.`},
              {t:`It was pointless, because ${P} never reached the goal.`}
            ]);
            return {q:`Do you think ${P}'s journey was worth the risk? Choose the best-reasoned answer.`, ...b, hint:`Look at how the story actually ended.`};},
      ()=>{const b=craft([
              {t:`Teamwork — because the biggest wins came when they worked together.`, correct:true},
              {t:`Luck — because ${P} did nothing at all.`},
              {t:`Speed — because ${P} rushed past every problem.`},
              {t:`Silence — because no one ever spoke.`}
            ]);
            return {q:`Which quality mattered MOST to the story's success? Defend the best choice.`, ...b, hint:`Think about what the author kept showing us.`};}
    ],
    Create:[
      ()=>{const b=craft([
              {t:`${P} teaches others what ${P} learned, so they can face their own challenges.`, correct:true},
              {t:`Everyone instantly forgets the whole adventure ever happened.`},
              {t:`The ${obj} is thrown away and never mentioned again.`},
              {t:`Nothing changes and no one is any different.`}
            ]);
            return {q:`What would be the BEST idea for a sequel to this story?`, ...b, hint:`A strong sequel builds on the lesson: ${f.theme}.`};},
      ()=>{const b=craft([
              {t:`If the ${obj} were lost, ${P} would rely on courage and teamwork instead.`, correct:true},
              {t:`If the ${obj} were lost, the story could not exist in any form.`},
              {t:`If the ${obj} were lost, ${P} would simply stop caring.`},
              {t:`If the ${obj} were lost, nothing else would matter to anyone.`}
            ]);
            return {q:`Imagine the ${obj} was never found. What is the most likely NEW story?`, ...b, hint:`Think about ${P}'s inner strengths, not just the object.`};},
      ()=>{const b=craft([
              {t:`A new character who doubts ${P} but is won over by ${P}'s example.`, correct:true},
              {t:`A character who has nothing to do with the plot.`},
              {t:`A character who ends the story on the first page.`},
              {t:`A character identical to ${P} in every single way.`}
            ]);
            return {q:`If you added ONE new character, which would improve the story most?`, ...b, hint:`Good new characters create meaningful conflict or growth.`};}
    ]
  };
  const pool = gens[level] || [];
  const safe = revealed ? pool.filter(fn => !fn.needs || fn.needs.every(b=>revealed.has(b))) : pool;
  const g = rand(safe.length ? safe : pool);
  const built = g();
  return {level, ...built};
}

/* Build the full flow: reading pages interleaved with checkpoints */
function buildFlow(story, grade){
  const flow=[];
  const levels=[];
  for(let i=0;i<=grade.bloomMax;i++) levels.push(BLOOM[i]);
  const usedQ=new Set();
  const revealed=new Set();
  let cpCount=0;
  story.pages.forEach((pg,i)=>{
    flow.push({type:"page", page:pg, num:i+1, total:story.pages.length});
    (pg.beats||[]).forEach(b=>revealed.add(b));
    const isLast = i===story.pages.length-1;
    if(!isLast){
      let q;
      if(story.curatedQuestions && story.curatedQuestions[cpCount]){
        q = shuffleQuestionOptions(story.curatedQuestions[cpCount]);   // hand-written, Bloom's-tagged
      } else {
        const lvl = levels[Math.min(cpCount, levels.length-1)];
        let guard=0;
        do{ q=questionForLevel(lvl, story.facts, revealed); guard++; }while(usedQ.has(q.q) && guard<8);
        usedQ.add(q.q);
      }
      flow.push({type:"check", q, cpIndex:cpCount});
      cpCount++;
    }
  });
  // ---- Grammar round (after the story, before results) ----
  const gram = GRAMMAR.build(story.facts, grade);
  if(gram.length){
    flow.push({type:"gramintro", gtotal:gram.length});
    const gramStepType = t => t==="tap"?"gramtap" : t==="type"?"gramtype" : t==="match"?"grammatch" : "gram";
    gram.forEach((g,i)=>flow.push({type:gramStepType(g.type), item:g, gi:i, gtotal:gram.length}));
  }
  return flow;
}

/* ================================================================
   Grammar generator — grade-scaled, built from the story's elements
   ================================================================ */
const GRAMMAR=(()=>{
  const PLACE={forest:"forest",mountain:"mountain",space:"spaceship",ocean:"beach",desert:"desert",castle:"castle",lab:"lab",library:"library",school:"school",city:"city",adventure:"trail",fantasy:"forest",historical:"village",mystery:"old house",sports:"field"};
  const NOUNS=["rock","tree","star","book","key","map","shell","feather","friend","cloud","bird","flower"];
  const ADJ=["brave","tiny","bright","quiet","clever","gentle","huge","shiny"];
  const ADV=["quickly","slowly","quietly","carefully","bravely","suddenly","gently","proudly"];
  const VERBS=[
    {b:"open",s:"opens",ed:"opened",ing:"opening"},{b:"climb",s:"climbs",ed:"climbed",ing:"climbing"},
    {b:"follow",s:"follows",ed:"followed",ing:"following"},{b:"jump",s:"jumps",ed:"jumped",ing:"jumping"},
    {b:"walk",s:"walks",ed:"walked",ing:"walking"},{b:"help",s:"helps",ed:"helped",ing:"helping"},
    {b:"watch",s:"watches",ed:"watched",ing:"watching"},{b:"look",s:"looks",ed:"looked",ing:"looking"},
    {b:"call",s:"calls",ed:"called",ing:"calling"},{b:"paint",s:"paints",ed:"painted",ing:"painting"}
  ];
  // MC-style item (also used for fix-the-sentence and fill-in-the-blank)
  function mc(skill,q,correct,distractors,hint){
    const opts=shuffle([correct,...distractors]);
    return {skill,type:"mc",q,options:opts,correct:opts.indexOf(correct),hint};
  }
  function tap(skill,instruction,words,correctIdx,hint){
    return {skill,type:"tap",instruction,words,correct:(Array.isArray(correctIdx)?correctIdx:[correctIdx]),hint};
  }
  // Free-typed answer. `accept` lists every spelling that counts as correct (case/whitespace-insensitive).
  function typed(skill,q,answer,accept,hint){
    return {skill,type:"type",q,answer,accept:(accept||[answer]),hint};
  }
  // Click-to-connect matching. pairs: [{l,r}, ...] canonical left/right pairing.
  function match(skill,instruction,pairs,hint){
    const left = pairs.map((p,i)=>({id:i,text:p.l}));
    const right = shuffle(pairs.map((p,i)=>({id:i,text:p.r})));
    return {skill,type:"match",instruction,left,right,hint};
  }
  // ----- individual skill generators (return one item) -----
  const G={
    nounTap:(c)=>tap("Nouns",`Tap the noun that names the THING ${c.Name} carried.`,
      [c.Name,c.verbed,"the",c.obj],3,"A noun names a person, place, or thing. Here, look for the object."),
    verbMC:(c)=>mc("Verbs",`Which word is the VERB (action word)?  “${c.Name} ${c.verbed} the ${c.obj}.”`,
      c.verbed,[c.Name,c.obj,"the"],"A verb shows an action — something you can do."),
    verbTap:(c)=>tap("Verbs","Tap the action word (verb) in the sentence.",
      [c.Name,c.adv,c.verbed,"the",c.obj],2,"A verb is what the subject does."),
    adjMC:(c)=>mc("Adjectives",`Which word is the ADJECTIVE (describing word)?  “${c.Name} saw a ${c.adj} ${c.noun}.”`,
      c.adj,[c.noun,c.Name,"saw"],"An adjective describes a noun — what kind, which one, or how many."),
    adjTap:(c)=>tap("Adjectives","Tap the adjective (the describing word).",
      ["The",c.adj,c.obj,"shone"],1,"An adjective tells us more about a noun."),
    capFix:(c)=>mc("Capitalization","Which sentence is written correctly?",
      `${c.Name} ran to the ${c.place}.`,
      [`${c.lname} ran to the ${c.place}.`,`${c.Name} ran to the ${c.place}`,`${c.Name} Ran to the ${c.place}.`],
      "Begin with a capital, capitalize names, and end with a punctuation mark."),
    endPunct:(c)=>{
      const v=rand([
        {s:`${c.Name} put the ${c.obj} down`, a:"."},
        {s:`Where did ${c.Name} hide the ${c.obj}`, a:"?"},
        {s:`${c.Name} shouted, “We found it${'​'}”`.replace('​',''), a:"!"}
      ]);
      // Build a fill-the-blank for the final mark
      const q=`Which mark best ends this sentence?  “${v.s}___”`;
      return mc("End Punctuation",q,v.a,[".","?","!"].filter(x=>x!==v.a).concat(",").slice(0,3),
        "A statement ends with a period, a question with a question mark, and a strong feeling with an exclamation point.");
    },
    pluralBlank:(c)=>mc("Plural Nouns",`Choose the word that fits:  “${c.Name} counted five ___.”`,
      c.noun+"s",[c.noun,c.noun+"es",c.noun+"'s"],"Most nouns become plural (more than one) by adding -s."),
    svAgree:(c)=>mc("Subject–Verb Agreement",`Choose the correct verb:  “Every morning, ${c.Name} ___ to the ${c.place}.”`,
      c.verb.s,[c.verb.b,c.verb.ing,c.verb.ed],"A singular subject takes a present-tense verb ending in -s."),
    tensePast:(c)=>mc("Verb Tense",`Choose the past-tense verb:  “Yesterday, ${c.Name} ___ the ${c.obj}.”`,
      c.verb.ed,[c.verb.s,c.verb.b,c.verb.ing],"The word “yesterday” signals the past tense."),
    adverbMC:(c)=>mc("Adverbs",`Which word is the ADVERB (tells how)?  “${c.Name} ${c.verbed} the door ${c.adv}.”`,
      c.adv,[c.verbed,"door",c.Name],"An adverb often tells how, when, or where — many end in -ly."),
    pronounBlank:(c)=>mc("Pronouns",`Choose the correct pronoun:  “${c.Name} found the ${c.obj} and put ___ in a bag.”`,
      "it",["them","him","they"],"Use a pronoun that matches its noun — one thing = “it.”"),
    possFix:(c)=>mc("Possessives",`Which correctly shows the ${c.obj} belongs to ${c.Name}?`,
      `${c.Name}'s ${c.obj}`,[`${c.Name}s ${c.obj}`,`${c.Name}s' ${c.obj}`,`${c.Name} ${c.obj}'s`],
      "A singular possessive adds apostrophe + s."),
    commaFix:(c)=>mc("Commas","Which sentence uses commas correctly?",
      `${c.Name} packed a map, a ${c.noun}, and a ${c.obj}.`,
      [`${c.Name} packed a map a ${c.noun} and a ${c.obj}.`,
       `${c.Name} packed a map, a ${c.noun} and, a ${c.obj}.`,
       `${c.Name}, packed a map a ${c.noun} and a ${c.obj}.`],
      "Use commas to separate three or more items in a series."),
    semicolonFix:(c)=>mc("Semicolons","Which sentence is punctuated correctly?",
      `${c.Name} was exhausted; still, ${c.subj} pressed on.`,
      [`${c.Name} was exhausted, still, ${c.subj} pressed on.`,
       `${c.Name} was exhausted still ${c.subj} pressed on.`,
       `${c.Name} was exhausted; still ${c.subj}, pressed on.`],
      "A semicolon joins two complete, closely related sentences."),
    parallelFix:(c)=>mc("Parallel Structure","Which sentence uses parallel structure correctly?",
      `${c.Name} enjoyed reading, hiking, and swimming.`,
      [`${c.Name} enjoyed reading, to hike, and swimming.`,
       `${c.Name} enjoyed to read, hiking, and to swim.`,
       `${c.Name} enjoyed reading, hikes, and to swim.`],
      "Items in a list should share the same grammatical form."),
    activeFix:(c)=>mc("Active Voice","Which sentence is written in the ACTIVE voice?",
      `${c.Name} opened the ${c.obj}.`,
      [`The ${c.obj} was opened by ${c.Name}.`,`The ${c.obj} had been opened.`,`The ${c.obj} was being opened.`],
      "In the active voice, the subject performs the action."),
    pluralType:(c)=>typed("Plural Nouns",`Type the plural of “${c.noun}.”`,
      c.noun+"s",[c.noun+"s"],"Most nouns become plural (more than one) by adding -s."),
    verbPastType:(c)=>typed("Verb Tense",`Type the past-tense form of “${c.verb.b}.”`,
      c.verb.ed,[c.verb.ed],"Most verbs become past tense by adding -ed."),
    possType:(c)=>typed("Possessives",`Type the correct way to show the ${c.obj} belongs to ${c.Name}.`,
      `${c.Name}'s ${c.obj}`,[`${c.Name}'s ${c.obj}`,`${c.Name}’s ${c.obj}`],
      "A singular possessive adds apostrophe + s."),
    capType:(c)=>typed("Capitalization & Punctuation",
      `Type this sentence correctly, with a capital letter and end punctuation: “${c.lname} ran to the ${c.place}”`,
      `${c.Name} ran to the ${c.place}.`,[`${c.Name} ran to the ${c.place}.`],
      "Begin with a capital letter and end with a punctuation mark."),
    posMatch:(c)=>match("Parts of Speech","Match each word to the part of speech it is.",
      [{l:c.Name, r:"Noun (a person)"},{l:c.obj, r:"Noun (a thing)"},
       {l:c.verbed, r:"Verb (an action)"},{l:c.adj, r:"Adjective (describes)"}],
      "A noun names, a verb does, an adjective describes.")
  };
  const BANDS=[
    ["capFix","endPunct","verbMC","nounTap","posMatch"],
    ["verbTap","adjMC","adjTap","pluralBlank","capFix","endPunct","nounTap","pluralType","posMatch"],
    ["verbTap","adjMC","adverbMC","svAgree","tensePast","pluralBlank","endPunct","capFix","pluralType","verbPastType","posMatch"],
    ["adverbMC","svAgree","tensePast","pronounBlank","possFix","commaFix","adjTap","verbPastType","possType","posMatch"],
    ["svAgree","pronounBlank","possFix","commaFix","semicolonFix","parallelFix","activeFix","adverbMC","possType","capType","posMatch"]
  ];
  const COUNT=[2,3,3,4,4];
  function build(facts, grade){
    const b=grade.band;
    const c={
      Name:facts.protagonist, lname:facts.protagonist.toLowerCase(),
      obj:facts.objName, color:facts.objColor,
      place:PLACE[facts.scenes[0]]||"forest",
      noun:rand(NOUNS), adj:rand(ADJ), adv:rand(ADV),
      verb:rand(VERBS), subj:facts.pn.s
    };
    c.verbed=c.verb.ed;
    const skills=shuffle(BANDS[b]).slice(0,COUNT[b]);
    return skills.map(k=>G[k](c));
  }
  return {build};
})();

   SVG scene library — flat vector, palette-driven

function heroFigure(color){
  const map={red:"#EF4444",blue:"#2563EB",golden:"#F59E0B",green:"#22C55E",silver:"#94A3B8",purple:"#8B5CF6",orange:"#FB923C",emerald:"#10B981"};
  const dark={red:"#B91C1C",blue:"#1D4ED8",golden:"#B45309",green:"#15803D",silver:"#64748B",purple:"#6D28D9",orange:"#C2410C",emerald:"#047857"};

/* ================================================================
   Audio engine (WebAudio) + narration
   ================================================================ */
const Audio = (()=>{
  let ctx=null, muted=false, musicOn=false, musicTimer=null;
  const ensure=()=>{ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; };
  function tone(freq,dur,type="sine",vol=.18,when=0){
    if(muted) return; const c=ensure(); if(!c) return;
    const t=c.currentTime+when;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
  }
  return {
    correct(){ [660,880,1046].forEach((f,i)=>tone(f,.28,"triangle",.2,i*.09)); },
    wrong(){ tone(200,.22,"square",.14); tone(150,.28,"square",.12,.08); },
    page(){ tone(520,.09,"sine",.09); tone(680,.09,"sine",.07,.05); },
    click(){ tone(440,.05,"sine",.06); },
    win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,.4,"triangle",.2,i*.12)); },
    setMuted(m){ muted=m; if(m) this.stopMusic(); },
    isMuted(){return muted;},
    toggleMusic(on){
      musicOn=on;
      if(!on){ this.stopMusic(); return; }
      const notes=[392,440,523,494,440,523,587,523];
      let i=0;
      const step=()=>{ if(!musicOn||muted) return; tone(notes[i%notes.length],.5,"sine",.05); i++; };
      step(); musicTimer=setInterval(step,620);
    },
    stopMusic(){ musicOn=false; if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }
  };
})();

let narrating=false;
function narrate(text){
  if(!("speechSynthesis" in window)) return;
  if(narrating){ speechSynthesis.cancel(); narrating=false; setNarrateBtn(false); return; }
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.95; u.pitch=1.02;
  u.onend=()=>{ narrating=false; setNarrateBtn(false); };
  narrating=true; setNarrateBtn(true); speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function setNarrateBtn(on){ const b=$("#btn-narrate"); if(b){b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);} }

/* ================================================================
   Confetti + sparkles
   ================================================================ */
const confetti=(()=>{
  const cv=$("#confetti"); const cx=cv.getContext("2d"); let parts=[],raf=null;
  function resize(){ cv.width=innerWidth; cv.height=innerHeight; }
  addEventListener("resize",resize); resize();
  const cols=["#2563EB","#14B8A6","#F59E0B","#22C55E","#EF4444","#8B5CF6","#EC4899"];
  const MAX_LIFE_MS=4000, MAX_PARTS=260;
  function burst(n=140){
    const born=performance.now();
    for(let i=0;i<n;i++){
      parts.push({x:innerWidth/2+(Math.random()-.5)*220, y:innerHeight*0.28,
        vx:(Math.random()-.5)*11, vy:Math.random()*-11-4,
        g:.28+Math.random()*.1, s:6+Math.random()*7, r:Math.random()*6,
        vr:(Math.random()-.5)*.4, c:rand(cols), sh:Math.random()<.5?0:1, born});
    }
    if(parts.length>MAX_PARTS) parts=parts.slice(parts.length-MAX_PARTS);
    if(!raf) loop();
  }
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    const now=performance.now();
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.r+=p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.sh){ cx.beginPath(); cx.arc(0,0,p.s/2,0,7); cx.fill(); }
      else cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);
      cx.restore();
    });
    parts=parts.filter(p=>p.y<cv.height+40 && (now-p.born)<MAX_LIFE_MS);
    if(parts.length){ raf=requestAnimationFrame(loop); } else { raf=null; cx.clearRect(0,0,cv.width,cv.height); }
  }
  return {burst};
})();

function toast(emoji,msg){
  const t=$("#toast"); t.innerHTML=`<span class="em">${emoji}</span><span>${msg}</span>`;
  t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900);
}
