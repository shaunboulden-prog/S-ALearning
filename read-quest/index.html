   Coins + Virtual Room (shop) with best-effort persistence
   ================================================================ */
const STORE_KEY="readquest_profile_v1";
let coins=0;
let streakCount=0, streakDate="";   // My Learning Room daily streak
const ROOM_DEFAULTS={ wallpaper:"sky-blue", floor:"warm-wood", curtains:"no-curtains", owned:["sky-blue","warm-wood","no-curtains","starter-bed","starter-rug"] };
const ROOM={ wallpaper:ROOM_DEFAULTS.wallpaper, floor:ROOM_DEFAULTS.floor, curtains:ROOM_DEFAULTS.curtains, owned:[...ROOM_DEFAULTS.owned], placed:{} };
function loadProfile(){
  let loaded=false;
  try{
    const s=localStorage.getItem(STORE_KEY);
    if(s){ const p=JSON.parse(s);
      totalXP=p.totalXP||0; coins=p.coins||0;
      if(p.room){ ROOM.wallpaper=p.room.wallpaper||ROOM_DEFAULTS.wallpaper; ROOM.floor=p.room.floor||ROOM_DEFAULTS.floor;
        ROOM.curtains=p.room.curtains||ROOM_DEFAULTS.curtains;
        const savedOwned=Array.isArray(p.room.owned)?p.room.owned:[];
        ROOM.owned=Array.from(new Set([...ROOM_DEFAULTS.owned, ...savedOwned]));
        ROOM.placed=p.room.placed||{}; }
      streakCount=p.streakCount||0; streakDate=p.streakDate||"";
      loaded=true;
    }
  }catch(e){}
  if(!loaded){ coins=50; } // one-time welcome bonus so the shop isn't empty
  updateCoinsUI();
}
function saveProfile(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({totalXP,coins,room:ROOM,streakCount,streakDate})); }catch(e){}
}

/* ---- Portable save file (works offline; survives storage clears & moves between devices) ---- */
function exportProgress(){
  const data={ app:"ReadQuest", version:1, savedAt:new Date().toISOString(),
    totalXP, coins, room:ROOM, streakCount, streakDate };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().slice(0,10);
  const a=document.createElement("a");
  a.href=url; a.download=`readquest-progress-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  Audio.click(); toast(ic('download'),"Progress saved to a file");
}
function importProgress(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onerror=()=>toast(ic('close'),"Could not read that file");
  reader.onload=()=>{
    let p;
    try{ p=JSON.parse(reader.result); }
    catch(e){ toast(ic('close'),"That file isn't a valid save"); return; }
    if(!p || typeof p!=="object" || (p.app && p.app!=="ReadQuest") ||
       (typeof p.totalXP!=="number" && !p.room)){
      toast(ic('close'),"That file isn't a ReadQuest save"); return; }
    if(totalXP>0 && !confirm("Load this saved progress? It will replace your current XP, coins, and room.")) return;
    totalXP=Math.max(0, p.totalXP||0);
    coins=Math.max(0, p.coins||0);
    if(p.room && typeof p.room==="object"){
      ROOM.wallpaper=p.room.wallpaper||ROOM_DEFAULTS.wallpaper;
      ROOM.floor=p.room.floor||ROOM_DEFAULTS.floor;
      ROOM.curtains=p.room.curtains||ROOM_DEFAULTS.curtains;
      const savedOwned=Array.isArray(p.room.owned)?p.room.owned:[];
      ROOM.owned=Array.from(new Set([...ROOM_DEFAULTS.owned, ...savedOwned]));
      ROOM.placed=(p.room.placed && typeof p.room.placed==="object")?p.room.placed:{};
    }
    streakCount=Math.max(0, p.streakCount||0); streakDate=p.streakDate||"";
    saveProfile(); updateCoinsUI();
    confetti.burst(120); Audio.win(); toast(ic('upload'),"Progress loaded!");
    renderHome();
  };
  reader.readAsText(file);
}

function itemArt(id, ctx){
  const a=ART[id]; if(!a) return ic("star");
  const suffix="-"+(ctx||"x")+"-"+id;
  const ns=a.m.replace(/id="([\w-]+)"/g,(m,i)=>`id="${i}${suffix}"`).replace(/url\(#([\w-]+)\)/g,(m,i)=>`url(#${i}${suffix})`);
  return `<svg viewBox="${a.vb}">${ns}</svg>`;
}

function shopItem(id){ for(const cat in SHOP){ const it=SHOP[cat].find(x=>x.id===id); if(it) return {...it,cat}; } return null; }
function owns(id){ return ROOM.owned.includes(id); }
function isPlaceable(cat){ return cat==="furniture"||cat==="decor"||cat==="beds"||cat==="rugs"; }

function renderCloset(){
  const g=$("#bed-closetgroups"); if(!g) return;
  const cats=[["furniture","Furniture"],["decor","Wall Decor"],["beds","Beds"],["rugs","Rugs"]];
  let html="";
  cats.forEach(([cat,label])=>{
    const owned=SHOP[cat].filter(it=>owns(it.id));
    if(!owned.length) return;
    html+=`<h3 class="mlr-cg">${label}</h3><div class="mlr-cg-grid">`;
    owned.forEach(it=>{
      const placed=!!ROOM.placed[it.id];
      html+=`<button class="mlr-citem ${placed?'placed':''}" data-place="${it.id}"><span class="mlr-citem-art">${itemArt(it.id,'closet')}</span><span class="mlr-citem-nm">${it.name}</span><span class="mlr-citem-tag">${placed?ic('check')+' In room':'Place'}</span></button>`;
    });
    html+=`</div>`;
  });
  if(!html) html=`<p class="mlr-empty-inv">Your inventory is empty.<br>Buy furniture, beds, rugs &amp; decorations in the <b>Store</b>!</p>`;
  g.innerHTML=html;
  $$("[data-place]",g).forEach(b=>b.onclick=()=>{
    const id=b.dataset.place;
    pushHistory();
    if(ROOM.placed[id]){ delete ROOM.placed[id]; if(selectedId===id) selectedId=null; } else placeItem(id);
    saveProfile(); Audio.click(); paintStage(); renderCloset(); renderEditPanel();
  });
}

const EQUIP_CATS=["wallpaper","floor","curtains"];
function equippedIdFor(cat){ return cat==="wallpaper"?ROOM.wallpaper: cat==="floor"?ROOM.floor: ROOM.curtains; }

function renderBedStoreGrid(){
  const grid=$("#bed-storegrid"); if(!grid) return;
  const isEquipCat=EQUIP_CATS.includes(bedStoreCat);
  grid.innerHTML=SHOP[bedStoreCat].map(it=>{
    const owned=owns(it.id);
    const prev = (isPlaceable(bedStoreCat)||bedStoreCat==="curtains")
      ? `<div class="mlr-prev art">${itemArt(it.id,'store')}</div>`
      : `<div class="mlr-prev" style="background:${it.bg||it.color}"></div>`;
    let btn, sub="&nbsp;";
    if(!owned){
      const can=coins>=it.cost;
      btn=`<button class="mlr-buy ${can?'':'cant'}" data-buy="${it.id}" ${can?'':'disabled'}>${it.cost===0?'Get Free':('Buy · '+it.cost)}</button>`;
      sub = it.cost>0? `${BED_ICON.star} ${it.cost} points` : 'Free';
    } else if(isEquipCat){
      const eq=equippedIdFor(bedStoreCat)===it.id;
      btn=`<button class="mlr-buy ${eq?'equipped':'owned'}" data-equip="${it.id}">${eq?ic('check')+' Using':'Use'}</button>`; sub="Owned";
    } else {
      const placed=!!ROOM.placed[it.id];
      btn=`<button class="mlr-buy ${placed?'equipped':'owned'}" data-toggle="${it.id}">${placed?ic('check')+' In room':'Place'}</button>`; sub="Owned";
    }
    return `<div class="mlr-card"><div class="mlr-prevwrap">${prev}</div><div class="mlr-nm">${it.name}</div><div class="mlr-sub">${sub}</div>${btn}</div>`;
  }).join("");
  $$("[data-buy]",grid).forEach(b=>b.onclick=()=>bedBuy(b.dataset.buy));
  $$("[data-equip]",grid).forEach(b=>b.onclick=()=>{
    const id=b.dataset.equip, c=shopItem(id).cat;
    pushHistory();
    if(c==="wallpaper")ROOM.wallpaper=id; else if(c==="floor")ROOM.floor=id; else if(c==="curtains")ROOM.curtains=id;
    saveProfile(); Audio.click(); paintStage(); renderBedStoreGrid();
  });
  $$("[data-toggle]",grid).forEach(b=>b.onclick=()=>{
    const id=b.dataset.toggle;
    pushHistory();
    if(ROOM.placed[id]){ delete ROOM.placed[id]; if(selectedId===id) selectedId=null; } else placeItem(id);
    saveProfile(); Audio.click(); paintStage(); renderBedStoreGrid(); renderEditPanel();
  });
}

function bedBuy(id){
  const it=shopItem(id); if(!it||owns(id)) return;
  if(coins<it.cost){ toast(BED_ICON.star,"Not enough points yet — earn a few more!"); return; }
  coins-=it.cost; ROOM.owned.push(id); updateCoinsUI(); updateBedPoints();
  if(it.cat==="wallpaper") ROOM.wallpaper=id;
  else if(it.cat==="curtains") ROOM.curtains=id;
  else if(it.cat==="floor") ROOM.floor=id;
  else placeItem(id);
  Audio.correct(); confetti.burst(90); toast(ic('party'),`You bought ${it.name}!`);
  saveProfile(); renderBedStoreGrid();
}

function bedToday(){ return new Date().toISOString().slice(0,10); }
function bedStreakClaimable(){ return streakDate!==bedToday(); }
function bedClaimStreak(){
  const t=bedToday();
  if(streakDate===t){ toast(BED_ICON.flame,"You already claimed today!"); return; }
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  streakCount = (streakDate===y) ? streakCount+1 : 1;
  streakDate=t;
  coins+=15; updateCoinsUI(); updateBedPoints();
  Audio.correct(); confetti.burst(130); toast(BED_ICON.flame,`+15 points • ${streakCount} day streak!`);
  saveProfile(); renderBedTab();
}

function renderBedQuiz(){
  const box=$("#bed-quiz"); if(!box) return;
  if(!bedQ) bedQ=rand(BED_QUIZ);
  box.innerHTML=`
    <div class="mlr-combo" aria-label="Skill challenge progress">${[0,1,2].map(i=>`<span class="mlr-dot ${i<bedCombo?'on':''}"></span>`).join("")}</div>
    <p class="mlr-q">${bedQ.q}</p>
    <div class="mlr-qopts">${bedQ.options.map((o,i)=>`<button class="mlr-qopt" data-i="${i}">${o}</button>`).join("")}</div>
    <p class="mlr-qfb" id="bed-qfb"></p>`;
  $$(".mlr-qopt",box).forEach(b=>b.onclick=()=>bedAnswer(+b.dataset.i,b));
}

function bedAnswer(i,btn){
  const fb=$("#bed-qfb"); const correct=i===bedQ.a;
  $$(".mlr-qopt").forEach(x=>x.disabled=true);
  if(correct){
    btn.classList.add("right"); bedCombo++;
    let gained=5, bonus=0;
    if(bedCombo>=3){ bonus=20; bedCombo=0; }
    coins+=gained+bonus; updateCoinsUI(); updateBedPoints();
    Audio.correct(); confetti.burst(bonus?150:70);
    if(fb){ fb.className="mlr-qfb good"; fb.textContent = bonus?`Correct! +${gained} points, plus a +${bonus} Skill Challenge bonus!`:`Correct! +${gained} points`; }
    if(bonus) toast(ic('trophy'),"Skill Challenge complete! +20 bonus points");
    saveProfile();
  } else {
    btn.classList.add("wrong"); bedCombo=0;
    $$(".mlr-qopt").forEach((x,idx)=>{ if(idx===bedQ.a) x.classList.add("right"); });
    Audio.wrong();
    if(fb){ fb.className="mlr-qfb bad"; fb.textContent="Not quite — the correct answer is highlighted."; }
  }
  setTimeout(()=>{ bedQ=rand(BED_QUIZ); renderBedQuiz(); }, 1500);
}

  if(floorItem.pattern==="wood"){
    let planks="";
    for(let i=-1,y=380;y<660;y+=34,i++) planks+=`<rect x="-40" y="${y}" width="1100" height="30" fill="${i%2===0?light:dark}" opacity="0.55"/>`;
    return `<g clip-path="url(#rs-floor-clip)">${planks}</g>`;
  }
  if(floorItem.pattern==="carpet"){
    let dots="";
    for(let y=420;y<650;y+=22) for(let x=0;x<1000;x+=22) dots+=`<circle cx="${x+(Math.round(y)%44===0?0:11)}" cy="${y}" r="2" fill="${dark}" opacity="0.35"/>`;
    return `<g clip-path="url(#rs-floor-clip)">${dots}</g>`;
  }
  if(floorItem.pattern==="checker"){
    let squares=""; const size=62; let row=0;
    for(let y=350;y<660;y+=size,row++){ let col=0; for(let x=-80;x<1080;x+=size,col++){ if((row+col)%2===0) squares+=`<rect x="${x}" y="${y}" width="${size}" height="${size}" fill="${dark}" opacity="0.85"/>`; } }
    return `<g clip-path="url(#rs-floor-clip)">${squares}</g>`;
  }
  return "";
}

/* ================================================================
   Placement rules: zones, hidden-grid snapping, overlap prevention,
   and surface stacking (small items resting on desks/shelves).
   ================================================================ */
const WALL_Y_MIN=10, WALL_Y_MAX=55;
const FLOOR_Y_MIN=66, FLOOR_Y_MAX=97;

function floorXRangeAtY(yPct){
  // mirrors the room-shell floor trapezoid: narrow at the back wall, wide up front
  const t=Math.max(0,Math.min(1,(yPct-64.6)/(100-64.6)));
  return [17-t*17, 83+t*17];
}
function clampToZone(it,x,y){
  if(it.placement==="wall"){
    y=Math.max(WALL_Y_MIN,Math.min(WALL_Y_MAX,y));
    x=Math.max(6,Math.min(94,x));
  } else {
    y=Math.max(FLOOR_Y_MIN,Math.min(FLOOR_Y_MAX,y));
    const [lo,hi]=floorXRangeAtY(y);
    const pad=(it.w||14)*0.25;
    x=Math.max(lo-pad,Math.min(hi+pad,x));
  }
  return {x,y};
}
function snapToGrid(it,x,y){
  const step=it.placement==="wall"?4:3;
  return {x:Math.round(x/step)*step, y:Math.round(y/step)*step};
}
function floorFootprint(it,x,y){
  const halfW=(it.w||14)*0.5*0.75, halfH=4.5;
  return {x1:x-halfW,x2:x+halfW,y1:y-halfH,y2:y+halfH};
}
function rectsOverlap(a,b){ return a.x1<b.x2 && a.x2>b.x1 && a.y1<b.y2 && a.y2>b.y1; }
function floorCollides(dragId,it,x,y){
  if(it.cat==="rugs") return false; // rugs may appear beneath furniture
  const boxA=floorFootprint(it,x,y);
  for(const [id,pos] of Object.entries(ROOM.placed)){
    if(id===dragId) continue;
    const other=shopItem(id); if(!other||other.placement!=="floor"||other.cat==="rugs"||pos.onSurface) continue;
    if(rectsOverlap(boxA, floorFootprint(other,pos.x,pos.y))) return true;
  }
  return false;
}
function findSurfaceHotspot(dragId,x,y){
  for(const [id,pos] of Object.entries(ROOM.placed)){
    if(id===dragId||pos.onSurface) continue;
    const it=shopItem(id); if(!it||!it.surface) continue;
    const hy=pos.y-(it.hz||8);
    if(Math.hypot(pos.x-x,hy-y)<9) return id;
  }
  return null;
}
function sortKey(id,pos){
  const it=shopItem(id); if(!it) return pos.y;
  if(it.cat==="rugs") return -1000+pos.y;
  if(pos.onSurface){ const parent=ROOM.placed[pos.onSurface]; return (parent?parent.y:pos.y)+0.5; }
  return pos.y;
}
function findFreeSpot(it){
  let x=Math.round(28+Math.random()*44), y=Math.round(it.y||(it.placement==="wall"?28:82));
  ({x,y}=clampToZone(it,x,y));
  if(it.placement==="wall"||it.cat==="rugs"||!floorCollides(null,it,x,y)) return {x,y};
  for(let i=0;i<10;i++){
    const tryX=Math.max(6,Math.min(94,x+(Math.random()*40-20)));
    const c=clampToZone(it,tryX,y);
    if(!floorCollides(null,it,c.x,c.y)) return c;
  }
  return {x,y}; // give up gracefully rather than blocking the purchase
}

function paintStage(){
  const stage=$("#stage"); if(!stage) return;
  const sorted=Object.entries(ROOM.placed).sort((a,b)=>sortKey(a[0],a[1])-sortKey(b[0],b[1]));
  const stickers=sorted.map(([id,pos])=>{
    const it=shopItem(id); if(!it) return "";
    const flip=pos.flip?" scaleX(-1)":"";
    const w=pos.onSurface?(it.w||14)*0.55:(it.w||14);
    const cls="sticker"+(id===selectedId?" selected":"")+(pos.onSurface?" on-surface":"");
    return `<button class="${cls}" data-sid="${id}" style="left:${pos.x}%;top:${pos.y}%;width:${w}%;transform:translate(-50%,-100%)${flip}" aria-label="${it.name}">${itemArt(id,'stage')}</button>`;
  }).join("");
  const empty = Object.keys(ROOM.placed).length? "" : `<div class="room-empty">Your room is looking empty!<br>Buy furniture, beds &amp; decorations from the shop&nbsp;${ic('arrowR')}</div>`;
  stage.innerHTML = roomShellSVG() + empty + stickers;
  $$(".sticker",stage).forEach(el=>{
    el.addEventListener("pointerdown",e=>{
      if(!roomEditing) return;
      const id=el.dataset.sid;
      dragState={el, id, stage, moved:false, startX:e.clientX, startY:e.clientY, origin:{...ROOM.placed[id]}};
      if(el.setPointerCapture&&e.pointerId!=null){ try{el.setPointerCapture(e.pointerId);}catch(_){} }
      if(e.preventDefault) e.preventDefault();
    });
  });
  stage.onpointerdown=(e)=>{ if(e.target===stage||e.target.classList.contains("room-shell-svg")) deselectItem(); };
}

function placeItem(id){
  const it=shopItem(id)||{};
  const {x,y}=findFreeSpot(it);
  ROOM.placed[id]={x,y,flip:false,onSurface:null};
}

/* ================================================================
   Selection, edit panel (Move / Rotate / Replace / Store), and an
   undo history so layout changes are never scary to try.
   ================================================================ */
let nudgeArmed=false, replaceOpen=false;

function catLabel(cat){ return {furniture:"furniture",decor:"decoration",beds:"bed",rugs:"rug"}[cat]||"item"; }

function selectItem(id){
  if(!ROOM.placed[id]) return;
  selectedId=id; nudgeArmed=false; replaceOpen=false;
  paintStage(); renderEditPanel();
}
function deselectItem(){
  if(!selectedId) return;
  selectedId=null; nudgeArmed=false; replaceOpen=false;
  paintStage(); renderEditPanel();
}

function renderEditPanel(){
  const host=$("#bed-editpanel"); if(!host) return;
  const id=selectedId, pos=id&&ROOM.placed[id];
  if(!id||!pos){ host.innerHTML=""; return; }
  const it=shopItem(id); if(!it){ host.innerHTML=""; return; }
  const statusText = pos.onSurface ? "On a surface" : "In your room";
  const siblings = (SHOP[it.cat]||[]).filter(s=>owns(s.id)&&s.id!==id);
  const styleRow = !replaceOpen ? "" : (siblings.length
    ? `<div class="mlr-ep-styles"><h4>Swap for an owned ${catLabel(it.cat)}</h4><div class="mlr-ep-style-row">
        ${siblings.map(s=>`<button class="mlr-ep-style" data-swap="${s.id}" title="${s.name}">${itemArt(s.id,'panel')}</button>`).join("")}
       </div></div>`
    : `<p class="mlr-ep-hint">You don't own another ${catLabel(it.cat)} yet — check the Store!</p>`);
  host.innerHTML=`
    <div class="mlr-editpanel">
      <div class="mlr-ep-head">
        <div class="mlr-ep-title">
          <div class="mlr-ep-art">${itemArt(id,'panelhead')}</div>
          <div><div class="mlr-ep-name">${it.name}</div><span class="mlr-ep-status equipped">${statusText}</span></div>
        </div>
        <button class="mlr-ep-close" id="ep-close" aria-label="Close editor">&times;</button>
      </div>
      <div class="mlr-ep-actions">
        <button class="mlr-ep-btn${nudgeArmed?' on':''}" id="ep-move">${ic('move')} Move</button>
        ${it.rot?`<button class="mlr-ep-btn" id="ep-rotate">${ic('rotate')} Rotate</button>`:""}
        <button class="mlr-ep-btn${replaceOpen?' on':''}" id="ep-replace">${ic('swap')} Replace</button>
        <button class="mlr-ep-btn danger" id="ep-store">${ic('box')} Store</button>
      </div>
      <p class="mlr-ep-hint">${nudgeArmed?"Use the arrow keys to nudge it, or drag it in the room.":"Drag the item in the room to move it."}</p>
      ${styleRow}
    </div>`;
  $("#ep-close").onclick=()=>deselectItem();
  $("#ep-store").onclick=()=>storeSelected();
  $("#ep-move").onclick=()=>{ nudgeArmed=!nudgeArmed; renderEditPanel(); };
  $("#ep-replace").onclick=()=>{ replaceOpen=!replaceOpen; renderEditPanel(); };
  const rotBtn=$("#ep-rotate"); if(rotBtn) rotBtn.onclick=()=>rotateSelected();
  $$("[data-swap]",host).forEach(b=>b.onclick=()=>replaceSelected(b.dataset.swap));
}

function nudgeSelected(dx,dy){
  const id=selectedId, pos=id&&ROOM.placed[id], it=id&&shopItem(id);
  if(!id||!pos||!it) return;
  const target=clampToZone(it,pos.x+dx,pos.y+dy);
  if(it.placement==="floor" && !pos.onSurface && floorCollides(id,it,target.x,target.y)) return;
  pushHistory();
  ROOM.placed[id]={...pos,x:target.x,y:target.y};
  saveProfile(); paintStage(); renderEditPanel();
}

function rotateSelected(){
  const id=selectedId, pos=id&&ROOM.placed[id]; if(!pos) return;
  pushHistory();
  ROOM.placed[id]={...pos, flip:!pos.flip};
  Audio.click(); saveProfile(); paintStage(); renderEditPanel();
}

function replaceSelected(newId){
  const oldId=selectedId, pos=oldId&&ROOM.placed[oldId]; if(!pos) return;
  pushHistory();
  delete ROOM.placed[oldId];
  ROOM.placed[newId]={x:pos.x,y:pos.y,flip:pos.flip||false,onSurface:pos.onSurface||null};
  selectedId=newId; replaceOpen=false;
  Audio.click(); confetti.burst(60); saveProfile(); paintStage(); renderCloset(); renderBedStoreGrid(); renderEditPanel();
}

function storeSelected(){
  const id=selectedId; if(!id) return;
  pushHistory();
  delete ROOM.placed[id];
  selectedId=null; nudgeArmed=false; replaceOpen=false;
  Audio.click(); saveProfile(); paintStage(); renderCloset(); renderBedStoreGrid(); renderEditPanel();
}

function snapshotRoom(){
  return JSON.parse(JSON.stringify({wallpaper:ROOM.wallpaper,floor:ROOM.floor,curtains:ROOM.curtains,owned:ROOM.owned,placed:ROOM.placed}));
}
function pushHistory(){
  roomHistory.push(snapshotRoom());
  if(roomHistory.length>ROOM_HISTORY_MAX) roomHistory.shift();
  syncUndoBtn();
}
function syncUndoBtn(){ const b=$("#bed-undo"); if(b) b.disabled=!roomHistory.length; }
function undoLast(){
  if(!roomHistory.length) return;
  const snap=roomHistory.pop();
  ROOM.wallpaper=snap.wallpaper; ROOM.floor=snap.floor; ROOM.curtains=snap.curtains;
  ROOM.owned=snap.owned; ROOM.placed=snap.placed;
  selectedId=null; nudgeArmed=false; replaceOpen=false;
  Audio.click(); saveProfile(); renderBedTab();
}
function resetLayout(){
  if(!confirm("Reset your room? Wallpaper, flooring, curtains, and every placed item will go back to the start. You'll keep everything you've bought.")) return;
  pushHistory();
  ROOM.placed={};
  ROOM.wallpaper=ROOM_DEFAULTS.wallpaper; ROOM.floor=ROOM_DEFAULTS.floor; ROOM.curtains=ROOM_DEFAULTS.curtains;
  selectedId=null; nudgeArmed=false; replaceOpen=false;
  Audio.click(); toast(ic('refresh'),"Room reset!");
  saveProfile(); renderBedTab();
}

/* ================================================================
   App state + rendering
   ================================================================ */
const S={ grade:null, story:null, flow:null, idx:0, unlocked:0,
  xp:0, stars:0, correct:0, totalQ:0, attempts:0, streak:0, bestStreak:0,
  startTime:0, bloom:{}, genreHint:0 };

const root=()=>$("#root");

function renderHome(){
  S.story=null; S.flow=null; Audio.stopMusic(); setMusicBtn(false); setTopProgress(0);
  const GI={K:"teddy","1":"balloon","2":"chick","3":"rocket","4":"telescope","5":"compass","6":"gear","7":"flask","8":"globe","9":"books","10":"cap","11":"building","12":"brain"};

      <span class="g-lex">${g.lexile}</span>

  <div class="screen">

      <div class="sub">Pick a grade to begin. Everything adjusts automatically: reading level, story length, vocabulary, and question difficulty.</div>
      ${totalXP>0?`<div class="home-level">${ic(levelProgress(totalXP).cur.icon)} Level ${levelProgress(totalXP).i+1} · ${levelProgress(totalXP).cur.name} — ${totalXP} XP</div>`:""}
    </section>
    <div class="section-title">Choose Your Grade Level
      <small>Kindergarten through 12th Grade</small>
    </div>
    <div class="grade-grid" id="grade-grid">${gcards}</div>
    <div class="save-row">
      <button class="save-btn" id="btn-save">${ic('download')} Save Progress</button>
      <button class="save-btn" id="btn-load">${ic('upload')} Load Progress</button>
      <input type="file" id="load-input" accept="application/json,.json" hidden />
    </div>
    <p class="save-note">Save your XP, coins, and room to a file so you never lose them — and reload it on any device.</p>
  </div>`;
  $$("#grade-grid .grade-btn").forEach(b=>{
    b.addEventListener("click",()=>{
      b.classList.add("selected");
      Audio.click();
      startStory(b.dataset.grade);
    });
  });

  $("#btn-load").onclick=()=>$("#load-input").click();
  $("#load-input").onchange=e=>{ const f=e.target.files&&e.target.files[0]; importProgress(f); e.target.value=""; };

function startStory(gid, opts){
  opts = opts || {};
  S.grade=gradeById(gid);
  let story;
  // Every grade — including 2nd/4th/10th, which used to default to a fixed
  // curated story — gets a fresh, non-repeating procedural story each visit.
  let guard=0;
  do{ story=generateStory(S.grade); guard++; }while(story.facts.id===(S._lastId)&&guard<5);
  S._lastId=story.facts.id;
  S.story=story;
  S.flow=buildFlow(story,S.grade);
  S.idx=0; S.unlocked=0; S.xp=0; S.stars=0; S.correct=0; S.attempts=0;
  S.streak=0; S.bestStreak=0; S.startTime=Date.now();
  S.compFirst=0; S.gramFirst=0; S.storyCoins=0;
  S.totalQ=S.flow.filter(f=>f.type==="check").length;
  S.grammarTotal=S.flow.filter(f=>f.type==="gram"||f.type==="gramtap"||f.type==="gramtype"||f.type==="grammatch").length;
  S.grammarCorrect=0;
  S.bloom={}; BLOOM.forEach(l=>S.bloom[l]={total:0,got:0});
  Audio.click(); renderStep();
}

function pct(){ const totalSteps=S.flow.length; return Math.round((S.idx)/(totalSteps-1)*100); }

function hud(){
  const comp=Math.min(100,Math.round(S.idx/(S.flow.length-1)*100));
  const lp=levelProgress(totalXP);
  return `<div class="hud" role="group" aria-label="Progress and score">
    <div class="lvlbox" aria-label="Level ${lp.i+1}, ${lp.cur.name}">
      <div class="lvltop">
        <span class="lvlname">${ic(lp.cur.icon)} Lv ${lp.i+1} · ${lp.cur.name}</span>
        <span class="lvlxp">${lp.nxt?`${lp.have}/${lp.need} XP`:"MAX"}</span>
      </div>
      <div class="track sm"><div class="fill gold" style="width:${lp.into}%"></div></div>
    </div>
    <div class="stat"><span aria-hidden="true">${ic('star')}</span><span>${S.stars}</span><span class="lbl">Stars</span></div>
    <div class="stat"><span aria-hidden="true">${ic('fire')}</span><span>${S.streak}</span><span class="lbl">Streak</span></div>
    <div class="progress">
      <div class="track"><div class="fill" style="width:${comp}%"></div></div>
      <div class="meta"><span>${S.story.facts.genre}</span><span>${comp}% complete</span></div>
    </div>
  </div>`;
}

function setTopProgress(p){
  p=Math.max(0,Math.min(100,p));
  const f=$("#topprogress-fill"), r=$("#topprogress-runner"), t=$("#topprogress");
  if(f) f.style.width=p+"%";
  if(r) r.style.left=p+"%";
  if(t) t.setAttribute("aria-valuenow",Math.round(p));
}
function renderStep(){
  const step=S.flow[S.idx];
  setTopProgress(S.flow.length>1? (S.idx/(S.flow.length-1))*100 : 0);
  if(!step){ renderResults(); return; }
  if(step.type==="page") renderPage(step);
  else if(step.type==="check") renderCheck(step);
  else if(step.type==="gramintro") renderGramIntro(step);
  else if(step.type==="gram") renderGram(step);
  else if(step.type==="gramtap") renderGramTap(step);
  else if(step.type==="gramtype") renderGramType(step);
  else if(step.type==="grammatch") renderGramMatch(step);
  // focus management for accessibility
  const h=root().querySelector("[data-focus]"); if(h) h.focus();
}

function renderPage(step){
  const pg=step.page, f=S.story.facts;
  const first=S.idx===0;
  const paras=pg.paragraphs.map(p=>`<p>${p}</p>`).join("");
  root().innerHTML=`
  <div class="screen">
    ${hud()}
    <article class="card page-card">
      <div class="scene" aria-hidden="false">${renderScene(pg.scene,f.objColor)}</div>
      <div class="page-body">
        <div class="page-eyebrow">${pg.eyebrow} • ${f.genre}</div>
        <h2 class="page-title" tabindex="-1" data-focus>${first?f.title:pg.eyebrow}</h2>
        <div class="prose">${paras}</div>

  $("#b-next").onclick=()=>{ narrateStop(); advance(); };
}

function narrateStop(){ if(narrating){speechSynthesis.cancel();narrating=false;setNarrateBtn(false);} }
function confirmLeave(){ return true; }

function advance(){
  // moving forward from a page: allowed (next may be a checkpoint that gates further)
  if(S.idx<S.flow.length-1){ S.idx++; S.unlocked=Math.max(S.unlocked,S.idx); Audio.click(); renderStep(); }
  else renderResults();
}

function renderCheck(step){
  const q=step.q, f=S.story.facts;

  const opts=q.options.map((o,i)=>`

function renderGramMatch(step){
  const it=step.item;
  const leftHtml = it.left.map((l,i)=>`<button class="match-item" data-i="${i}">${l.text}</button>`).join("");
  const rightHtml = it.right.map((r,i)=>`<button class="match-item" data-i="${i}">${r.text}</button>`).join("");

      </div>
      <h2 class="q-text" tabindex="-1" data-focus>${it.instruction}</h2>
      <div class="match-wrap">
        <div class="match-col" id="match-left">${leftHtml}</div>
        <div class="match-col" id="match-right">${rightHtml}</div>
      </div>
      <div class="hintbox" id="hint"><b>${ic('bulb')} Hint:</b> ${it.hint}</div>

      <div class="quiz-foot">
        <button class="nav-btn" id="b-back">${ic('arrowL')} Back</button>
        <span class="pagenum">Grammar skill: ${it.skill} • Match the pairs</span>
      </div>
    </section>
  </div>`;
  let wrong=0, matched=0;
  let selL=null, selR=null;
  const total=it.left.length;
  const leftBtns=$$("#match-left .match-item"), rightBtns=$$("#match-right .match-item");
  function tryMatch(){
    if(selL==null || selR==null) return;
    const bL=leftBtns[selL], bR=rightBtns[selR];
    if(it.left[selL].id === it.right[selR].id){
      bL.classList.remove("selected"); bR.classList.remove("selected");
      bL.classList.add("matched"); bR.classList.add("matched");
      bL.disabled=true; bR.disabled=true;
      Audio.correct(); matched++;
      selL=null; selR=null;
      if(matched===total){
        const firstTry=wrong===0;
        recordGrammar(firstTry);
        const fb=$("#fb"); fb.className="feedback good";
        fb.innerHTML=`${ic('checkc')} ${rand(firstTry?["All matched!","Perfect match!","You've got it!"]:["All matched!","Nice work!"])}`;
        if(firstTry){ confetti.burst(120); toast(ic('pencil'),`+${firstTryXP()} XP • Grammar!`); } else { confetti.burst(70); toast(ic('sparkles'),"Got it! +"+partialXP()+" XP"); }
        setTimeout(()=>advance(),1200);
      }
    } else {
      wrong++;
      bL.classList.add("wrong"); bR.classList.add("wrong"); Audio.wrong();
      const fb=$("#fb"); fb.className="feedback bad";
      fb.innerHTML=`${ic('xc')} ${rand(["Not a match.","Try a different pair.","Look again!"])}`;
      $("#hint").classList.add("show");
      setTimeout(()=>{ bL.classList.remove("wrong","selected"); bR.classList.remove("wrong","selected"); },700);
      selL=null; selR=null;
    }
  }
  leftBtns.forEach((btn,i)=>btn.addEventListener("click",()=>{
    if(btn.disabled) return;
    if(selL===i){ btn.classList.remove("selected"); selL=null; return; }
    if(selL!=null) leftBtns[selL].classList.remove("selected");
    selL=i; btn.classList.add("selected");
    tryMatch();
  }));
  rightBtns.forEach((btn,i)=>btn.addEventListener("click",()=>{
    if(btn.disabled) return;
    if(selR===i){ btn.classList.remove("selected"); selR=null; return; }
    if(selR!=null) rightBtns[selR].classList.remove("selected");
    selR=i; btn.classList.add("selected");
    tryMatch();
  }));
  $("#b-back").onclick=()=>{ if(S.idx>0){S.idx--;renderStep();} };
}

function recordGrammar(firstTry){
  S.grammarCorrect++;
  const gained = firstTry?firstTryXP():partialXP();
  S.xp += gained;
  const beforeLv=levelIndex(totalXP); totalXP+=gained; awardCoins(gained); const afterLv=levelIndex(totalXP);
  if(firstTry){ S.stars+=1; S.gramFirst++; S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak); } else { S.streak=0; }
  if(afterLv>beforeLv){ setTimeout(()=>levelUp(afterLv),750); }
  saveProfile();
}

function firstTryXP(){ return S.grade.xpPer; }
function partialXP(){ return Math.round(S.grade.xpPer*0.5); }

function recordAnswer(level, firstTry){
  S.correct++; // counts a checkpoint as passed
  S.bloom[level].total++; S.bloom[level].got += firstTry?1:0.5;
  const gained = firstTry?firstTryXP():partialXP();
  S.xp += gained;
  const beforeLv = levelIndex(totalXP);
  totalXP += gained; awardCoins(gained);
  const afterLv = levelIndex(totalXP);
  if(firstTry){ S.stars += 1; S.compFirst++; S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak); }
  else { S.streak=0; }
  if(afterLv>beforeLv){ setTimeout(()=>levelUp(afterLv), 750); }
  else {
    if(S.streak===3) toast(ic('fire'),"3 in a row! Reading streak!");
    if(S.streak===5) toast(ic('trophy'),"5 streak! You're on fire!");
  }
  saveProfile();
}

      <button class="btn-primary" id="r-new">${ic('sparkles')} New Story</button>
      <button class="btn-ghost" id="r-home">${ic('home')} Return Home</button>
    </div>
  </div>`;
  $("#r-replay").onclick=()=>{ S.idx=0;S.unlocked=0;S.xp=0;S.stars=0;S.correct=0;S.streak=0;S.startTime=Date.now();
    S.compFirst=0;S.gramFirst=0;S.grammarCorrect=0;
    BLOOM.forEach(l=>S.bloom[l]={total:0,got:0}); Audio.click(); renderStep(); };
  $("#r-new").onclick=()=>{ startStory(S.grade.id, {forceProcedural:true}); };
  $("#r-home").onclick=()=>{ renderHome(); };
}

   Teacher Mode content
   ================================================================ */
function vocabList(f, grade){
  // grade-scaled vocabulary drawn from the story + a tiered word bank
  const base=[
    {word:"explore", def:"to travel through a place to discover new things"},
    {word:"courage", def:"the strength to do something even when you feel afraid"},
    {word:"journey", def:"a trip from one place to another, often a long one"},
    {word:"obstacle", def:"something that blocks your way or makes a task hard"},
    {word:"discover", def:"to find or learn about something for the first time"}
  ];
  const upper=[
    {word:"determined", def:"having a firm decision to do something and not give up"},
    {word:"resolution", def:"the part of a story where the main problem is solved"},
    {word:"perseverance", def:"continuing to try even when things are difficult"},
    {word:"reluctant", def:"unwilling or hesitant to do something"},
    {word:"consequence", def:"a result or effect of an action or choice"}
  ];
  const high=[
    {word:"ambivalent", def:"having mixed or contradictory feelings about something"},
    {word:"tenacity", def:"the quality of being determined and refusing to quit"},
    {word:"catalyst", def:"a person or event that causes a big change"},
    {word:"resilience", def:"the ability to recover quickly from difficulty"},
    {word:"epiphany", def:"a sudden, striking realization or understanding"}
  ];
  let list=[...base];
  if(grade.band>=2) list=list.concat(upper);
  if(grade.band>=4) list=list.concat(high);
  // add a story-specific word
  list.unshift({word:f.objName, def:`a key object in this story (${article(f.objColor)} ${f.objColor} ${f.objName})`});
  return list;
}

function standardsFor(grade){
  const g=grade.id;
  const map={
    "K":["RL.K.1 Ask & answer questions about key details","RL.K.3 Identify characters, settings, major events"],
    "1":["RL.1.1 Ask & answer questions about key details","RL.1.3 Describe characters, settings, and events"],
    "2":["RL.2.1 Ask & answer who/what/where/when/why/how","RL.2.5 Describe overall story structure"],
    "3":["RL.3.1 Refer explicitly to text for answers","RL.3.3 Describe characters & how actions drive events"],
    "4":["RL.4.1 Refer to details & examples when explaining","RL.4.3 Describe a character/setting drawing on details"],
    "5":["RL.5.1 Quote accurately from a text","RL.5.2 Determine theme from details in the text"],
    "6":["RL.6.1 Cite textual evidence to support analysis","RL.6.3 Describe how plot unfolds & characters change"],
    "7":["RL.7.1 Cite several pieces of textual evidence","RL.7.3 Analyze how elements of a story interact"],
    "8":["RL.8.1 Cite evidence that most strongly supports analysis","RL.8.3 Analyze how dialogue/incidents propel action"],
    "9":["RL.9-10.1 Cite strong & thorough textual evidence","RL.9-10.3 Analyze how complex characters develop"],
    "10":["RL.9-10.2 Determine theme & analyze its development","RL.9-10.5 Analyze how an author structures a text"],
    "11":["RL.11-12.1 Cite evidence, including inferences","RL.11-12.3 Analyze impact of author's choices"],
    "12":["RL.11-12.2 Determine two or more themes & their interaction","RL.11-12.5 Analyze how structure contributes to meaning"]
  };
  return map[g]||map["5"];
}

function buildTeacherContent(){
  if(!S.story){ return `<p style="font-family:var(--font-body)">Start a story first, then open Teacher Mode to see the answer key, standards, vocabulary, and printable worksheet for that exact story.</p>`; }
  const f=S.story.facts, grade=S.grade;
  const checks=S.flow.filter(x=>x.type==="check");
  const keyLetters=["A","B","C","D"];
  const answerKey=checks.map((c,i)=>{
    const q=c.q;
    const lines=q.options.map((o,oi)=>`<div class="opt-line ${oi===q.correct?"ans":""}">${keyLetters[oi]}. ${o} ${oi===q.correct?ic('check')+" correct":""}</div>`).join("");
    return `<div class="akey"><div class="qh"><span class="bloom-badge bloom-${q.level}">${q.level}</span> Q${i+1}. ${q.q}</div>${lines}<div class="opt-line" style="margin-top:6px;color:var(--muted)">Hint given: ${q.hint}</div></div>`;
  }).join("");
  const gramItems=S.flow.filter(x=>x.type==="gram"||x.type==="gramtap"||x.type==="gramtype"||x.type==="grammatch");
  const gramKey=gramItems.map((c,i)=>{
    const it=c.item;
    if(it.type==="tap"){
      const line=it.words.map((w,wi)=>`<span class="${it.correct.includes(wi)?"ans":""}" style="${it.correct.includes(wi)?"font-weight:700;text-decoration:underline":""}">${w}</span>`).join(" ");
      return `<div class="akey"><div class="qh"><span class="bloom-badge gram-badge">${it.skill}</span> G${i+1}. ${it.instruction}</div><div class="opt-line">Sentence: ${line}.</div><div class="opt-line ans">Answer: the underlined word</div><div class="opt-line" style="margin-top:4px;color:var(--muted)">Hint: ${it.hint}</div></div>`;
    }
    if(it.type==="type"){
      return `<div class="akey"><div class="qh"><span class="bloom-badge gram-badge">${it.skill}</span> G${i+1}. ${it.q}</div><div class="opt-line ans">Answer: ${it.answer}</div><div class="opt-line" style="margin-top:4px;color:var(--muted)">Hint: ${it.hint}</div></div>`;
    }
    if(it.type==="match"){
      const lines=it.left.map(l=>`<div class="opt-line ans">${l.text} → ${it.right.find(r=>r.id===l.id).text}</div>`).join("");
      return `<div class="akey"><div class="qh"><span class="bloom-badge gram-badge">${it.skill}</span> G${i+1}. ${it.instruction}</div>${lines}<div class="opt-line" style="margin-top:4px;color:var(--muted)">Hint: ${it.hint}</div></div>`;
    }
    const lines=it.options.map((o,oi)=>`<div class="opt-line ${oi===it.correct?"ans":""}">${keyLetters[oi]}. ${o} ${oi===it.correct?ic('check')+" correct":""}</div>`).join("");
    return `<div class="akey"><div class="qh"><span class="bloom-badge gram-badge">${it.skill}</span> G${i+1}. ${it.q}</div>${lines}<div class="opt-line" style="margin-top:4px;color:var(--muted)">Hint: ${it.hint}</div></div>`;
  }).join("");
  const vocab=vocabList(f,grade).map(v=>`<div class="v"><b>${cap(v.word)}</b> — ${v.def}</div>`).join("");
  const stds=standardsFor(grade).map(s=>`<li>${s}</li>`).join("");
  const estMin = Math.max(6, Math.round(S.story.wordCount/ (grade.band<=1?60: grade.band===2?110: grade.band===3?160:200)) + S.totalQ*1.2);
  const discussion=[
    `How did ${f.protagonist} change from the beginning of the story to the end?`,
    `What was the most important decision ${f.protagonist} made, and why?`,
    `The story's theme is that ${f.theme}. Where do you see that idea in the plot?`,
    `How did ${f.companion} help ${f.protagonist}? What does that show about teamwork?`,
    `If you were ${f.protagonist}, would you have done anything differently at ${f.setting}?`
  ].map(d=>`<li>${d}</li>`).join("");

  return `
  <div class="tabbar" role="tablist">
    <button class="tab on" data-tab="overview">Overview</button>
    <button class="tab" data-tab="key">Answer Key</button>
    <button class="tab" data-tab="vocab">Vocabulary</button>
    <button class="tab" data-tab="standards">Standards</button>
    <button class="tab" data-tab="teach">Discussion &amp; Extension</button>
  </div>

  <div class="tpanel on" data-panel="overview">
    <h4>Story Snapshot</h4>
    <div class="kv">
      <span class="k">Title</span><span>${S.story.title}</span>
      <span class="k">Genre</span><span>${f.genre}</span>
      <span class="k">Grade Level</span><span>${grade.label}</span>
      <span class="k">Estimated Lexile</span><span>${grade.lexile}</span>
      <span class="k">Word Count</span><span>${S.story.wordCount} words (${S.story.pages.length} pages)</span>
      <span class="k">Comprehension Qs</span><span>${S.totalQ} (Bloom's)</span>
      <span class="k">Grammar Challenges</span><span>${gramItems.length} (${[...new Set(gramItems.map(g=>g.item.skill))].join(", ")})</span>
      <span class="k">Bloom's Range</span><span>${BLOOM.slice(0,grade.bloomMax+1).join(" "+ic('arrowR')+" ")}</span>
      <span class="k">Est. Completion Time</span><span>~${estMin} minutes</span>
    </div>
    <h4>Story Elements (for reference)</h4>
    <div class="kv">
      <span class="k">Protagonist</span><span>${f.protagonist}</span>
      <span class="k">Companion</span><span>${cap(f.companion)}</span>
      <span class="k">Setting</span><span>${f.setting}</span>
      <span class="k">Conflict / Goal</span><span>To ${f.goal.short} — because ${f.goal.why}</span>
      <span class="k">Central Obstacle</span><span>${cap(f.obstacle)}</span>
      <span class="k">Climax</span><span>${f.climaxKey}</span>
      <span class="k">Resolution</span><span>${cap(f.protagonist)} ${f.resolution}</span>
      <span class="k">Theme</span><span>That ${f.theme}</span>
    </div>
    <h4>How to Use in Class</h4>
    <p>Whole-group: project on the interactive whiteboard and answer checkpoints together, discussing distractors. Centers/independent: students work at their own pace on tablets or Chromebooks. Intervention/tutoring: choose a grade band below the student's to build confidence. Homework: assign one story; the certificate is proof of completion.</p>
  </div>

  <div class="tpanel" data-panel="key">
    <h4>Comprehension — Answer Key &amp; Bloom's Levels</h4>
    <p>The correct choice for each question is highlighted in green below. Each question's Bloom's level is shown on its badge.</p>
    ${answerKey}
    ${gramKey?`<h4 style="margin-top:22px">Grammar — Answer Key</h4><p>Grammar challenges use words and characters from this story. The skill is shown on each badge.</p>${gramKey}`:""}
  </div>

  <div class="tpanel" data-panel="vocab">
    <h4>Vocabulary List (grade-scaled)</h4>
    <div class="vocab-list">${vocab}</div>
  </div>

  <div class="tpanel" data-panel="standards">
    <h4>Reading Standards (CCSS-ELA, Reading: Literature)</h4>
    <ul>${stds}</ul>
    <h4>Grammar / Language Standards (CCSS-ELA, Language)</h4>
    <ul>${[...new Set(gramItems.map(g=>g.item.skill))].map(sk=>`<li>${sk} — CCSS.ELA-Literacy.L.${grade.id==='K'?'K':grade.id}.1–2 (conventions of standard English)</li>`).join("")||"<li>No grammar items in this story.</li>"}</ul>
    <p style="color:var(--muted)">Also supports Bloom's Taxonomy progression: ${BLOOM.slice(0,grade.bloomMax+1).join(", ")}.</p>
  </div>

  <div class="tpanel" data-panel="teach">
    <h4>Discussion Questions</h4>
    <ol>${discussion}</ol>
    <h4>Extension Activity</h4>
    <p>In pairs, students design a "Chapter 2" for this story that keeps the theme (that ${f.theme}). They sketch one new setting and one new obstacle for ${f.protagonist}, then present it to the class.</p>
    <h4>Writing Prompt</h4>
    <p><i>${cap(f.protagonist)} learned that ${f.theme}.</i> Write about a time you learned a similar lesson. What happened, and what would you tell someone facing the same situation? (${grade.band<=1?"3–5 sentences":grade.band===2?"1 paragraph":grade.band===3?"2 paragraphs, with text evidence":"1 page, citing evidence from the story"}.)</p>
  </div>`;
}

function openTeacher(){
  $("#tm-body").innerHTML=buildTeacherContent();
  const modal=$("#teacher-modal"); modal.classList.add("show");
  $$("#tm-body .tab").forEach(t=>t.addEventListener("click",()=>{
    $$("#tm-body .tab").forEach(x=>x.classList.remove("on"));
    $$("#tm-body .tpanel").forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); $(`#tm-body .tpanel[data-panel="${t.dataset.tab}"]`).classList.add("on");
  }));
  $("#tm-close").focus();
}
function buildPrintArea(){
  if(!S.story){ $("#print-area").innerHTML="<p>Start a story first.</p>"; return; }
  const f=S.story.facts, grade=S.grade;
  const storyHtml=S.story.pages.map((p,i)=>`<h3>Page ${i+1}</h3>${p.paragraphs.map(x=>`<p>${x}</p>`).join("")}`).join("");
  const checks=S.flow.filter(x=>x.type==="check");
  const keyLetters=["A","B","C","D"];
  const qs=checks.map((c,i)=>{
    const q=c.q;
    return `<div style="margin:10px 0"><b>${i+1}. (${q.level})</b> ${q.q}<br>${q.options.map((o,oi)=>`${keyLetters[oi]}. ${o}`).join("&nbsp;&nbsp; ")}<br>Answer: _______</div>`;
  }).join("");
  const gramItems=S.flow.filter(x=>x.type==="gram"||x.type==="gramtap"||x.type==="gramtype"||x.type==="grammatch");
  const gs=gramItems.map((c,i)=>{
    const it=c.item;
    if(it.type==="tap"){
      return `<div style="margin:10px 0"><b>${i+1}. (${it.skill})</b> ${it.instruction}<br>“${it.words.join(" ")}.”<br>Circle the word: _______</div>`;
    }
    if(it.type==="type"){
      return `<div style="margin:10px 0"><b>${i+1}. (${it.skill})</b> ${it.q}<br>Answer: _______</div>`;
    }
    if(it.type==="match"){
      const rows=it.left.map(l=>`${l.text}: _______`).join("&nbsp;&nbsp; ");
      return `<div style="margin:10px 0"><b>${i+1}. (${it.skill})</b> ${it.instruction}<br>${rows}</div>`;
    }
    return `<div style="margin:10px 0"><b>${i+1}. (${it.skill})</b> ${it.q}<br>${it.options.map((o,oi)=>`${keyLetters[oi]}. ${o}`).join("&nbsp;&nbsp; ")}<br>Answer: _______</div>`;
  }).join("");
  $("#print-area").innerHTML=`
    <div style="font-family:Georgia,serif;color:#111;padding:20px;max-width:720px;margin:auto">
      <h1 style="margin:0">${S.story.title}</h1>
      <p style="color:#555">${grade.label} • ${f.genre} • Lexile ${grade.lexile} • Name: ______________________ Date: __________</p>
      <hr>
      ${storyHtml}
      <hr>
      <h2>Comprehension Questions</h2>
      ${qs}
      ${gs?`<hr><h2>Grammar Practice</h2>${gs}`:""}
      <hr>
      <p><b>Writing Prompt:</b> ${cap(f.protagonist)} learned that ${f.theme}. Write about a time you learned a similar lesson.</p>
    </div>`;
}

$("#btn-teacher").onclick=()=>{ openTeacher(); };
$("#btn-room").onclick=()=>{ Audio.click(); renderBedroom(); };
// drag handlers for room stickers (attached once)
document.addEventListener("pointermove",e=>{
  if(!dragState) return;
  const {el,id,stage,startX,startY}=dragState;
  if(!dragState.moved){
    if(Math.hypot(e.clientX-startX,e.clientY-startY)<4) return;
    dragState.moved=true;
    pushHistory();
    el.classList.add("dragging");
  }
  const it=shopItem(id); if(!it) return;
  const r=stage.getBoundingClientRect();
  let x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  ({x,y}=clampToZone(it,x,y));
  el.style.left=x+"%"; el.style.top=y+"%";
  ROOM.placed[id]={...ROOM.placed[id],x,y};
});
document.addEventListener("pointerup",()=>{
  if(!dragState) return;
  const {el,id,moved,origin}=dragState;
  const wasSelected=selectedId===id;
  dragState=null;
  if(el) el.classList.remove("dragging");
  if(!moved){
    if(wasSelected) deselectItem(); else selectItem(id);
    return;
  }
  const it=shopItem(id);
  if(!it||!ROOM.placed[id]){ saveProfile(); paintStage(); return; }
  let snapped=snapToGrid(it,ROOM.placed[id].x,ROOM.placed[id].y);
  snapped=clampToZone(it,snapped.x,snapped.y);
  let onSurface=null;
  if(it.dual){
    const host=findSurfaceHotspot(id,snapped.x,snapped.y);
    if(host){ const hp=ROOM.placed[host], hIt=shopItem(host); snapped={x:hp.x,y:hp.y-((hIt&&hIt.hz)||8)}; onSurface=host; }
  }
  const collides = it.placement==="floor" && !onSurface && floorCollides(id,it,snapped.x,snapped.y);
  if(collides){
    roomHistory.pop(); syncUndoBtn();
    ROOM.placed[id]={...origin};
    if(el){ el.style.left=origin.x+"%"; el.style.top=origin.y+"%"; el.classList.add("invalid"); }
    Audio.wrong(); toast(ic('close'),"Won't fit there — try another spot!");
    setTimeout(()=>{ if(el) el.classList.remove("invalid"); paintStage(); },400);
    saveProfile();
    return;
  }
  ROOM.placed[id]={x:snapped.x,y:snapped.y,flip:(ROOM.placed[id]&&ROOM.placed[id].flip)||false,onSurface};
  saveProfile();
  selectItem(id);
});
document.addEventListener("keydown",e=>{
  if(!nudgeArmed||!selectedId||bedTab!=="room") return;
  const step=2;
  if(e.key==="ArrowLeft"){ nudgeSelected(-step,0); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ nudgeSelected(step,0); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ nudgeSelected(0,-step); e.preventDefault(); }
  else if(e.key==="ArrowDown"){ nudgeSelected(0,step); e.preventDefault(); }
  else if(e.key==="Escape"){ deselectItem(); }
});
$("#tm-close").onclick=()=>$("#teacher-modal").classList.remove("show");
$("#teacher-modal").addEventListener("click",e=>{ if(e.target.id==="teacher-modal") e.currentTarget.classList.remove("show"); });
$("#btn-print").onclick=()=>{ buildPrintArea(); setTimeout(()=>window.print(),120); };

$("#btn-narrate").onclick=()=>{
  const step=S.flow&&S.flow[S.idx];
  if(step&&step.type==="page"){ narrate(step.page.paragraphs.join(" ")); }
  else if(step&&step.type==="check"){ narrate(step.q.q+". "+step.q.options.join(", ")); }
  else toast(ic('sound'),"Start a story to use narration");
};
function setMusicBtn(on){ const b=$("#btn-music"); b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); }
$("#btn-music").onclick=()=>{ const on=!$("#btn-music").classList.contains("on"); setMusicBtn(on); Audio.toggleMusic(on&&!Audio.isMuted()); };
$("#btn-mute").onclick=()=>{ const b=$("#btn-mute"); const muted=!b.classList.contains("on");
  b.classList.toggle("on",muted); b.setAttribute("aria-pressed",muted);
  b.innerHTML= (muted?ic("soundoff")+" Muted":ic("sound")+" Sound");
  Audio.setMuted(muted); if(muted) setMusicBtn(false);
};
let textStep=0;
$("#btn-text").onclick=()=>{ textStep=(textStep+1)%3; const scale=[1,1.15,1.32][textStep];
  document.documentElement.style.setProperty("--readscale",scale);
  toast(ic('text'),["Text: Normal","Text: Large","Text: Extra Large"][textStep]);
};
$("#btn-hc").onclick=()=>{ const on=document.body.classList.toggle("hc"); const b=$("#btn-hc");
  b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); };
$("#btn-cb").onclick=()=>{ const on=document.body.classList.toggle("cb"); const b=$("#btn-cb");
  b.classList.toggle("on",on); b.setAttribute("aria-pressed",on);
  toast(ic('eye'), on?"Colorblind-friendly palette on":"Standard palette"); };

// keyboard navigation
document.addEventListener("keydown",e=>{
  if($("#teacher-modal").classList.contains("show")){
    if(e.key==="Escape") $("#teacher-modal").classList.remove("show");
    return;
  }
  const step=S.flow&&S.flow[S.idx];
  if(!step) return;
  if(step.type==="page"){
    if(e.key==="ArrowRight"){ const n=$("#b-next"); if(n) n.click(); }
    if(e.key==="ArrowLeft"){ const p=$("#b-prev"); if(p&&!p.disabled) p.click(); }
  }
  if((step.type==="check"||step.type==="gram") && /^[1-4]$/.test(e.key)){
    const b=$$(".opt")[+e.key-1]; if(b&&!b.disabled) b.click();
  }
});

fillIcons();
loadProfile();
renderHome();
